  const q=INTERVIEW[i],r=S.interview[q.id]||{},pv=INTERVIEW[i-1],nx=INTERVIEW[i+1];
  setView('<div class="page-head"><a class="small" href="#/interview">Back to all questions</a><p class="small">Question '+(i+1)+" of "+INTERVIEW.length+"</p><h1 class=\"notranslate\">"+esc(q.q)+"</h1></div>"+

const FILLERS=/\b(um+|uh+|actually|basically|you know)\b/gi;
function ivCount(){
  const ta=$("#iv-ans"),el=$("#iv-count");if(!ta||!el)return;
  const t=ta.value.trim(),n=t?t.split(/\s+/).length:0,f=(t.match(FILLERS)||[]).length;

}

/* ===== TOTALS, XP, LEVELS, GOALS ===== */
function sumActs(from){
  const t={sec:0,act:{}};
  Object.keys(S.history).forEach(k=>{
    if(from&&k<from)return;
    const d=S.history[k];t.sec+=d.sec;
    Object.keys(d.act).forEach(a=>{t.act[a]=(t.act[a]||0)+d.act[a]});
  });
  return t;
}
/* XP: 1 per minute practised, plus points for each finished activity */
const XP_W={lesson:20,speak:2,words:5,grammar:10,tutor:3,chat:3,spell:2,game:10,interview:2,office:1,review:2,writing:5,dictation:2,assess:30};
function xpOf(t){let x=Math.floor(t.sec/60);Object.keys(t.act).forEach(a=>{x+=(XP_W[a]||1)*t.act[a]});return x}
const LV_NAMES=["Starter","Explorer","Speaker","Communicator","Confident speaker","Fluent speaker","Expert","Master"];
function lvlInfo(xp){
  let l=1;while(50*l*(l+1)<=xp)l++;
  const lo=50*(l-1)*l,hi=50*l*(l+1);
  return{l,name:LV_NAMES[Math.min(l-1,LV_NAMES.length-1)],xp,hi,p:(xp-lo)/(hi-lo)*100};
}
function weekStart(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function monthStart(){const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth(),1,12))}
function activeDaysFrom(from){return Object.keys(S.history).filter(k=>k>=from&&isActive(k)).length}
function weeklyChallenge(){
  const ws=weekStart(),t=sumActs(ws);
  return[
    {t:"Practise on 5 days this week",n:activeDaysFrom(ws),g:5},
    {t:"Speak 40 sentences this week",n:t.act.speak||0,g:40},
    {t:"Learn or review 20 words this week",n:(t.act.words||0)+(t.act.review||0),g:20}
  ];
}
function monthlyGoal(){return{n:Math.floor(sumActs(monthStart()).sec/60),g:S.settings.target*20}}
/* Average of all scores in a range of days (0 = today) */
function avgRange(a,b){
  let n=0,sum=0;
  for(let i=a;i<=b;i++){const d=S.history[daysAgo(i)];if(d)Object.values(d.scores).forEach(c=>{n+=c.n;sum+=c.sum})}
  return n?sum/n:null;
}
function improvement(){const a=avgRange(0,6),b=avgRange(7,13);return a==null||b==null?null:Math.round(a-b)}

/* ===== MISTAKES AND THE LEARNING PLAN ===== */
function recordFixes(fixes){
  if(!fixes||!fixes.length)return;
  S.mist=S.mist||{};
  fixes.forEach(f=>{const m=S.mist[f.why]||(S.mist[f.why]={n:0});m.n++;m.bad=String(f.bad).slice(0,80);m.good=String(f.good).slice(0,80);m.d=todayKey()});
  save();
}
function topicOf(why){for(const r of RULE_TOPIC)if(r[0].test(why))return r[1];return null}
function whyLocal(why){const t=WHY_T[why];return t?mean(t[0],t[1]):""}
function planFromFixes(fixes){
  const c={};fixes.forEach(f=>{const k=topicOf(f.why);if(k&&GRAMMAR[k])c[k]=(c[k]||0)+1});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>({t:"Practise "+GRAMMAR[k].t,d:c[k]+(c[k]===1?" mistake":" mistakes")+" of this kind. Open Grammar, then "+GRAMMAR[k].t+"."}));
}
function betterWords(text){return BETTER_WORDS.filter(b=>b[0].test(text)).map(b=>[b[1],b[2]]).slice(0,6)}
const SKILL_PAGE={grammar:["Grammar","#/grammar"],vocabulary:["Vocabulary Game","#/game"],reading:["Daily Lessons","#/lessons"],listening:["Spelling Practice: sentences","#/spelling/sentences"],writing:["Writing Coach","#/writing"],speaking:["Speaking Practice","#/speaking"]};
const SKILL_NAME={grammar:"Grammar",vocabulary:"Vocabulary",reading:"Reading",listening:"Listening",writing:"Writing",speaking:"Speaking"};
/* Up to four next steps, chosen from the learner's own results */
function recommendations(){
  const out=[];
  if(!S.assess)out.push({t:"Take the level test",d:"15 questions. It finds your level and the skills to work on.",h:"#/assessment",ic:"test"});
  const due=srsDue().length;
  if(due)out.push({t:"Review "+due+(due===1?" item":" items")+" today",d:"Words and sentences come back at the right time, so you remember them.",h:"#/review",ic:"refresh"});
  const mt={};Object.keys(S.mist||{}).forEach(w=>{const k=topicOf(w);if(k&&GRAMMAR[k])mt[k]=(mt[k]||0)+S.mist[w].n});
  const tk=Object.keys(mt).sort((a,b)=>mt[b]-mt[a])[0];
  if(tk&&mt[tk]>=2){const g=S.grammar[tk];out.push({t:"Practise "+GRAMMAR[tk].t,d:"You made "+mt[tk]+" mistakes of this kind in your writing and chats"+(g?". Best quiz score "+g.best+"%.":"."),h:"#/grammar/"+tk,ic:"check"})}
  const areas=[["speaking","Speaking Practice","#/speaking"],["grammar","Grammar","#/grammar"],["spelling","Spelling Practice","#/spelling"],["writing","Writing Coach","#/writing"],["conversation","Talk with a Friend","#/friend"],["vocabulary","Vocabulary Game","#/game"]];
  let weak=null;
  areas.forEach(a=>{const r=areaAverage(a[0]);if(r&&r.n>=3&&r.avg<70&&(!weak||r.avg<weak.r.avg))weak={a,r}});
  if(weak)out.push({t:"Improve your "+weak.a[1]+" score",d:"Your average is "+weak.r.avg+"% from "+weak.r.n+" attempts.",h:weak.a[2],ic:"target"});
  if(S.assess){
    const sk=S.assess.skills,low=Object.keys(sk).filter(k=>sk[k]!=null&&sk[k]<60).sort((a,b)=>sk[a]-sk[b])[0];
    if(low&&!out.some(o=>o.h===SKILL_PAGE[low][1]))out.push({t:"Build your "+SKILL_NAME[low].toLowerCase()+" skill",d:"Your level test score was "+sk[low]+"%. Practise in "+SKILL_PAGE[low][0]+".",h:SKILL_PAGE[low][1],ic:"target"});
  }
  const nl=nextLesson();out.push({t:"Next lesson: "+nl.t,d:nl.goal,h:"#/lessons/"+nl.id,ic:"book"});
  return out.slice(0,4);
}

function backupHTML(){
  const undo=!!readLS(KEY+"_before_reset");
  return '<div class="card section"><h2>Back up and restore</h2><p class="small muted mt">Your progress is saved only in this browser. Download a backup file to keep it safe, or to move it to another phone or computer.</p>'+
    '<div class="row mt"><button class="btn primary" data-act="backup">'+ic("download")+'Download backup</button><label class="btn" for="restore-file">'+ic("upload")+'Restore from backup</label><input type="file" id="restore-file" accept=".json,application/json" class="visually-hidden">'+
    (undo?'<button class="btn" data-act="undo-reset">Undo last reset</button>':"")+"</div></div>";
}
function restoreFrom(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let o;try{o=JSON.parse(r.result)}catch(e){toast("Could not read this file.");return}
    if(!o||o.app!=="english-coach"||!o.data){toast("This file is not an English Coach backup.");return}
    if(!confirm("Replace your progress on this device with the backup from "+(o.date||"an earlier date")+"? Your current progress is kept as a copy."))return;
    writeLS(KEY+"_before_restore",JSON.stringify(S));
    const lang=S.settings.lang;S=normalize(o.data);S.settings.lang=lang;save();
    toast("Progress restored.");render();
  };
  r.onerror=()=>toast("Could not read this file.");
  r.readAsText(file);
}
document.addEventListener("change",e=>{if(e.target.id==="restore-file"){restoreFrom(e.target.files[0]);e.target.value=""}});

/* ===== SPACED REPETITION =====
   A word or sentence comes back 1 day later, then 3 days, 7 days, 14, 30 and 60.
   A mistake sends it back to 1 day. Reviewing early does not move it forward. */
const SRS_DAYS=[1,3,7,14,30,60];
function addDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return ymd(d)}
function srsResult(key,right,opt){
  opt=opt||{};
  const all=S.srs||(S.srs={}),it=all[key];
  if(!it){
    if(right&&!opt.add)return;
    all[key]=Object.assign({st:0,due:addDays(1),n:0},opt.data||{});return;
  }
  if(right){if(it.due>todayKey())return;it.st=Math.min(it.st+1,SRS_DAYS.length-1)}
  else it.st=0;
  it.due=addDays(SRS_DAYS[it.st]);it.n++;
}
function srsDue(){const t=todayKey(),a=S.srs||{};return Object.keys(a).filter(k=>a[k].due<=t)}

function renderReview(){
  const box=$("#rv-box");if(!box)return;

    return;

  const it=RV.list[RV.i];RV.checked=false;
  let q;
  if(it.kind==="word")q='<p class="small muted">Type the word you hear.</p><div class="mt">'+mean(it.w.b,it.w.h,it.w.e)+'</div><div class="row mt"><button class="btn" data-act="rv-hear">'+ic("speaker")+"Hear again</button></div>";
  else if(it.kind==="dict")q='<p class="small muted">Type the sentence you hear.</p><div class="row mt"><button class="btn" data-act="rv-hear">'+ic("speaker")+"Hear again</button></div>";
  else q='<p class="small muted">Type the correct sentence.</p><div class="note warn mt notranslate"><del>'+esc(it.bad)+"</del></div>"+(it.why?'<p class="small mt">'+esc(it.why)+"</p>":"");
  box.innerHTML='<p class="small muted">Item '+(RV.i+1)+" of "+RV.list.length+" | Correct "+RV.right+'</p><div class="mt">'+barHTML(RV.i/RV.list.length*100)+'</div><div class="mt">'+q+"</div>"+
    '<label class="field mt">Your answer'+(it.kind==="word"?'<input class="input" id="rv-in"':'<textarea class="input" id="rv-in" rows="2"')+' autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-enter="rv-check">'+(it.kind==="word"?"":"</textarea>")+"</label>"+
    '<div id="rv-res" class="mt" aria-live="polite"></div><button class="btn primary block mt" id="rv-btn" data-act="rv-check">Check</button><button class="btn block mt" data-act="rv-home">Stop</button>';

/* All English words used anywhere in the app, for the "possible spelling mistake" check */
function wordSet(){
  if(WORDSET)return WORDSET;
  const set=new Set(),add=t=>String(t||"").toLowerCase().replace(/[’‘]/g,"'").split(/[^a-z']+/).forEach(w=>{w=w.replace(/^'+|'+$/g,"");if(w)set.add(w)});
  WORDS.forEach(w=>{add(w.e);add(w.x)});
  ALL_LESSONS.forEach(l=>l.lines.forEach(x=>add(x[1])));
  Object.values(OFFICE).forEach(o=>o.phrases.forEach(p=>add(p[0])));
  EMAILS.forEach(m=>{add(m.s);add(m.b)});
  Object.values(GRAMMAR).forEach(g=>{g.sections.forEach(s=>{add(s.en);(s.ex||[]).forEach(add)});g.quiz.forEach(q=>{add(q[0]);q[1].forEach(add);add(q[3])})});
  INTERVIEW.forEach(q=>{add(q.q);add(q.a);add(q.tip)});
  STORIES.forEach(s=>s.s.forEach(add));
  Object.values(FRIEND_MODES).forEach(m=>m.qs.forEach(add));
  OFFICE_SCENES.forEach(c=>c.lines.forEach(l=>{add(l[1]);add(l[2])}));
  Object.values(SPELL_FIX).forEach(add);
  return WORDSET=set;
}
function known(w,set){
  if(set.has(w))return true;
  const stems=[w.replace(/'s$/,""),w.replace(/s$/,""),w.replace(/es$/,""),w.replace(/ed$/,""),w.replace(/d$/,""),w.replace(/ing$/,""),w.replace(/ing$/,"e"),w.replace(/ly$/,""),w.replace(/ies$/,"y"),w.replace(/ied$/,"y"),w.replace(/er$/,""),w.replace(/est$/,"")];
  return stems.some(s=>s!==w&&set.has(s));
}
function oneEditAway(a,b){
  if(Math.abs(a.length-b.length)>1||a===b)return false;
  let i=0,j=0,diff=0;
  while(i<a.length&&j<b.length){
    if(a[i]===b[j]){i++;j++;continue}
    if(++diff>1)return false;
    if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}
  }
  return diff+(a.length-i)+(b.length-j)<=1;
}
function keepCaseWord(from,to){return /^[A-Z]/.test(from)?to.charAt(0).toUpperCase()+to.slice(1):to}
/* Checks one line of text, sentence by sentence */
function writeCheckLine(line,typed){
  const parts=line.match(/[^.!?]+(?:[.!?]+|$)/g)||[];
  return parts.map(p=>p.trim()).filter(Boolean).map(sent=>{
    const spell=[],maybe=[],set=wordSet();
    const fixedSp=sent.replace(/[A-Za-z']+/g,(tok,off)=>{
      const lw=tok.toLowerCase();
      if(SPELL_FIX[lw]){const g=keepCaseWord(tok,SPELL_FIX[lw]);spell.push({bad:tok,good:g,why:"Check the spelling."});return g}
      if(lw.length>=4&&!(/^[A-Z]/.test(tok)&&off>0)&&!known(lw,set)){
        let cand=null;for(const w of set){if(w.length>=3&&oneEditAway(lw,w)){cand=w;break}}
        if(cand)maybe.push({bad:tok,good:cand});
      }
      return tok;
    });
    const words=fixedSp.split(/\s+/).filter(Boolean).length;
    const g=ruleCheck(fixedSp,typed&&words>=3);
    let pro=g.better;const proFix=[];
    PRO_FIX.forEach(r=>{pro=pro.replace(r[0],function(){const m=arguments[0],out=m.replace(r[0],r[1]);const o=keepCaseWord(m,out);if(o!==m)proFix.push({bad:m,good:o,why:"More professional."});return o})});
    return{orig:sent,corrected:g.better,pro,spell,maybe,grammar:g.fixes,proFix};
  });
}
function writeCheck(text,mode){
  const lines=text.split(/\n/);
  const res=lines.map(l=>l.trim()?writeCheckLine(l,true):[]);
  const all=[].concat.apply([],res);
  const join=k=>res.map(r=>r.map(s=>s[k]).join(" ")).join("\n");
  let pro=join("pro");
  const email=mode==="email"||(mode==="auto"&&lines.filter(l=>l.trim()).length>=3);
  const extra=[];
  if(email){
    const first=lines.find(l=>l.trim())||"";
    if(!/^\s*(dear|hi|hello|good (morning|afternoon|evening)|respected)\b/i.test(first)){pro="Dear [Name],\n\n"+pro;extra.push("Start an email with a greeting, such as \"Dear [Name],\".")}
    if(!/(regards|thank you|thanks|sincerely|best wishes)[,.!]?\s*(\n.*)?$/i.test(text.trim())){pro=pro.replace(/\s*$/,"")+"\n\nBest regards,\n"+S.settings.name;extra.push("End an email with a closing, such as \"Best regards,\" and your name.")}
  }
  return{sentences:all,corrected:join("corrected"),pro,email,extra};
}

/* ===== PAGES, BUTTONS AND SETTINGS ===== */
Object.assign(PAGES,{review:pageReview,writing:pageWriting,assessment:pageAssessment});
Object.assign(ACT,{
  backup(){
    const data=JSON.stringify({app:"english-coach",v:1,date:todayKey(),data:S},null,1);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download="english-coach-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Backup downloaded.");
  },
  "undo-reset"(){
    const raw=readLS(KEY+"_before_reset");if(!raw)return;
    if(!confirm("Bring back your progress from before the last reset? Anything you did since the reset will be replaced."))return;
    try{const lang=S.settings.lang;S=normalize(JSON.parse(raw));S.settings.lang=lang;save();try{localStorage.removeItem(KEY+"_before_reset")}catch(e){}toast("Your progress before the last reset was restored.");render()}catch(e){toast("Could not read the saved copy.")}
  },
  "rv-start"(){RV.list=shuffle(srsDue()).map(rvItem).filter(Boolean).slice(0,15);RV.i=0;RV.right=0;RV.stage=RV.list.length?"test":"home";renderReview()},
  "rv-home"(){stopSpeaking();RV.stage="home";renderReview()},
  "rv-hear":rvHear,
  "rv-check":rvCheck,
  "dc-start"(){DC.list=dictationList();DC.i=0;DC.right=0;DC.stage="test";renderDictation()},
  "dc-home"(){stopSpeaking();DC.stage="home";renderDictation()},
  "dc-hear"(){sayTimes(DC.list[DC.i],1,0.85)},
  "dc-slow"(){sayTimes(DC.list[DC.i],1,0.55)},
  "dc-check":dcCheck,
  "as-start"(){AS.stage="test";AS.i=0;AS.score=[];renderAssess()},
  "as-hear"(){say(ASSESS[AS.i].say,0.9)},
  "as-opt"(b){asNext(Number(b.dataset.i)===ASSESS[AS.i].ans?100:0)},
  "as-write"(){
    const t=$("#as-text").value.trim();
    if(!t){toast("Write something first.");$("#as-text").focus();return}
    const n=t.split(/\s+/).length,r=ruleCheck(t,true);recordFixes(r.fixes);
    let s=Math.max(0,100-25*r.fixes.length);if(n<5)s=Math.min(s,40);else if(n<8)s=Math.min(s,70);
    asNext(s);
  },
  "as-skip"(){Mic.abort();asNext(null)},
  "as-mic"(b){
    if(b.classList.contains("rec")){Mic.stop();return}
    const heard=$("#as-heard"),q=ASSESS[AS.i];setRec(b);heard.textContent="Listening... please speak now.";
    Mic.start({long:false,onText:t=>{heard.textContent=t;heard.classList.remove("empty")},
      onEnd:t=>{resetMicBtn(b);if(!t){heard.textContent=micErrorText("no-speech");return}const r=compareText(q.say,t);logAct("speak");logScore("speaking",r.score);asNext(r.score)},
      onError:c=>{resetMicBtn(b);heard.textContent=micErrorText(c)}});
  },
  "wr-check":writingShow,
  "wr-clear"(){WR.text="";$("#wr-text").value="";$("#wr-out").innerHTML="";$("#wr-text").focus()},
  async "wr-copy-pro"(){const ok=await copyText(WR.pro||"");toast(ok?"Copied.":"Could not copy. Please select the text by hand.")},
  async "wr-copy-ai"(){const ok=await copyText(writingAIText());toast(ok?"Copied. Paste it into Claude or ChatGPT.":"Could not copy automatically.")},
  "wr-ai"(b){writingAI(b)},
  "scene-alex"(){FR.topic="professional";location.hash="#/friend"}
});
Object.assign(CHG,{
  theme(v){S.settings.theme=v;save();applyTheme();toast("Theme saved.")},
  "wr-mode"(v){WR.mode=v}
});
Object.assign(INP,{"wr-text"(v){WR.text=v}});

/* Arrow keys move between tabs and stars, as screen reader users expect */
document.addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const t=e.target;if(!t.matches||!t.matches(".tabs .tab, .stars .star"))return;
  const list=$$(t.matches(".star")?".star":".tab",t.parentElement).filter(x=>!x.disabled);
  let i=list.indexOf(t)+(e.key==="ArrowRight"?1:-1);i=(i+list.length)%list.length;
  list[i].focus();if(t.matches(".star"))list[i].click();
  e.preventDefault();
});

/* ===== START ===== (runs last, after every page is defined) */
applyTheme();
buildNav();
save();
if(!storageOK){
  const w=$("#store-warn");w.textContent="Progress cannot be saved in this browser mode. It will be lost when you close this page.";w.classList.remove("hidden");
}
if(!startLanguage())render();
/* Send any feedback that was saved while offline */
window.addEventListener("load",()=>setTimeout(sendQueuedFeedback,3000));
window.addEventListener("online",sendQueuedFeedback);

})();
</script>
