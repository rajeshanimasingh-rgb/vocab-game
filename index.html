<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal English Speaking Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practise English speaking, vocabulary, grammar, office English and interviews, with Bengali and Hindi meanings.">
<meta name="theme-color" content="#1a56db">
<link rel="manifest" href="manifest.webmanifest">
<script data-goatcounter="https://rajesh-englishcoach.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="https://gc.zgo.at/count.js"></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Coach">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a56db'/%3E%3Crect x='12' y='6' width='8' height='14' rx='4' fill='white'/%3E%3Cpath d='M8 15a8 8 0 0 0 16 0M16 23v4' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0f2547;--ink-2:#465a78;--ink-3:#5f7290;
  --blue:#1a56db;--blue-d:#1442ab;--blue-l:#e8f0fe;--blue-xl:#f3f7ff;
  --line:#dfe7f3;--bg:#f4f7fc;--card:#ffffff;
  --good:#0f7a47;--good-bg:#e3f6ec;--bad:#c02626;--bad-bg:#fde8e8;--warn:#a15c00;--warn-bg:#fff3dc;
  --shadow:0 1px 2px rgba(15,37,71,.05),0 6px 20px rgba(15,37,71,.06);
  --r:16px;--side:244px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Nirmala UI","Noto Sans Bengali","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
h1{font-size:1.6rem;line-height:1.25;letter-spacing:-.01em}
h2{font-size:1.15rem;line-height:1.3}
h3{font-size:1rem;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
[lang=bn],[lang=hi]{line-height:1.6}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;font-weight:700;line-height:1.2}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:.76rem}
.nav{list-style:none;margin:0;padding:6px 10px 14px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover{background:var(--blue-xl);color:var(--ink)}
.nav a[aria-current=page]{background:var(--blue-l);color:var(--blue-d);font-weight:650}
.side-foot{margin-top:auto;padding:12px 16px;font-size:.8rem;color:var(--ink-3);border-top:1px solid var(--line)}
.main{margin-left:var(--side);min-height:100vh}
.topbar{display:none}
.view{max-width:1060px;margin:0 auto;padding:26px 24px 48px}
.page-head{margin-bottom:18px}
.page-head p{color:var(--ink-2);margin-top:4px}
.page-head h1:focus,#view h1[tabindex="-1"]:focus{outline:none}
.bottom-nav{display:none}
.scrim{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.grid>.card+.card{margin-top:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section{margin-top:22px}
.section>h2{margin-bottom:10px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--blue-xl);border-color:#c5d5ee}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--bad);border-color:#f1c4c4}
.btn.danger:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--blue);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--blue-l)}
.icon-btn.on{background:var(--blue-l);border-color:#a9c3f3}
.icon-btn.fav-on{color:#b45309;background:var(--warn-bg);border-color:#f0d49c}
.icon-btn.fav-on .ic{fill:currentColor}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.tab{flex:none;min-height:40px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.92rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--blue-xl)}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid #c8d5e8;border-radius:11px;background:#fff}
textarea.input{resize:vertical;min-height:84px}
.input:focus{border-color:var(--blue);outline:3px solid #cfdefb}
label.field{display:block;font-weight:600;font-size:.9rem}
label.field .input{margin-top:4px;font-weight:400;font-size:1rem}

/* progress */
.bar{height:9px;background:#e4ebf6;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--blue);border-radius:6px;transition:width .3s}
.bar.good>i{background:var(--good)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);font-size:.78rem;font-weight:650;white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge .ic{width:14px;height:14px}

/* dashboard */
.hero{background:linear-gradient(135deg,#1442ab,#1a56db 60%,#3b7bf0);color:#fff;border:0;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:22px}
.hero p{color:#dfe9ff}
.hero h1{color:#fff}
.hero .grow{min-width:220px}
.hero .btn{border-color:transparent}
.hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.24)}
.hero .btn.primary{background:#fff;color:var(--blue-d)}
.hero .btn.primary:hover{background:#e8f0fe}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:1.55rem;line-height:1.1}
.ring b small{display:block;font-size:.74rem;font-weight:500;color:#dfe9ff}
.stat .stat-ic{width:38px;height:38px;border-radius:11px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin-bottom:10px}
.stat b{display:block;font-size:1.65rem;line-height:1.15}
.stat span{color:var(--ink-2);font-size:.9rem}
.check-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.check-item:last-child{border-bottom:0}
.check-dot{width:26px;height:26px;border-radius:50%;border:2px solid #c3d1e6;display:grid;place-items:center;flex:none;color:#fff}
.check-dot .ic{width:15px;height:15px;stroke-width:3}
.check-item.done .check-dot{background:var(--good);border-color:var(--good)}
.quick{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;transition:transform .12s}
.quick:hover{border-color:#b9cdf0;transform:translateY(-1px)}
.quick .stat-ic{width:40px;height:40px;border-radius:11px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
.quick p{color:var(--ink-2);font-size:.85rem}

/* meanings & phrases */
.mean{display:grid;gap:2px;font-size:.95rem;color:var(--ink-2)}
.mean span::before{content:attr(data-l);display:inline-block;min-width:24px;margin-right:6px;padding:0 5px;border-radius:5px;background:var(--blue-l);color:var(--blue-d);font-size:.68rem;font-weight:700;text-align:center;vertical-align:1px;line-height:1.5}
.phrase{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .en{font-weight:600}
.speaker{font-size:.76rem;font-weight:700;color:var(--blue-d);text-transform:uppercase;letter-spacing:.04em}
.actions{display:flex;gap:6px;flex:none}
.practice-slot:empty{display:none}
.practice-slot{width:100%;margin-top:10px}

/* vocabulary */
.word-card h3{font-size:1.15rem}
.word-card .pron{color:var(--ink-3);font-size:.85rem}
.word-card .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--ink-2)}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink-3)}
.search .input{padding-left:40px}
.opt{display:block;width:100%;text-align:left;min-height:46px;padding:10px 14px;margin-top:8px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font-weight:500}
.opt:hover:not(:disabled){background:var(--blue-xl);border-color:#b9cdf0}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.note{padding:10px 12px;border-radius:11px;background:var(--blue-xl);border:1px solid #d6e3f8;font-size:.92rem}
.note.warn{background:var(--warn-bg);border-color:#f0d49c;color:#6b3d00}
.note.bad{background:var(--bad-bg);border-color:#f3c0c0;color:#8a1c1c}
.note.good{background:var(--good-bg);border-color:#b3e4ca;color:#0a5a34}
.game-word{font-size:2rem;font-weight:700;text-align:center;margin:8px 0}

/* speak box */
.speakbox{border:1px solid #cddcf4;background:var(--blue-xl);border-radius:14px;padding:14px}
.target{font-size:1.15rem;font-weight:650;line-height:1.4}
.mic-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.mic-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 20px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}
.mic-btn:hover{background:var(--blue-d)}
.mic-btn:disabled{background:#9db0cc;cursor:not-allowed}
.mic-btn.rec{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,38,38,.45)}70%{box-shadow:0 0 0 13px rgba(192,38,38,0)}100%{box-shadow:0 0 0 0 rgba(192,38,38,0)}}
.heard{min-height:48px;margin-top:10px;padding:10px 12px;background:#fff;border:1px dashed #b9cdf0;border-radius:11px}
.heard.empty{color:var(--ink-3)}
.type-row{display:flex;gap:8px;margin-top:10px}
.type-row .input{flex:1;min-width:0}
.result{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.score-pill{font-weight:700;font-size:1.1rem}
.w-ok{color:var(--ink)}
.w-bad,.w-miss,.w-extra{padding:0 3px;border-radius:4px;font-weight:650}
.w-bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.w-miss{background:var(--warn-bg);color:var(--warn);text-decoration:underline dotted}
.w-extra{background:#efe7fb;color:#5b2ca0;text-decoration:line-through}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;margin-top:8px;color:var(--ink-2)}
.mistakes{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.mic-state{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-2)}
.mic-state i{width:9px;height:9px;border-radius:50%;background:#9db0cc}
.mic-state.ok i{background:var(--good)}
.mic-state.no i{background:var(--bad)}

/* tutor */
.honest{display:flex;gap:10px;align-items:flex-start}
.chat{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere}
.msg.coach{align-self:flex-start;background:var(--blue-l);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.check{align-self:stretch;max-width:100%;background:#fff;border:1px solid var(--line)}
.msg .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.74rem;font-weight:700;opacity:.8;margin-bottom:2px}
.fix{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:.93rem}
.fix del{color:var(--bad)}
.fix ins{color:var(--good);text-decoration:none;font-weight:650}

#coach-status:empty{display:none}
#coach-status.on{background:var(--good-bg);color:var(--good)}
#coach-chat{max-height:420px;overflow-y:auto}

.stars{display:flex;gap:8px}
.star{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#c3cede;cursor:pointer;display:grid;place-items:center}
.star .ic{width:30px;height:30px}
.star.on{color:#d97706;background:var(--warn-bg);border-color:#f0d49c}
.star.on .ic{fill:currentColor}
#fb-liked .tab.on{background:var(--blue-l);border-color:#a9c3f3;color:var(--blue-d)}

/* email */
.email{white-space:pre-wrap;background:var(--blue-xl);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:.93rem;overflow-wrap:anywhere}

/* grammar table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ex-list{margin:8px 0 0;padding:0;list-style:none}
.ex-list li{display:flex;align-items:center;gap:8px;padding:3px 0}
.ex-list .icon-btn{width:40px;height:40px}
.ex-list .ic{width:16px;height:16px}

/* progress chart */
.chart{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;height:170px;align-items:end;border-bottom:1px solid #c8d5e8;margin-top:22px}
.chart .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.chart .col:hover{background:var(--blue-xl)}
.chart .col i{display:block;width:min(56%,36px);min-height:0;background:var(--blue);border-radius:4px 4px 0 0}
.chart .col.today i{background:var(--blue-d)}
.chart .col b{position:absolute;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:650;color:var(--ink-2)}
.chart .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:3;background:var(--ink);color:#fff;padding:5px 9px;border-radius:7px;font-size:.78rem;white-space:nowrap}
.chart .col:hover .tip,.chart .col:focus .tip{display:block}
.chart .col:first-child .tip{left:0;transform:none}
.chart .col:last-child .tip{left:auto;right:0;transform:none}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed #7f93b2;pointer-events:none;z-index:2}
.goal-line span{position:absolute;right:0;bottom:2px;font-size:.72rem;color:var(--ink-2);background:rgba(255,255,255,.88);padding:0 3px}
.chart-x{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:.78rem;color:var(--ink-2);margin-top:5px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;max-width:min(92vw,440px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:80;pointer-events:none;transition:all .2s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.store-warn{background:var(--warn-bg);color:#6b3d00;padding:8px 16px;font-size:.88rem;text-align:center}

/* language */
.nav-lang{padding:4px 12px 10px}
.nav-lang label{font-size:.8rem;color:var(--ink-2)}
.nav-lang select{min-height:38px;padding:5px 8px;font-size:.9rem}
.tr-copy{display:none;font-size:.95rem;color:var(--ink-2)}
body.lang-other .tr-copy{display:block}
body.lang-other .mean [lang]{display:none}
body.lang-bn .mean [lang=hi],body.lang-hi .mean [lang=bn]{display:none}
#harvest{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:16px}
#hv-box{max-width:480px;width:100%}
#hv-list{white-space:pre-wrap}
#gt-box{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
iframe.skiptranslate,.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}

/* responsive */
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(15,37,71,.2);width:min(82vw,290px)}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,37,71,.42);z-index:35}
  .main{margin-left:0;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:8px 16px;font-weight:700;min-height:56px}
  .topbar .icon-btn{border:0;background:transparent}
  .topbar .brand-mark{width:32px;height:32px;border-radius:9px}
  .view{padding:16px 16px 30px}
  h1{font-size:1.38rem}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a,.bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:.72rem;font-weight:600;color:var(--ink-3);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
  .bottom-nav [aria-current=page]{color:var(--blue-d)}
  .toast{bottom:82px}
}
@media (max-width:560px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hero{padding:18px;gap:16px}
  .ring{width:96px;height:96px}
  .ring b{font-size:1.25rem}
  .card{padding:15px}
  .stat b{font-size:1.4rem}
  .msg{max-width:92%}
  .type-row{flex-wrap:wrap}
  .type-row .btn{width:100%}
  .mic-btn{width:100%}
}
/* version 2.0 */
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
label.btn{cursor:pointer}
.xp b{font-size:1.4rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bdg{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;opacity:.85}
.bdg.on{opacity:1;border-color:#b3e4ca;background:var(--good-bg)}
.bdg .stat-ic{width:36px;height:36px;border-radius:10px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
.bdg.on .stat-ic{background:var(--good);color:#fff}
.bdg b{display:block;font-size:.92rem}
.bdg small{display:block;color:var(--ink-2);font-size:.8rem;margin-bottom:4px}
details.scene summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none;min-height:44px;justify-content:center}
details.scene summary::-webkit-details-marker{display:none}
details.scene summary b::after{content:" ▸";color:var(--blue)}
details.scene[open] summary b::after{content:" ▾"}
details.scene[open] summary{margin-bottom:8px}
.you{border-left:3px solid var(--blue);padding-left:10px;margin:4px 0}
#fr-status:empty{display:none}
#fr-status.on{background:var(--good-bg);color:var(--good)}
#fr-chat{max-height:460px;overflow-y:auto}

/* dark theme */
html.dark{color-scheme:dark;--ink:#e6edf7;--ink-2:#b1bfd4;--ink-3:#8fa0ba;--blue:#3d72e0;--blue-d:#a9c4ff;--blue-l:#1d2d4f;--blue-xl:#17233b;--line:#2a3a57;--bg:#0d1526;--card:#131e33;--good:#3fb57e;--good-bg:#12301f;--bad:#f07a7a;--bad-bg:#3a1a1a;--warn:#f0b35a;--warn-bg:#36280f;--shadow:none}
html.dark a{color:#9dbcff}
html.dark .input,html.dark select.input,html.dark textarea.input{background:#0f1a2e;border-color:#34476b}
html.dark .input:focus{outline-color:#2c4a86}
html.dark .heard,html.dark .result,html.dark .msg.check{background:var(--card)}
html.dark .heard{border-color:#34476b}
html.dark .speakbox{border-color:#2a3a57}
html.dark .topbar{background:rgba(19,30,51,.96)}
html.dark .bottom-nav{background:var(--card)}
html.dark .bar{background:#24324d}
html.dark .note{border-color:#2a3a57}
html.dark .note.warn{color:#f6d9a8;border-color:#5a4520}
html.dark .note.bad{color:#f7c4c4;border-color:#5a2a2a}
html.dark .note.good{color:#b5ecd0;border-color:#1f5a3c}
html.dark .w-extra{background:#2e2147;color:#d1b3ff}
html.dark .goal-line span{background:rgba(19,30,51,.9)}
html.dark .chart .tip,html.dark .toast{background:#e6edf7;color:#0d1526}
html.dark .chart{border-bottom-color:#34476b}
html.dark .check-dot{border-color:#3a4d70}
html.dark .mic-btn:disabled{background:#3a4d70}
html.dark .store-warn{color:#f6d9a8}
html.dark .bdg.on{border-color:#1f5a3c}
html.dark .star{color:#4a5b78}
html.dark .star.on{color:#f0b35a;border-color:#5a4520}
html.dark .icon-btn.fav-on{color:#f0b35a;border-color:#5a4520}
html.dark .fix ins{color:#6fdca6}
html.dark .fix del{color:#ff9a9a}
html.dark .hero{background:linear-gradient(135deg,#132f6e,#1d4bb0 60%,#2d63c9)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

["Customer","Yes, please give me a packet of tea.","হ্যাঁ, আমাকে এক প্যাকেট চা দিন।","हाँ, मुझे एक पैकेट चाय दीजिए।"],
["Customer","How much is it all together?","সব মিলিয়ে কত হলো?","कुल कितने पैसे हुए?"],
["Shopkeeper","It is two hundred rupees.","মোট দুশো টাকা।","कुल दो सौ रुपये हुए।"]]},
{id:"b5",t:"Asking for directions",goal:"Ask the way and understand the reply.",lines:[
["Traveller","Excuse me, where is the bus stop?","মাফ করবেন, বাস স্টপ কোথায়?","माफ़ कीजिए, बस स्टॉप कहाँ है?"],
["Local","Go straight and turn left.","সোজা গিয়ে বাঁ দিকে ঘুরুন।","सीधे जाइए और बाएँ मुड़िए।"],
["Traveller","Is it far from here?","এটা কি এখান থেকে দূরে?","क्या यह यहाँ से दूर है?"],
["Local","No, it is only five minutes on foot.","না, হেঁটে মাত্র পাঁচ মিনিট।","नहीं, पैदल सिर्फ़ पाँच मिनट है।"],
["Traveller","Thank you very much for your help.","আপনার সাহায্যের জন্য অনেক ধন্যবাদ।","आपकी मदद के लिए बहुत धन्यवाद।"],
["Local","You are welcome. Have a nice day.","স্বাগতম। আপনার দিনটি ভালো কাটুক।","कोई बात नहीं। आपका दिन शुभ हो।"]]},
{id:"b6",t:"A simple phone call",goal:"Start and end a phone call politely.",lines:[
["Caller","Hello, may I speak to Mr. Sharma?","হ্যালো, আমি কি মিস্টার শর্মার সাথে কথা বলতে পারি?","हेलो, क्या मैं शर्मा जी से बात कर सकता हूँ?"],
["Office","Sorry, he is not here right now.","দুঃখিত, তিনি এখন এখানে নেই।","माफ़ कीजिए, वे अभी यहाँ नहीं हैं।"],
["Caller","When will he be back?","তিনি কখন ফিরবেন?","वे कब वापस आएँगे?"],
["Office","He will be back after lunch.","তিনি দুপুরের খাবারের পরে ফিরবেন।","वे दोपहर के खाने के बाद लौटेंगे।"],
["Caller","Please ask him to call me back.","দয়া করে তাঁকে আমাকে ফোন করতে বলবেন।","कृपया उनसे कहिए कि मुझे वापस फ़ोन करें।"],
["Office","Sure, I will tell him.","নিশ্চয়ই, আমি তাঁকে বলে দেব।","ज़रूर, मैं उन्हें बता दूँगा।"]]}
],
Intermediate:[
{id:"i1",t:"At a restaurant",goal:"Order food and ask for the bill.",lines:[
["Waiter","Good evening. Are you ready to order?","শুভ সন্ধ্যা। আপনারা কি অর্ডার দিতে প্রস্তুত?","शुभ संध्या। क्या आप ऑर्डर देने के लिए तैयार हैं?"],
["Guest","Could you please suggest something light?","আপনি কি হালকা কিছু খাবার বলতে পারেন?","क्या आप कुछ हल्का सुझा सकते हैं?"],
["Waiter","The vegetable soup is very good today.","আজকের সবজির স্যুপ খুব ভালো।","आज का सब्ज़ियों का सूप बहुत अच्छा है।"],
["Guest","I will have that, with one plate of fried rice.","আমি সেটাই নেব, সাথে এক প্লেট ফ্রায়েড রাইস।","मैं वही लूँगा, साथ में एक प्लेट फ़्राइड राइस।"],
["Guest","Could we have the bill, please?","আমরা কি বিলটা পেতে পারি?","क्या हमें बिल मिल सकता है?"],
["Waiter","Certainly. Would you like to pay by card or cash?","অবশ্যই। আপনি কি কার্ডে দেবেন, না নগদে?","ज़रूर। आप कार्ड से देंगे या नकद?"]]},
{id:"i2",t:"Visiting the doctor",goal:"Explain a health problem clearly.",lines:[
["Doctor","What seems to be the problem?","আপনার সমস্যাটা কী?","आपको क्या तकलीफ़ है?"],
["Patient","I have had a fever since yesterday.","গতকাল থেকে আমার জ্বর।","मुझे कल से बुख़ार है।"],
["Doctor","Do you also have a cough or a headache?","আপনার কি কাশি বা মাথাব্যথাও আছে?","क्या आपको खाँसी या सिरदर्द भी है?"],
["Patient","Yes, my head has been hurting all morning.","হ্যাঁ, সকাল থেকে আমার মাথা ব্যথা করছে।","हाँ, सुबह से मेरे सिर में दर्द है।"],
["Doctor","Take this medicine twice a day after food.","এই ওষুধটি দিনে দুবার খাবারের পরে খাবেন।","यह दवा दिन में दो बार खाने के बाद लीजिए।"],
["Patient","Should I come back for a check-up?","আমাকে কি আবার দেখাতে আসতে হবে?","क्या मुझे दोबारा दिखाने आना चाहिए?"]]},
{id:"i3",t:"Booking a train ticket",goal:"Ask about trains, seats and fares.",lines:[
["Passenger","I would like to book a ticket to Delhi.","আমি দিল্লির একটি টিকিট কাটতে চাই।","मैं दिल्ली का एक टिकट बुक करना चाहता हूँ।"],
["Clerk","Which date are you planning to travel?","আপনি কোন তারিখে যেতে চান?","आप किस तारीख़ को यात्रा करना चाहते हैं?"],
["Passenger","I am planning to leave next Monday.","আমি আগামী সোমবার যাওয়ার পরিকল্পনা করছি।","मैं अगले सोमवार को जाने की सोच रहा हूँ।"],
["Clerk","There are only a few seats left in sleeper class.","স্লিপার ক্লাসে আর অল্প কয়েকটি আসন বাকি আছে।","स्लीपर क्लास में बस कुछ ही सीटें बची हैं।"],
["Passenger","That is fine. What is the total fare?","ঠিক আছে। মোট ভাড়া কত?","ठीक है। कुल किराया कितना है?"],
["Clerk","The fare is eight hundred rupees.","ভাড়া আটশো টাকা।","किराया आठ सौ रुपये है।"]]},
{id:"i4",t:"Making plans with friends",goal:"Invite someone and agree on a time.",lines:[
["Rahul","Are you free this weekend?","এই সপ্তাহান্তে তুমি কি ফাঁকা আছ?","क्या तुम इस सप्ताहांत खाली हो?"],
["Priya","I think so. What do you have in mind?","মনে হয় আছি। তুমি কী ভাবছ?","शायद हाँ। तुम्हारे मन में क्या है?"],
["Rahul","Why don't we watch a movie on Saturday?","শনিবার একটা সিনেমা দেখলে কেমন হয়?","क्यों न हम शनिवार को फ़िल्म देखें?"],
["Priya","That sounds great. What time should we meet?","দারুণ শোনাচ্ছে। আমরা কখন দেখা করব?","बहुत बढ़िया। हम कितने बजे मिलें?"],
["Rahul","Let us meet at the mall at four.","চলো চারটেয় মলে দেখা করি।","चलो चार बजे मॉल में मिलते हैं।"],
["Priya","Perfect. I will see you there.","ঠিক আছে। সেখানেই দেখা হবে।","ठीक है। वहीं मिलते हैं।"]]},
{id:"i5",t:"Calling customer care",goal:"Make a polite complaint.",lines:[
["Agent","Thank you for calling. How may I help you?","ফোন করার জন্য ধন্যবাদ। আমি কীভাবে সাহায্য করতে পারি?","फ़ोन करने के लिए धन्यवाद। मैं आपकी क्या मदद कर सकता हूँ?"],
["Customer","I received a damaged product yesterday.","আমি গতকাল একটি ক্ষতিগ্রস্ত পণ্য পেয়েছি।","मुझे कल एक ख़राब सामान मिला।"],
["Agent","I am very sorry about that. May I have your order number?","এর জন্য আমি খুব দুঃখিত। আপনার অর্ডার নম্বরটি বলবেন?","इसके लिए मुझे बहुत खेद है। क्या आप अपना ऑर्डर नंबर बता सकते हैं?"],
["Customer","Yes, I have sent it to you by message.","হ্যাঁ, আমি মেসেজে পাঠিয়ে দিয়েছি।","हाँ, मैंने उसे मैसेज से भेज दिया है।"],
["Customer","I would like a replacement as soon as possible.","আমি যত তাড়াতাড়ি সম্ভব একটি বদলি পণ্য চাই।","मुझे जल्द से जल्द इसका बदला हुआ सामान चाहिए।"],
["Agent","We will arrange it within three days.","আমরা তিন দিনের মধ্যে ব্যবস্থা করে দেব।","हम तीन दिनों के अंदर इसकी व्यवस्था कर देंगे।"]]},
{id:"i6",t:"Talking about hobbies",goal:"Share what you enjoy and why.",lines:[
["Anjali","What do you usually do in your free time?","অবসর সময়ে আপনি সাধারণত কী করেন?","ख़ाली समय में आप आमतौर पर क्या करते हैं?"],
["Vikram","I enjoy reading and listening to music.","আমি পড়তে এবং গান শুনতে ভালোবাসি।","मुझे पढ़ना और संगीत सुनना पसंद है।"],
["Anjali","How long have you been reading books?","আপনি কতদিন ধরে বই পড়ছেন?","आप कितने समय से किताबें पढ़ रहे हैं?"],
["Vikram","I have been reading since my school days.","আমি স্কুলের দিন থেকে বই পড়ছি।","मैं स्कूल के दिनों से पढ़ रहा हूँ।"],
["Anjali","It helps you relax after work, doesn't it?","এটা কাজের পরে আরাম দেয়, তাই না?","यह काम के बाद आराम देता है, है ना?"],
["Vikram","Yes, and it also improves my vocabulary.","হ্যাঁ, আর এতে আমার শব্দভাণ্ডারও বাড়ে।","हाँ, और इससे मेरी शब्दावली भी बेहतर होती है।"]]}
],
Advanced:[
{id:"a1",t:"Giving your opinion",goal:"Share a view with reasons.",lines:[
["Sara","What is your opinion on working from home?","বাড়ি থেকে কাজ করা নিয়ে আপনার মতামত কী?","घर से काम करने के बारे में आपकी क्या राय है?"],
["Karan","In my opinion, it saves time and improves focus.","আমার মতে, এতে সময় বাঁচে এবং মনোযোগ বাড়ে।","मेरी राय में, इससे समय बचता है और ध्यान बेहतर होता है।"],
["Sara","However, some people feel isolated at home.","তবে কেউ কেউ বাড়িতে একা বোধ করেন।","हालाँकि, कुछ लोग घर पर अकेलापन महसूस करते हैं।"],
["Karan","That is a fair point, and I understand it.","এটা যুক্তিসঙ্গত কথা, আমি বুঝি।","यह सही बात है, और मैं इसे समझता हूँ।"],
["Karan","A hybrid model may offer the best of both.","হাইব্রিড মডেলে হয়তো দুটোরই সুবিধা পাওয়া যাবে।","हाइब्रिड मॉडल से शायद दोनों के फ़ायदे मिल सकते हैं।"],
["Sara","I completely agree with you on that.","এ বিষয়ে আমি আপনার সাথে সম্পূর্ণ একমত।","इस पर मैं आपसे पूरी तरह सहमत हूँ।"]]},
{id:"a2",t:"Disagreeing politely",goal:"Say no without sounding rude.",lines:[
["Manager","I think we should launch the offer next week.","আমার মনে হয় আগামী সপ্তাহে অফারটি চালু করা উচিত।","मुझे लगता है हमें अगले हफ़्ते ऑफ़र शुरू करना चाहिए।"],
["Analyst","I see your point, but the stock may not be ready.","আপনার কথা বুঝতে পারছি, কিন্তু মাল হয়তো তৈরি থাকবে না।","मैं आपकी बात समझता हूँ, लेकिन स्टॉक शायद तैयार नहीं होगा।"],
["Manager","What makes you say that?","আপনি এটা কেন বলছেন?","आप ऐसा क्यों कह रहे हैं?"],
["Analyst","With respect, the latest data shows a shortage.","সম্মানের সাথে বলছি, সর্বশেষ তথ্য ঘাটতি দেখাচ্ছে।","सम्मान के साथ, ताज़ा आँकड़े कमी दिखा रहे हैं।"],
["Analyst","Could we consider moving it by one week?","আমরা কি এক সপ্তাহ পিছিয়ে দেওয়ার কথা ভাবতে পারি?","क्या हम इसे एक हफ़्ते आगे बढ़ाने पर विचार कर सकते हैं?"],
["Manager","That seems reasonable. Let us review it tomorrow.","এটা যুক্তিসঙ্গত মনে হচ্ছে। কাল আবার দেখে নেব।","यह ठीक लगता है। कल इसकी समीक्षा करते हैं।"]]},
{id:"a3",t:"Solving a problem together",goal:"Describe a cause and suggest a fix.",lines:[
["Lead","Why did the numbers change after the update?","আপডেটের পরে সংখ্যাগুলো কেন বদলে গেল?","अपडेट के बाद आँकड़े क्यों बदल गए?"],
["Analyst","It appears that some records were counted twice.","মনে হচ্ছে কিছু রেকর্ড দুবার গোনা হয়েছে।","लगता है कुछ रिकॉर्ड दो बार गिने गए।"],
["Lead","How can we prevent this from happening again?","আবার যাতে এমন না হয়, তার জন্য কী করতে পারি?","इसे दोबारा होने से कैसे रोक सकते हैं?"],
["Analyst","We could add an automatic check before each upload.","প্রতিবার আপলোডের আগে আমরা একটি স্বয়ংক্রিয় যাচাই যোগ করতে পারি।","हम हर अपलोड से पहले एक स्वचालित जाँच जोड़ सकते हैं।"],
["Lead","Good idea. How long would that take?","ভালো ভাবনা। এতে কত সময় লাগবে?","अच्छा विचार है। इसमें कितना समय लगेगा?"],
["Analyst","I expect to finish it by the end of this week.","আমি এই সপ্তাহের শেষের মধ্যে শেষ করার আশা করছি।","मुझे उम्मीद है कि मैं इस हफ़्ते के अंत तक पूरा कर लूँगा।"]]},
{id:"a4",t:"Presenting an idea",goal:"Open, explain and close a short talk.",lines:[
["Speaker","Thank you all for joining me today.","আজ আমার সাথে যোগ দেওয়ার জন্য সবাইকে ধন্যবাদ।","आज मेरे साथ जुड़ने के लिए आप सभी का धन्यवाद।"],
["Speaker","I would like to share an idea to reduce returns.","আমি রিটার্ন কমানোর একটি ভাবনা জানাতে চাই।","मैं रिटर्न कम करने का एक विचार साझा करना चाहता हूँ।"],
["Speaker","As you can see, most returns happen in the first week.","যেমন দেখছেন, বেশিরভাগ রিটার্ন প্রথম সপ্তাহেই হয়।","जैसा कि आप देख सकते हैं, ज़्यादातर रिटर्न पहले हफ़्ते में होते हैं।"],
["Speaker","Therefore, we should call customers soon after delivery.","তাই ডেলিভারির পরেই গ্রাহকদের ফোন করা উচিত।","इसलिए हमें डिलीवरी के तुरंत बाद ग्राहकों को फ़ोन करना चाहिए।"],
["Speaker","To sum up, a small step can save a lot of money.","সংক্ষেপে, একটি ছোট পদক্ষেপ অনেক টাকা বাঁচাতে পারে।","संक्षेप में, एक छोटा क़दम बहुत पैसा बचा सकता है।"],

prepositions:{t:"Prepositions",icon:"pin",d:"Use in, on, at, for, since and more.",sections:[
{h:"Time: in, on, at",en:"Use in for months, years and long periods. Use on for days and dates. Use at for exact times.",bn:"মাস, বছর ও দীর্ঘ সময়ের জন্য in; দিন ও তারিখের জন্য on; নির্দিষ্ট সময়ের জন্য at।",hi:"महीने, साल और लंबे समय के लिए in; दिन और तारीख़ के लिए on; ठीक समय के लिए at।",ex:["I joined in March.","The meeting is on Monday.","Come at nine o'clock."]},
{h:"Place: in, on, at",en:"Use in for inside a space. Use on for a surface. Use at for a specific point or place.",bn:"কোনো জায়গার ভিতরে in; কোনো তলের উপরে on; নির্দিষ্ট স্থান বোঝাতে at।",hi:"किसी जगह के अंदर in; किसी सतह पर on; किसी ख़ास जगह के लिए at।",ex:["The file is in the folder.","The laptop is on the table.","I am at the office."]},
{h:"For and since",en:"Use for with a length of time. Use since with a starting point.",bn:"কত সময় ধরে বোঝাতে for; কবে থেকে বোঝাতে since।",hi:"कितने समय से बताने के लिए for; कब से बताने के लिए since।",ex:["I have worked here for three years.","I have worked here since 2022."]},
{h:"Common pairs",en:"Some words always take a fixed preposition. Learn them together.",bn:"কিছু শব্দের সাথে নির্দিষ্ট preposition বসে। একসাথে মনে রাখুন।",hi:"कुछ शब्दों के साथ तय preposition आता है। इन्हें साथ में याद करें।",ex:["good at Excel","depend on the data","interested in sales","married to Riya","reply to the email"]}
],quiz:[
["The meeting is ___ Monday.",["in","on","at","by"],1,"Use on with days."],
["I was born ___ 1995.",["on","at","in","by"],2,"Use in with years."],
["Please come ___ ten o'clock.",["at","in","on","for"],0,"Use at with exact times."],
["I have lived here ___ five years.",["since","for","from","at"],1,"Five years is a length of time, so use for."],
["She has been waiting ___ morning.",["for","since","at","by"],1,"Morning is a starting point, so use since."],
["The report is ___ the table.",["at","on","by","to"],1,"Use on for a surface."],
["He is good ___ Excel.",["in","on","at","with"],2,"The fixed pair is good at."],
["Sales depend ___ many things.",["of","in","on","at"],2,"The fixed pair is depend on."]
]},
articles:{t:"Articles",icon:"text",d:"Choose between a, an and the.",sections:[
{h:"A and an",en:"Use a before a consonant sound and an before a vowel sound. The sound matters, not the letter.",bn:"ব্যঞ্জনধ্বনির আগে a, স্বরধ্বনির আগে an। অক্ষর নয়, উচ্চারণের ধ্বনিই আসল।",hi:"व्यंजन ध्वनि से पहले a और स्वर ध्वनि से पहले an। अक्षर नहीं, ध्वनि मायने रखती है।",ex:["a report","an email","an hour","a university","an MIS report"]},
{h:"The",en:"Use the when the listener knows which thing you mean, or when there is only one.",bn:"শ্রোতা যখন জানেন কোন জিনিসের কথা বলা হচ্ছে, অথবা জিনিসটি একটিই আছে, তখন the।",hi:"जब सुनने वाला जानता हो कि कौन सी चीज़ की बात है, या वह चीज़ एक ही हो, तब the।",ex:["Please open the file I sent.","The sun rises in the east.","He is the manager of our team."]},
{h:"No article",en:"Do not use an article with general plural nouns, most names, languages, or meals in general.",bn:"সাধারণ বহুবচন, বেশিরভাগ নাম, ভাষা ও সাধারণভাবে খাবারের নামের আগে article বসে না।",hi:"आम बहुवचन, ज़्यादातर नाम, भाषाओं और सामान्य रूप से भोजन के नाम से पहले article नहीं आता।",ex:["Customers like discounts.","I speak English.","We had lunch."]}
],quiz:[
["She works in ___ office near my home.",["a","an","the","no article"],1,"Office starts with a vowel sound."],
["It took ___ hour to finish.",["a","an","the","no article"],1,"The h in hour is silent, so it has a vowel sound."],
["He studied at ___ university in Kolkata.",["a","an","the","no article"],0,"University starts with a \"yoo\" sound, a consonant sound."],
["___ sun is very hot today.",["A","An","The","No article"],2,"There is only one sun."],
["I speak ___ English at work.",["a","an","the","no article"],3,"Languages do not take an article."],
["Please send me ___ report you made yesterday.",["a","an","the","no article"],2,"The listener knows which report."],
["I bought ___ new laptop.",["a","an","the","no article"],0,"New starts with a consonant sound."],
["We had ___ dinner at eight.",["a","an","the","no article"],3,"Meals in general take no article."]
]},
sentences:{t:"Sentence formation",icon:"list",d:"Build correct sentences and questions.",sections:[
{h:"Basic word order",en:"English follows Subject, Verb, Object. This is different from Bengali and Hindi, where the verb comes at the end.",bn:"ইংরেজিতে ক্রম হলো কর্তা, ক্রিয়া, কর্ম। বাংলায় ক্রিয়া শেষে বসে, ইংরেজিতে নয়।",hi:"अंग्रेज़ी में क्रम होता है कर्ता, क्रिया, कर्म। हिंदी में क्रिया अंत में आती है, अंग्रेज़ी में नहीं।",ex:["I send the report.","She reads a book.","We sell furniture."]},
{h:"Negative sentences",en:"Add do not, does not or did not before the main verb. With am, is, are, was and were, add not after the verb.",bn:"মূল ক্রিয়ার আগে do not, does not বা did not বসান। am, is, are, was, were-এর পরে not বসান।",hi:"मुख्य क्रिया से पहले do not, does not या did not लगाएँ। am, is, are, was, were के बाद not लगाएँ।",ex:["I do not drink tea.","He does not work here.","She is not at home."]},
{h:"Questions",en:"Put do, does, did or a helping verb before the subject. Wh- words come first.",bn:"কর্তার আগে do, does, did বা সাহায্যকারী ক্রিয়া বসান। Wh- শব্দ শুরুতে বসে।",hi:"कर्ता से पहले do, does, did या सहायक क्रिया लगाएँ। Wh- शब्द शुरुआत में आते हैं।",ex:["Do you like coffee?","Where does she work?","Are you coming?"]},
{h:"Polite requests",en:"Use could you, would you or may I. They sound softer than a direct order.",bn:"could you, would you বা may I ব্যবহার করুন। সরাসরি আদেশের চেয়ে এগুলো নরম শোনায়।",hi:"could you, would you या may I का प्रयोग करें। ये सीधे आदेश से ज़्यादा विनम्र लगते हैं।",ex:["Could you send me the file?","Would you mind waiting?","May I ask a question?"]}
],quiz:[
["Choose the correct sentence.",["I the report send.","I send the report.","Send I the report.","The report I send."],1,"Use Subject + Verb + Object."],
["Choose the correct negative.",["He not works here.","He does not works here.","He does not work here.","He no work here."],2,"After does not, use the base verb."],
["Choose the correct question.",["Where she works?","Where does she work?","Where she does work?","Where does she works?"],1,"Use wh- word + does + subject + base verb."],
["Choose the most polite request.",["Send the file.","You send file.","Could you send me the file?","File send now."],2,"Could you is polite."],
["Choose the correct sentence.",["She is not at home.","She not is at home.","She no at home.","Not she is at home."],0,"Put not after is."],
["Choose the correct question.",["You are coming?","Are you coming?","Coming are you?","You coming are?"],1,"Put the helping verb before the subject."],
["Choose the correct sentence.",["I did not went there.","I not went there.","I did not go there.","I no go there."],2,"After did not, use the base verb."],
["Choose the correct sentence.",["We sell furniture online.","We furniture sell online.","Online we furniture sell.","Sell we furniture online."],0,"Use Subject + Verb + Object."]
]}
};

/* ===== CONTENT: INTERVIEW PREPARATION =====
   Sample answers suit an MIS / reporting role. The learner can save their own answer for each question. */
const INTERVIEW=[
{id:"q1",q:"Tell me about yourself.",b:"আপনার নিজের সম্পর্কে বলুন।",h:"अपने बारे में बताइए।",tip:"Keep it under one minute: your work, your skills, and why you are here.",a:"I work as an MIS executive. I prepare daily sales reports and dashboards using Excel. I am good with numbers and I enjoy finding patterns in data. I am now looking for a role where I can learn more and take on greater responsibility."},
{id:"q2",q:"Why should we hire you?",b:"আমরা আপনাকে কেন নিয়োগ করব?",h:"हमें आपको क्यों चुनना चाहिए?",tip:"Link your skills to what the job needs.",a:"You should hire me because I have strong reporting skills and I am very careful with data. I deliver my work on time, and I learn new tools quickly. I believe I can add value to your team from the first month."},
{id:"q3",q:"What are your strengths?",b:"আপনার শক্তির দিকগুলো কী?",h:"आपकी ताक़त क्या है?",tip:"Name two strengths and give one small example.",a:"My main strengths are accuracy and discipline. For example, I check every report against the source data before I send it. Because of this, my manager trusts my numbers."},
{id:"q4",q:"What is your greatest weakness?",b:"আপনার সবচেয়ে বড় দুর্বলতা কী?",h:"आपकी सबसे बड़ी कमज़ोरी क्या है?",tip:"Choose a real weakness and show how you are improving it.",a:"My weakness is that I sometimes feel nervous when I speak English in meetings. To improve this, I practise speaking every day, and I am becoming more confident."},
{id:"q5",q:"Why do you want to leave your current job?",b:"আপনি বর্তমান চাকরি কেন ছাড়তে চান?",h:"आप अपनी मौजूदा नौकरी क्यों छोड़ना चाहते हैं?",tip:"Stay positive. Never speak badly about your employer.",a:"I have learned a lot in my current job and I am thankful for it. Now I am looking for a bigger role where I can grow my skills and handle more challenging work."},
{id:"q6",q:"Where do you see yourself in five years?",b:"পাঁচ বছর পরে আপনি নিজেকে কোথায় দেখেন?",h:"आप पाँच साल बाद ख़ुद को कहाँ देखते हैं?",tip:"Show that you want to grow, and stay realistic.",a:"In five years, I see myself leading a small reporting team. I want to become an expert in data analysis and help the business make better decisions."},
{id:"q7",q:"Why do you want to work for our company?",b:"আপনি আমাদের কোম্পানিতে কেন কাজ করতে চান?",h:"आप हमारी कंपनी में क्यों काम करना चाहते हैं?",tip:"Read about the company first and mention one real reason.",a:"Your company is growing quickly and it uses data to make decisions. I would like to be part of such a team, because I can use my skills and also learn from experienced people."},
{id:"q8",q:"Tell me about a challenge you faced at work.",b:"কাজের ক্ষেত্রে আপনার সামনে আসা একটি চ্যালেঞ্জের কথা বলুন।",h:"काम में आई किसी चुनौती के बारे में बताइए।",tip:"Use three steps: the problem, your action, the result.",a:"Once, our daily report was taking two hours because the data came from many files. I automated the process with Excel formulas. After that, the report took only twenty minutes, and the errors also went down."},
{id:"q9",q:"How do you work in a team?",b:"আপনি দলে কীভাবে কাজ করেন?",h:"आप टीम में कैसे काम करते हैं?",tip:"Give an example of helping or sharing.",a:"I communicate clearly and I share updates early. When a colleague is busy, I offer to help. I believe a team does its best work when everyone trusts each other."},
{id:"q10",q:"How do you handle pressure?",b:"আপনি চাপ কীভাবে সামলান?",h:"आप दबाव को कैसे संभालते हैं?",tip:"Describe your method: plan, prioritise, stay calm.",a:"When I have many tasks, I make a list and start with the most urgent work. I stay calm and I tell my manager early if there is a risk of delay."},
{id:"q11",q:"What are your salary expectations?",b:"আপনি কত বেতন আশা করেন?",h:"आपकी वेतन अपेक्षा क्या है?",tip:"Research the market range first, then give a sensible range.",a:"I am looking for a fair salary based on my skills and the market range for this role. I am open to discussing the complete package."},
{id:"q12",q:"Do you have any questions for us?",b:"আমাদের কাছে আপনার কোনো প্রশ্ন আছে?",h:"क्या आप हमसे कुछ पूछना चाहते हैं?",tip:"Always ask one or two questions. It shows interest.",a:"Yes, thank you. Could you tell me what success looks like in this role during the first six months? I would also like to know how the team works together."}
];

Object.assign(GRAMMAR,{
perfect:{t:"Present perfect or past simple",icon:"clock",d:"Choose between I have done and I did.",sections:[
{h:"Present perfect",en:"Use have or has + past participle when the time is not finished or not given, and the result matters now.",bn:"সময় শেষ হয়নি বা বলা নেই, আর ফলাফল এখনও গুরুত্বপূর্ণ হলে have/has + past participle ব্যবহার করুন।",hi:"जब समय ख़त्म नहीं हुआ या बताया नहीं गया, और नतीजा अभी मायने रखता है, तब have/has + past participle लगाएँ।",ex:["I have finished the sales report.","She has worked here for two years.","Have you ever visited Goa?"]},
{h:"Past simple",en:"Use the past simple when the time is finished: yesterday, last week, two days ago, in 2024.",bn:"সময় শেষ হয়ে গেলে (yesterday, last week, two days ago) Past Simple ব্যবহার করুন।",hi:"समय ख़त्म हो चुका हो (yesterday, last week, two days ago) तो Past Simple लगाएँ।",ex:["I finished the report yesterday.","We met the area manager last week."]},
{h:"Helpful words",en:"Just, already, yet, ever, never, for and since usually go with the present perfect. Yesterday, ago and last usually go with the past simple.",bn:"just, already, yet, ever, never, for, since সাধারণত Present Perfect-এর সাথে; yesterday, ago, last সাধারণত Past Simple-এর সাথে বসে।",hi:"just, already, yet, ever, never, for, since आमतौर पर Present Perfect के साथ; yesterday, ago, last आमतौर पर Past Simple के साथ आते हैं।",
table:[["Present perfect","I have just sent the file.","Has the customer replied yet?"],["Past simple","I sent the file two hours ago.","The customer replied yesterday."]]}
],quiz:[
["I ___ the file yesterday.",["have sent","sent","have send","am sending"],1,"Yesterday is a finished time, so use the past simple."],
["She ___ in this company since 2021.",["worked","works","has worked","is work"],2,"Since 2021 joins the past and now, so use the present perfect."],
["___ you ever ___ to Delhi?",["Did / go","Have / been","Are / going","Do / went"],1,"Ever asks about any time up to now, so use the present perfect."],
["I ___ lunch, so I am not hungry now.",["have already had","already have","had already have","am already had"],0,"The result matters now, so use have + past participle."],
["We ___ our target last month.",["have achieved","achieve","achieved","have achieve"],2,"Last month is a finished time, so use the past simple."],
["The manager hasn't replied ___.",["already","yet","ago","since"],1,"Use yet in negative sentences and questions."]
]},
ppc:{t:"Present perfect continuous",icon:"clock",d:"Talk about actions that started earlier and are still going on.",sections:[
{h:"Form and use",en:"Use have or has been + -ing for an action that started in the past and is still going on, often with for or since.",bn:"অতীতে শুরু হয়ে এখনও চলছে এমন কাজের জন্য have/has been + -ing, প্রায়ই for বা since-এর সাথে।",hi:"जो काम अतीत में शुरू होकर अभी भी चल रहा है, उसके लिए have/has been + -ing, अक्सर for या since के साथ।",ex:["I have been working on this report since morning.","It has been raining for two hours.","How long have you been learning English?"]},
{h:"Continuous or simple",en:"The continuous form tells us how long. The simple form tells us how many, or that the work is complete.",bn:"Continuous রূপ বলে কতক্ষণ ধরে; Simple রূপ বলে কতগুলো, বা কাজটি শেষ হয়েছে।",hi:"Continuous रूप बताता है कितनी देर से; Simple रूप बताता है कितने, या काम पूरा हो गया।",
table:[["Continuous","I have been writing emails all day.","She has been waiting for an hour."],["Simple","I have written ten emails.","She has finished the file."]]},
{h:"Verbs without -ing",en:"Verbs like know, like, believe, own and understand do not usually take -ing. Use the present perfect simple with them.",bn:"know, like, believe, own, understand সাধারণত -ing নেয় না; এদের সাথে Present Perfect Simple ব্যবহার করুন।",hi:"know, like, believe, own, understand आमतौर पर -ing नहीं लेते; इनके साथ Present Perfect Simple लगाएँ।",ex:["I have known him for five years.","She has owned this shop since 2019."]}

["I ___ him for ten years.",["have been knowing","know","have known","am knowing"],2,"Know does not normally take -ing."],

future:{t:"Future forms",icon:"target",d:"Use will, going to and the present for the future.",sections:[
{h:"Will",en:"Use will for a decision made at the moment of speaking, for promises and offers, and for predictions based on your opinion.",bn:"বলার মুহূর্তে নেওয়া সিদ্ধান্ত, প্রতিশ্রুতি, প্রস্তাব এবং মতামতভিত্তিক ভবিষ্যদ্বাণীর জন্য will।",hi:"बोलते समय लिया गया फ़ैसला, वादा, पेशकश और अपनी राय पर आधारित अनुमान के लिए will।",ex:["I will call the customer now.","Don't worry, I will help you.","I think sales will go up next month."]},
{h:"Going to",en:"Use going to for plans you have already made, and for predictions based on what you can see now.",bn:"আগে থেকে ঠিক করা পরিকল্পনা এবং এখন যা দেখছেন তার ভিত্তিতে ভবিষ্যদ্বাণীর জন্য going to।",hi:"पहले से तय योजना और अभी जो दिख रहा है उसके आधार पर अनुमान के लिए going to।",ex:["I am going to apply for a new job.","Look at those clouds. It is going to rain."]},
{h:"Present forms for the future",en:"Use the present continuous for fixed arrangements with a time or place. Use the present simple for timetables.",bn:"সময় বা জায়গা ঠিক হয়ে থাকা ব্যবস্থার জন্য Present Continuous; সময়সূচির জন্য Present Simple।",hi:"समय या जगह तय हो चुकी व्यवस्था के लिए Present Continuous; समय-सारणी के लिए Present Simple।",ex:["I am meeting the area manager at four.","The train leaves at six tomorrow morning."]}
],quiz:[
["The phone is ringing. I ___ answer it.",["will","am going to","answer","am answering"],0,"A decision made right now: will."],
["I have bought the paint. I ___ paint my room this weekend.",["will","am going to","paint","would"],1,"A plan made before: going to."],
["I ___ my manager at three tomorrow. It is in my calendar.",["meet","will meeting","am meeting","met"],2,"A fixed arrangement: present continuous."],
["The flight ___ at seven tomorrow morning.",["leave","leaves","is leave","will leaving"],1,"Timetables use the present simple."],
["Look at the sky! It ___ rain.",["will","is going to","rains","is raining to"],1,"A prediction from what you can see now: going to."],
["I promise I ___ tell anyone.",["won't","am not going","don't","not will"],0,"Promises use will or won't."]
]},
modals:{t:"Modal verbs",icon:"check",d:"Use can, could, must, should, may and might.",sections:[
{h:"Ability and requests",en:"Use can for ability now and could for ability in the past. Could you is also a polite way to ask for something.",bn:"এখনকার সামর্থ্যের জন্য can, অতীতের জন্য could। Could you দিয়ে ভদ্রভাবে অনুরোধও করা যায়।",hi:"अभी की क्षमता के लिए can, अतीत की क्षमता के लिए could। Could you से विनम्रता से अनुरोध भी किया जाता है।",ex:["I can speak three languages.","When I was young, I could run very fast.","Could you send me the file, please?"]},
{h:"Necessary or not",en:"Must and have to show that something is necessary. Mustn't means it is not allowed. Don't have to means it is not necessary. Should gives advice.",bn:"must ও have to দিয়ে প্রয়োজন বোঝায়। mustn't মানে অনুমতি নেই, don't have to মানে দরকার নেই। should দিয়ে পরামর্শ দেওয়া হয়।",hi:"must और have to ज़रूरत बताते हैं। mustn't का मतलब है अनुमति नहीं, don't have to का मतलब है ज़रूरत नहीं। should सलाह देता है।",ex:["You must wear your ID card in the office.","I have to submit the report by six.","You don't have to come on Sunday.","You should take a short break."]},
{h:"Possibility",en:"Use may, might or could when something is possible but you are not sure.",bn:"কিছু সম্ভব কিন্তু নিশ্চিত নন, তখন may, might বা could।",hi:"जब कुछ संभव हो पर पक्का न हो, तब may, might या could।",ex:["He may be in a meeting.","It might rain later."]},
{h:"Remember",en:"After a modal verb, use the base verb without to, and never add -s.",bn:"modal verb-এর পরে to ছাড়া ক্রিয়ার মূল রূপ বসে, আর -s যোগ হয় না।",hi:"modal verb के बाद to के बिना क्रिया का मूल रूप आता है, और -s नहीं लगता।",ex:["She can drive.","He must go now."]}
],quiz:[
["She ___ speak English very well.",["can","cans","can to","is can"],0,"Modal verbs never add -s."],
["You ___ smoke in the office. It is not allowed.",["mustn't","don't have to","shouldn't to","needn't to"],0,"Mustn't means it is not allowed."],
["You ___ come tomorrow. It is a holiday.",["mustn't","don't have to","can't to","must"],1,"Don't have to means it is not necessary."],
["He is not answering his phone. He ___ be busy.",["might","must to","should to","can to"],0,"Might shows a possibility."],
["You look tired. You ___ go home early.",["should","must to","could to","are should"],0,"Should gives advice."],
["___ I use your phone, please?",["May","Must","Should","Will to"],0,"May I is a polite way to ask for permission."]
]},
conditionals:{t:"Conditionals (if sentences)",icon:"list",d:"Talk about real and imagined situations.",sections:[
{h:"Three main types",en:"The first type is for real future possibilities, the second for unreal situations now, and the third for an imagined past.",bn:"প্রথম ধরন বাস্তব ভবিষ্যৎ সম্ভাবনা, দ্বিতীয় ধরন এখনকার অবাস্তব অবস্থা, আর তৃতীয় ধরন কল্পিত অতীতের জন্য।",hi:"पहला प्रकार असली भविष्य की संभावना, दूसरा अभी की काल्पनिक स्थिति, और तीसरा कल्पित अतीत के लिए है।",
table:[["First: if + present, will + verb","If it rains, I will stay at home.","If you study, you will pass."],["Second: if + past, would + verb","If I had a car, I would drive to work.","If I were you, I would talk to the manager."],["Third: if + had done, would have done","If I had known, I would have come.","If she had asked, I would have helped."]]},
{h:"Facts",en:"For things that are always true, use the present in both parts.",bn:"যা সবসময় সত্য, তার জন্য দুই অংশেই Present ব্যবহার করুন।",hi:"जो बात हमेशा सच है, उसके लिए दोनों हिस्सों में Present लगाएँ।",ex:["If you heat ice, it melts.","If I am late, my manager calls me."]},
{h:"Remember",en:"Do not use will in the if part of the sentence.",bn:"বাক্যের if অংশে will ব্যবহার করবেন না।",hi:"वाक्य के if वाले हिस्से में will न लगाएँ।",ex:["If he calls, please tell me.","If the stock arrives, we will start the sale."]}
],quiz:[
["If it ___ tomorrow, we will cancel the trip.",["rains","will rain","rained","would rain"],0,"First conditional: if + present, will + verb."],
["If I ___ a lot of money, I would buy a house.",["have","had","will have","would have"],1,"Second conditional: if + past simple."],
["If I were you, I ___ apply for that job.",["will","would","am","was"],1,"If I were you is followed by would."],
["If she had studied, she ___ the exam.",["would pass","will pass","would have passed","passed"],2,"Third conditional: would have + past participle."],
["If you heat water to one hundred degrees, it ___.",["boils","would boil","boiled","will boiled"],0,"For facts, use the present in both parts."],
["Please tell me if he ___.",["will call","calls","would call","called will"],1,"Do not use will after if."]
]},
passive:{t:"Passive voice",icon:"text",d:"Say what happens to something, not who does it.",sections:[
{h:"Form and use",en:"The passive is be + past participle. Use it when the action or the result matters more than the person who did it.",bn:"Passive হলো be + past participle। কে করেছে তার চেয়ে কাজ বা ফলাফল বেশি গুরুত্বপূর্ণ হলে এটি ব্যবহার করুন।",hi:"Passive है be + past participle। जब करने वाले से ज़्यादा काम या नतीजा मायने रखता हो, तब इसका प्रयोग करें।",ex:["The report is sent every morning.","This sofa was made in Jodhpur.","The order has been delivered."]},
{h:"Passive in different tenses",en:"Only the form of be changes with the tense. The past participle stays the same.",bn:"Tense অনুযায়ী শুধু be-এর রূপ বদলায়; past participle একই থাকে।",hi:"Tense के अनुसार सिर्फ़ be का रूप बदलता है; past participle वही रहता है।",
table:[["Present simple","The data is updated daily.","Emails are checked at ten."],["Past simple","The file was shared yesterday.","The orders were cancelled."],["Present perfect","The payment has been received.","The items have been packed."]]},
{h:"Using by",en:"Add by + person only when it is important to say who did it.",bn:"কে করেছে তা বলা জরুরি হলে তবেই by + ব্যক্তি যোগ করুন।",hi:"किसने किया यह बताना ज़रूरी हो, तभी by + व्यक्ति जोड़ें।",ex:["The dashboard was created by Rajesh.","The new store was opened by the CEO."]}
],quiz:[
["The report ___ every day at nine.",["is sent","sends","is send","sent is"],0,"Present passive: is + past participle."],
["This chair ___ in 2020.",["made","was made","is make","has make"],1,"Past passive: was + past participle."],
["The payment ___ already ___.",["has / received","has / been received","is / receive","was / been"],1,"Present perfect passive: has been + past participle."],
["The new store ___ by the CEO last week.",["opened","was opened","is opening","has open"],1,"The store did not open itself, so use the past passive."],
["English ___ in many countries.",["speaks","is spoken","is speak","spoken"],1,"Present passive: is + past participle."],
["Choose the passive sentence.",["They sold the car.","The car was sold.","The car sells well.","They are selling the car."],1,"The passive uses be + past participle."]
]},
reported:{t:"Reported speech",icon:"chat",d:"Tell someone what another person said.",sections:[
{h:"Tense moves back",en:"When you report what someone said earlier, the tense usually moves one step back.",bn:"কারও আগের কথা অন্যকে জানালে tense সাধারণত এক ধাপ পিছিয়ে যায়।",hi:"किसी की कही बात आगे बताते समय tense आमतौर पर एक कदम पीछे चला जाता है।",
table:[["am / is → was","He said, 'I am busy.'","He said that he was busy."],["like → liked","She said, 'I like it.'","She said that she liked it."],["will → would","He said, 'I will call.'","He said that he would call."]]},
{h:"Other changes",en:"Pronouns and time words often change too: I becomes he or she, today becomes that day, tomorrow becomes the next day.",bn:"সর্বনাম ও সময়ের শব্দও বদলায়: I হয় he বা she, today হয় that day, tomorrow হয় the next day।",hi:"सर्वनाम और समय के शब्द भी बदलते हैं: I बनता है he या she, today बनता है that day, tomorrow बनता है the next day।",ex:["She said that she would come the next day."]},
{h:"Reported questions",en:"In reported questions, use normal word order, without do. Use if for yes or no questions.",bn:"Reported question-এ do ছাড়া সাধারণ শব্দক্রম ব্যবহার করুন। হ্যাঁ/না প্রশ্নে if বসান।",hi:"Reported question में do के बिना सामान्य शब्द-क्रम रखें। हाँ/ना वाले सवाल में if लगाएँ।",ex:["He asked if I was ready.","She asked where I lived."]},
{h:"Say and tell",en:"Tell needs a person after it: tell me, tell him. Say does not.",bn:"tell-এর পরে একজন ব্যক্তি লাগে (tell me), say-এর পরে লাগে না।",hi:"tell के बाद व्यक्ति आता है (tell me), say के बाद नहीं।",ex:["He told me that he was late.","He said that he was late."]}
],quiz:[
["He said, 'I am tired.' He said that he ___ tired.",["is","was","be","has"],1,"Am moves back to was."],
["She said, 'I will help you.' She said that she ___ help me.",["will","would","can","is"],1,"Will moves back to would."],
["He asked me where ___.",["do I live","I lived","did I live","I do live"],1,"Reported questions use normal word order."],
["She ___ me that the meeting was cancelled.",["said","told","says to","spoke"],1,"Tell needs a person after it."],
["He asked ___ I had finished the report.",["that","if","what if","do"],1,"Yes or no questions are reported with if."],
["She said, 'I am coming tomorrow.' She said she was coming ___.",["tomorrow","the next day","yesterday","the last day"],1,"Tomorrow usually becomes the next day."]
]},
questions:{t:"Questions and question tags",icon:"chat",d:"Ask clear questions and add tags like isn't it.",sections:[
{h:"Word order",en:"Put the helping verb before the subject. When who or what is the subject, do not add do.",bn:"কর্তার আগে সাহায্যকারী ক্রিয়া বসান। who বা what নিজেই কর্তা হলে do যোগ করবেন না।",hi:"कर्ता से पहले सहायक क्रिया रखें। जब who या what ख़ुद कर्ता हो, तब do न लगाएँ।",ex:["Where do you work?","Who called you?","What happened in the meeting?"]},
{h:"Question tags",en:"A question tag repeats the helping verb. A positive sentence takes a negative tag, and a negative sentence takes a positive tag.",bn:"Question tag-এ সাহায্যকারী ক্রিয়া আবার আসে। হ্যাঁ-বাচক বাক্যে না-বাচক tag, না-বাচক বাক্যে হ্যাঁ-বাচক tag।",hi:"Question tag में सहायक क्रिया दोहराई जाती है। सकारात्मक वाक्य में नकारात्मक tag, नकारात्मक वाक्य में सकारात्मक tag।",ex:["It is hot today, isn't it?","You don't eat meat, do you?","She finished the report, didn't she?","Let's start, shall we?"]},
{h:"Polite questions",en:"Start with could you tell me or do you know, then use normal word order.",bn:"could you tell me বা do you know দিয়ে শুরু করে তারপর সাধারণ শব্দক্রম ব্যবহার করুন।",hi:"could you tell me या do you know से शुरू करें, फिर सामान्य शब्द-क्रम रखें।",ex:["Could you tell me where the station is?","Do you know when the meeting starts?"]}
],quiz:[
["Choose the correct question.",["Where you work?","Where do you work?","Where you do work?","Where works you?"],1,"Use do before the subject."],
["You are coming to the meeting, ___?",["are you","aren't you","don't you","isn't it"],1,"A positive sentence takes a negative tag."],
["She didn't call, ___?",["did she","didn't she","does she","was she"],0,"A negative sentence takes a positive tag."],
["___ wrote this report?",["Who did","Who","Whom did","Who does"],1,"Who is the subject, so do not add did."],
["Could you tell me where ___?",["is the bank","the bank is","does the bank","the bank does"],1,"Polite questions use normal word order."],
["Let's take a break, ___?",["shall we","will you","don't we","let we"],0,"Let's takes the tag shall we."]
]},
ingto:{t:"-ing or to + verb",icon:"letters",d:"Choose between enjoy doing and want to do.",sections:[
{h:"Verbs followed by -ing",en:"Use -ing after verbs like enjoy, finish, avoid, mind, suggest, keep and practise.",bn:"enjoy, finish, avoid, mind, suggest, keep, practise-এর পরে -ing বসে।",hi:"enjoy, finish, avoid, mind, suggest, keep, practise के बाद -ing आता है।",ex:["I enjoy reading.","She finished writing the email.","Would you mind waiting?"]},
{h:"Verbs followed by to",en:"Use to + verb after verbs like want, decide, plan, hope, agree, need, promise and refuse.",bn:"want, decide, plan, hope, agree, need, promise, refuse-এর পরে to + ক্রিয়া বসে।",hi:"want, decide, plan, hope, agree, need, promise, refuse के बाद to + क्रिया आती है।",ex:["I want to learn Excel.","We decided to open a new store."]},
{h:"After prepositions",en:"After a preposition such as in, at, for, about or before, use -ing.",bn:"in, at, for, about, before-এর মতো preposition-এর পরে -ing ব্যবহার করুন।",hi:"in, at, for, about, before जैसे preposition के बाद -ing लगाएँ।",ex:["She is interested in learning English.","He is good at selling.","Thank you for helping me."]}
],quiz:[
["I enjoy ___ cricket.",["play","to play","playing","played"],2,"Enjoy is followed by -ing."],
["She wants ___ a new phone.",["buy","to buy","buying","bought"],1,"Want is followed by to + verb."],
["Thank you for ___ me.",["help","to help","helping","helped"],2,"After a preposition, use -ing."],
["We decided ___ the meeting.",["postpone","to postpone","postponing","postponed"],1,"Decide is followed by to + verb."],
["Would you mind ___ the door?",["close","to close","closing","closed"],2,"Mind is followed by -ing."],
["He is good at ___ customers.",["handle","to handle","handling","handled"],2,"At is a preposition, so use -ing."]
]},
countable:{t:"Countable and uncountable nouns",icon:"list",d:"Use much, many, some, any, a few and a little.",sections:[
{h:"Two kinds of nouns",en:"Countable nouns have a plural and can take a or an: a chair, two chairs. Uncountable nouns have no plural: information, advice, furniture, money, water.",bn:"গণনাযোগ্য বিশেষ্যের বহুবচন হয় এবং a/an বসে। অগণনাযোগ্য বিশেষ্যের বহুবচন হয় না: information, advice, furniture, money।",hi:"गिनने योग्य संज्ञा का बहुवचन होता है और a/an लगता है। न गिनने योग्य संज्ञा का बहुवचन नहीं होता: information, advice, furniture, money।",ex:["We sold ten chairs today.","Can you give me some advice?","The furniture in this store is new."]},
{h:"Much, many and a lot of",en:"Use many with plural countable nouns and much with uncountable nouns, mostly in questions and negatives. A lot of works with both.",bn:"বহুবচন গণনাযোগ্যের সাথে many, অগণনাযোগ্যের সাথে much (বেশি প্রশ্ন ও না-বাচকে)। a lot of দুটোর সাথেই চলে।",hi:"बहुवचन गिनने योग्य के साथ many, न गिनने योग्य के साथ much (ज़्यादातर सवाल और नकारात्मक में)। a lot of दोनों के साथ चलता है।",
table:[["Countable","How many orders did we get?","There are a lot of customers."],["Uncountable","How much money do you need?","We don't have much time."]]},
{h:"Some, any, a few and a little",en:"Use some in positive sentences and offers, and any in most questions and negatives. Use a few with countable nouns and a little with uncountable nouns.",bn:"হ্যাঁ-বাচক বাক্য ও প্রস্তাবে some, বেশিরভাগ প্রশ্ন ও না-বাচকে any। গণনাযোগ্যের সাথে a few, অগণনাযোগ্যের সাথে a little।",hi:"सकारात्मक वाक्य और पेशकश में some, ज़्यादातर सवाल और नकारात्मक में any। गिनने योग्य के साथ a few, न गिनने योग्य के साथ a little।",ex:["I have some questions.","Do you have any questions?","I need a few minutes.","Add a little sugar."]}
],quiz:[
["Can you give me some ___?",["advices","advice","an advice","advise"],1,"Advice is uncountable."],
["How ___ orders did we receive today?",["much","many","lot","little"],1,"Orders is a plural countable noun."],
["We don't have ___ time.",["many","much","a few","few"],1,"Time is uncountable."],
["Do you have ___ questions?",["some","any","a","much"],1,"Use any in most questions."],
["I need ___ minutes to finish.",["a little","a few","much","an"],1,"Minutes is countable, so use a few."],
["The ___ in this store is beautiful.",["furnitures","furniture","furniture are","a furniture"],1,"Furniture is uncountable."]
]},
relative:{t:"Relative clauses",icon:"pin",d:"Join ideas with who, which, that, whose and where.",sections:[
{h:"Who, which and that",en:"Use who for people, which for things, and that for both people and things.",bn:"মানুষের জন্য who, জিনিসের জন্য which, আর দুটোর জন্যই that।",hi:"लोगों के लिए who, चीज़ों के लिए which, और दोनों के लिए that।",ex:["The customer who called yesterday wants a refund.","This is the sofa which sold the most.","The report that you sent is correct."]},
{h:"Whose and where",en:"Use whose to show that something belongs to someone, and where for places.",bn:"কারও কিছু থাকলে whose, জায়গার জন্য where।",hi:"किसी की चीज़ बताने के लिए whose, जगह के लिए where।",ex:["This is the colleague whose laptop stopped working.","This is the store where I work."]},
{h:"Leaving out the word",en:"You can leave out who, which or that when it is the object of the verb.",bn:"who, which বা that যখন ক্রিয়ার কর্ম, তখন সেটি বাদ দেওয়া যায়।",hi:"जब who, which या that क्रिया का कर्म हो, तब उसे हटाया जा सकता है।",ex:["The file you shared is open."]},
{h:"Extra information",en:"When the clause only adds extra information, put commas around it and do not use that.",bn:"অংশটি শুধু বাড়তি তথ্য দিলে দুই পাশে কমা দিন এবং that ব্যবহার করবেন না।",hi:"जब हिस्सा सिर्फ़ अतिरिक्त जानकारी देता हो, तब उसके दोनों ओर कॉमा लगाएँ और that न लगाएँ।",ex:["Pune, which is near Mumbai, has many stores."]}
],quiz:[
["The man ___ called you is my manager.",["which","who","whose","where"],1,"Use who for people."],
