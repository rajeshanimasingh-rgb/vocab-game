<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal English Speaking Coach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practise English speaking, vocabulary, grammar, office English and interviews, with Bengali and Hindi meanings.">
<meta name="theme-color" content="#1a56db">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a56db'/%3E%3Crect x='12' y='6' width='8' height='14' rx='4' fill='white'/%3E%3Cpath d='M8 15a8 8 0 0 0 16 0M16 23v4' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0f2547;--ink-2:#465a78;--ink-3:#5f7290;
  --blue:#1a56db;--blue-d:#1442ab;--blue-l:#e8f0fe;--blue-xl:#f3f7ff;
  --line:#dfe7f3;--bg:#f4f7fc;--card:#ffffff;
  --good:#0f7a47;--good-bg:#e3f6ec;--bad:#c02626;--bad-bg:#fde8e8;--warn:#a15c00;--warn-bg:#fff3dc;
  --shadow:0 1px 2px rgba(15,37,71,.05),0 6px 20px rgba(15,37,71,.06);
  --r:16px;--side:244px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Nirmala UI","Noto Sans Bengali","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
h1{font-size:1.6rem;line-height:1.25;letter-spacing:-.01em}
h2{font-size:1.15rem;line-height:1.3}
h3{font-size:1rem;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
[lang=bn],[lang=hi]{line-height:1.6}

/* layout */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;font-weight:700;line-height:1.2}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:.76rem}
.nav{list-style:none;margin:0;padding:6px 10px 14px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover{background:var(--blue-xl);color:var(--ink)}
.nav a[aria-current=page]{background:var(--blue-l);color:var(--blue-d);font-weight:650}
.side-foot{margin-top:auto;padding:12px 16px;font-size:.8rem;color:var(--ink-3);border-top:1px solid var(--line)}
.main{margin-left:var(--side);min-height:100vh}
.topbar{display:none}
.view{max-width:1060px;margin:0 auto;padding:26px 24px 48px}
.page-head{margin-bottom:18px}
.page-head p{color:var(--ink-2);margin-top:4px}
.page-head h1:focus{outline:none}
.bottom-nav{display:none}
.scrim{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.grid>.card+.card{margin-top:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section{margin-top:22px}
.section>h2{margin-bottom:10px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--blue-xl);border-color:#c5d5ee}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--bad);border-color:#f1c4c4}
.btn.danger:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--blue);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--blue-l)}
.icon-btn.on{background:var(--blue-l);border-color:#a9c3f3}
.icon-btn.fav-on{color:#b45309;background:var(--warn-bg);border-color:#f0d49c}
.icon-btn.fav-on .ic{fill:currentColor}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.tab{flex:none;min-height:40px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.92rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--blue-xl)}
.tab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid #c8d5e8;border-radius:11px;background:#fff}
textarea.input{resize:vertical;min-height:84px}
.input:focus{border-color:var(--blue);outline:3px solid #cfdefb}
label.field{display:block;font-weight:600;font-size:.9rem}
label.field .input{margin-top:4px;font-weight:400;font-size:1rem}

/* progress */
.bar{height:9px;background:#e4ebf6;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--blue);border-radius:6px;transition:width .3s}
.bar.good>i{background:var(--good)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);font-size:.78rem;font-weight:650;white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge .ic{width:14px;height:14px}

/* dashboard */
.hero{background:linear-gradient(135deg,#1442ab,#1a56db 60%,#3b7bf0);color:#fff;border:0;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:22px}
.hero p{color:#dfe9ff}
.hero h1{color:#fff}
.hero .grow{min-width:220px}
.hero .btn{border-color:transparent}
.hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.24)}
.hero .btn.primary{background:#fff;color:var(--blue-d)}
.hero .btn.primary:hover{background:#e8f0fe}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:1.55rem;line-height:1.1}
.ring b small{display:block;font-size:.74rem;font-weight:500;color:#dfe9ff}
.stat .stat-ic{width:38px;height:38px;border-radius:11px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;margin-bottom:10px}
.stat b{display:block;font-size:1.65rem;line-height:1.15}
.stat span{color:var(--ink-2);font-size:.9rem}
.check-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.check-item:last-child{border-bottom:0}
.check-dot{width:26px;height:26px;border-radius:50%;border:2px solid #c3d1e6;display:grid;place-items:center;flex:none;color:#fff}
.check-dot .ic{width:15px;height:15px;stroke-width:3}
.check-item.done .check-dot{background:var(--good);border-color:var(--good)}
.quick{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;transition:transform .12s}
.quick:hover{border-color:#b9cdf0;transform:translateY(-1px)}
.quick .stat-ic{width:40px;height:40px;border-radius:11px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;flex:none}
.quick p{color:var(--ink-2);font-size:.85rem}

/* meanings & phrases */
.mean{display:grid;gap:2px;font-size:.95rem;color:var(--ink-2)}
.mean span::before{content:attr(data-l);display:inline-block;min-width:24px;margin-right:6px;padding:0 5px;border-radius:5px;background:var(--blue-l);color:var(--blue-d);font-size:.68rem;font-weight:700;text-align:center;vertical-align:1px;line-height:1.5}
.phrase{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .en{font-weight:600}
.speaker{font-size:.76rem;font-weight:700;color:var(--blue-d);text-transform:uppercase;letter-spacing:.04em}
.actions{display:flex;gap:6px;flex:none}
.practice-slot:empty{display:none}
.practice-slot{width:100%;margin-top:10px}

/* vocabulary */
.word-card h3{font-size:1.15rem}
.word-card .pron{color:var(--ink-3);font-size:.85rem}
.word-card .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--ink-2)}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink-3)}
.search .input{padding-left:40px}
.opt{display:block;width:100%;text-align:left;min-height:46px;padding:10px 14px;margin-top:8px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font-weight:500}
.opt:hover:not(:disabled){background:var(--blue-xl);border-color:#b9cdf0}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.note{padding:10px 12px;border-radius:11px;background:var(--blue-xl);border:1px solid #d6e3f8;font-size:.92rem}
.note.warn{background:var(--warn-bg);border-color:#f0d49c;color:#6b3d00}
.note.bad{background:var(--bad-bg);border-color:#f3c0c0;color:#8a1c1c}
.note.good{background:var(--good-bg);border-color:#b3e4ca;color:#0a5a34}
.game-word{font-size:2rem;font-weight:700;text-align:center;margin:8px 0}

/* speak box */
.speakbox{border:1px solid #cddcf4;background:var(--blue-xl);border-radius:14px;padding:14px}
.target{font-size:1.15rem;font-weight:650;line-height:1.4}
.mic-row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.mic-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 20px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:650;cursor:pointer}
.mic-btn:hover{background:var(--blue-d)}
.mic-btn:disabled{background:#9db0cc;cursor:not-allowed}
.mic-btn.rec{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,38,38,.45)}70%{box-shadow:0 0 0 13px rgba(192,38,38,0)}100%{box-shadow:0 0 0 0 rgba(192,38,38,0)}}
.heard{min-height:48px;margin-top:10px;padding:10px 12px;background:#fff;border:1px dashed #b9cdf0;border-radius:11px}
.heard.empty{color:var(--ink-3)}
.type-row{display:flex;gap:8px;margin-top:10px}
.type-row .input{flex:1;min-width:0}
.result{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.score-pill{font-weight:700;font-size:1.1rem}
.w-ok{color:var(--ink)}
.w-bad,.w-miss,.w-extra{padding:0 3px;border-radius:4px;font-weight:650}
.w-bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy}
.w-miss{background:var(--warn-bg);color:var(--warn);text-decoration:underline dotted}
.w-extra{background:#efe7fb;color:#5b2ca0;text-decoration:line-through}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;margin-top:8px;color:var(--ink-2)}
.mistakes{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.mic-state{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-2)}
.mic-state i{width:9px;height:9px;border-radius:50%;background:#9db0cc}
.mic-state.ok i{background:var(--good)}
.mic-state.no i{background:var(--bad)}

/* tutor */
.honest{display:flex;gap:10px;align-items:flex-start}
.chat{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere}
.msg.coach{align-self:flex-start;background:var(--blue-l);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.check{align-self:stretch;max-width:100%;background:#fff;border:1px solid var(--line)}
.msg .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.74rem;font-weight:700;opacity:.8;margin-bottom:2px}
.fix{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:.93rem}
.fix del{color:var(--bad)}
.fix ins{color:var(--good);text-decoration:none;font-weight:650}

/* email */
.email{white-space:pre-wrap;background:var(--blue-xl);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:.93rem;overflow-wrap:anywhere}

/* grammar table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ex-list{margin:8px 0 0;padding:0;list-style:none}
.ex-list li{display:flex;align-items:center;gap:8px;padding:3px 0}
.ex-list .icon-btn{width:40px;height:40px}
.ex-list .ic{width:16px;height:16px}

/* progress chart */
.chart{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;height:170px;align-items:end;border-bottom:1px solid #c8d5e8;margin-top:22px}
.chart .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:4px}
.chart .col:hover{background:var(--blue-xl)}
.chart .col i{display:block;width:min(56%,36px);min-height:0;background:var(--blue);border-radius:4px 4px 0 0}
.chart .col.today i{background:var(--blue-d)}
.chart .col b{position:absolute;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:650;color:var(--ink-2)}
.chart .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:3;background:var(--ink);color:#fff;padding:5px 9px;border-radius:7px;font-size:.78rem;white-space:nowrap}
.chart .col:hover .tip,.chart .col:focus .tip{display:block}
.chart .col:first-child .tip{left:0;transform:none}
.chart .col:last-child .tip{left:auto;right:0;transform:none}
.goal-line{position:absolute;left:0;right:0;border-top:2px dashed #7f93b2;pointer-events:none;z-index:2}
.goal-line span{position:absolute;right:0;bottom:2px;font-size:.72rem;color:var(--ink-2);background:rgba(255,255,255,.88);padding:0 3px}
.chart-x{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:.78rem;color:var(--ink-2);margin-top:5px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;max-width:min(92vw,440px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:80;pointer-events:none;transition:all .2s;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.store-warn{background:var(--warn-bg);color:#6b3d00;padding:8px 16px;font-size:.88rem;text-align:center}

/* language */
.nav-lang{padding:4px 12px 10px}
.nav-lang label{font-size:.8rem;color:var(--ink-2)}
.nav-lang select{min-height:38px;padding:5px 8px;font-size:.9rem}
.tr-copy{display:none;font-size:.95rem;color:var(--ink-2)}
body.lang-other .tr-copy{display:block}
body.lang-other .mean [lang]{display:none}
body.lang-bn .mean [lang=hi],body.lang-hi .mean [lang=bn]{display:none}
#harvest{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:16px}
#hv-box{max-width:480px;width:100%}
#hv-list{white-space:pre-wrap}
#gt-box{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
iframe.skiptranslate,.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}

/* responsive */
@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(15,37,71,.2);width:min(82vw,290px)}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,37,71,.42);z-index:35}
  .main{margin-left:0;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:8px 16px;font-weight:700;min-height:56px}
  .topbar .icon-btn{border:0;background:transparent}
  .topbar .brand-mark{width:32px;height:32px;border-radius:9px}
  .view{padding:16px 16px 30px}
  h1{font-size:1.38rem}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a,.bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:.72rem;font-weight:600;color:var(--ink-3);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
  .bottom-nav [aria-current=page]{color:var(--blue-d)}
  .toast{bottom:82px}
}
@media (max-width:560px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hero{padding:18px;gap:16px}
  .ring{width:96px;height:96px}
  .ring b{font-size:1.25rem}
  .card{padding:15px}
  .stat b{font-size:1.4rem}
  .msg{max-width:92%}
  .type-row{flex-wrap:wrap}
  .type-row .btn{width:100%}
  .mic-btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<aside class="sidebar" aria-label="Main navigation">
  <div class="brand"><span class="brand-mark brand-ic"></span><span>Personal English<small>Speaking Coach</small></span></div>
  <ul class="nav" id="nav"></ul>
  <div class="side-foot"><span id="gt-note">Works free in your browser.</span><br>No login or API key.<br><a href="https://rajeshanimasingh-rgb.github.io/vocab-game/" target="_blank" rel="noopener noreferrer">Open app link</a></div>
</aside>
<div class="scrim" data-act="close-menu"></div>
<div class="main">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" data-act="menu" aria-label="Open menu"></button>
    <span class="brand-mark brand-ic"></span><span id="top-title">Dashboard</span>
  </header>
  <div class="store-warn hidden" id="store-warn" role="alert"></div>
  <main class="view" id="view"></main>
</div>
<nav class="bottom-nav" id="bottom-nav" aria-label="Quick navigation"></nav>
<div id="gt-box" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Please turn on JavaScript to use this app.</p></noscript>
<script>
(function(){
"use strict";
/* ===== CONTENT: VOCABULARY =====
   First 20 words (and their Bengali meanings) come unchanged from the original English Vocabulary Game.
   Format: English | Bengali | Hindi | Pronunciation | Example | Category */
const WORD_ROWS=[

["Waiter","Certainly. Would you like to pay by card or cash?","অবশ্যই। আপনি কি কার্ডে দেবেন, না নগদে?","ज़रूर। आप कार्ड से देंगे या नकद?"]]},
{id:"i2",t:"Visiting the doctor",goal:"Explain a health problem clearly.",lines:[
["Doctor","What seems to be the problem?","আপনার সমস্যাটা কী?","आपको क्या तकलीफ़ है?"],
["Patient","I have had a fever since yesterday.","গতকাল থেকে আমার জ্বর।","मुझे कल से बुख़ार है।"],
["Doctor","Do you also have a cough or a headache?","আপনার কি কাশি বা মাথাব্যথাও আছে?","क्या आपको खाँसी या सिरदर्द भी है?"],
["Patient","Yes, my head has been hurting all morning.","হ্যাঁ, সকাল থেকে আমার মাথা ব্যথা করছে।","हाँ, सुबह से मेरे सिर में दर्द है।"],
["Doctor","Take this medicine twice a day after food.","এই ওষুধটি দিনে দুবার খাবারের পরে খাবেন।","यह दवा दिन में दो बार खाने के बाद लीजिए।"],
["Patient","Should I come back for a check-up?","আমাকে কি আবার দেখাতে আসতে হবে?","क्या मुझे दोबारा दिखाने आना चाहिए?"]]},
{id:"i3",t:"Booking a train ticket",goal:"Ask about trains, seats and fares.",lines:[
["Passenger","I would like to book a ticket to Delhi.","আমি দিল্লির একটি টিকিট কাটতে চাই।","मैं दिल्ली का एक टिकट बुक करना चाहता हूँ।"],
["Clerk","Which date are you planning to travel?","আপনি কোন তারিখে যেতে চান?","आप किस तारीख़ को यात्रा करना चाहते हैं?"],
["Passenger","I am planning to leave next Monday.","আমি আগামী সোমবার যাওয়ার পরিকল্পনা করছি।","मैं अगले सोमवार को जाने की सोच रहा हूँ।"],
["Clerk","There are only a few seats left in sleeper class.","স্লিপার ক্লাসে আর অল্প কয়েকটি আসন বাকি আছে।","स्लीपर क्लास में बस कुछ ही सीटें बची हैं।"],
["Passenger","That is fine. What is the total fare?","ঠিক আছে। মোট ভাড়া কত?","ठीक है। कुल किराया कितना है?"],
["Clerk","The fare is eight hundred rupees.","ভাড়া আটশো টাকা।","किराया आठ सौ रुपये है।"]]},
{id:"i4",t:"Making plans with friends",goal:"Invite someone and agree on a time.",lines:[
["Rahul","Are you free this weekend?","এই সপ্তাহান্তে তুমি কি ফাঁকা আছ?","क्या तुम इस सप्ताहांत खाली हो?"],
["Priya","I think so. What do you have in mind?","মনে হয় আছি। তুমি কী ভাবছ?","शायद हाँ। तुम्हारे मन में क्या है?"],
["Rahul","Why don't we watch a movie on Saturday?","শনিবার একটা সিনেমা দেখলে কেমন হয়?","क्यों न हम शनिवार को फ़िल्म देखें?"],
["Priya","That sounds great. What time should we meet?","দারুণ শোনাচ্ছে। আমরা কখন দেখা করব?","बहुत बढ़िया। हम कितने बजे मिलें?"],
["Rahul","Let us meet at the mall at four.","চলো চারটেয় মলে দেখা করি।","चलो चार बजे मॉल में मिलते हैं।"],
["Priya","Perfect. I will see you there.","ঠিক আছে। সেখানেই দেখা হবে।","ठीक है। वहीं मिलते हैं।"]]},
{id:"i5",t:"Calling customer care",goal:"Make a polite complaint.",lines:[
["Agent","Thank you for calling. How may I help you?","ফোন করার জন্য ধন্যবাদ। আমি কীভাবে সাহায্য করতে পারি?","फ़ोन करने के लिए धन्यवाद। मैं आपकी क्या मदद कर सकता हूँ?"],
["Customer","I received a damaged product yesterday.","আমি গতকাল একটি ক্ষতিগ্রস্ত পণ্য পেয়েছি।","मुझे कल एक ख़राब सामान मिला।"],
["Agent","I am very sorry about that. May I have your order number?","এর জন্য আমি খুব দুঃখিত। আপনার অর্ডার নম্বরটি বলবেন?","इसके लिए मुझे बहुत खेद है। क्या आप अपना ऑर्डर नंबर बता सकते हैं?"],
["Customer","Yes, I have sent it to you by message.","হ্যাঁ, আমি মেসেজে পাঠিয়ে দিয়েছি।","हाँ, मैंने उसे मैसेज से भेज दिया है।"],
["Customer","I would like a replacement as soon as possible.","আমি যত তাড়াতাড়ি সম্ভব একটি বদলি পণ্য চাই।","मुझे जल्द से जल्द इसका बदला हुआ सामान चाहिए।"],
["Agent","We will arrange it within three days.","আমরা তিন দিনের মধ্যে ব্যবস্থা করে দেব।","हम तीन दिनों के अंदर इसकी व्यवस्था कर देंगे।"]]},
{id:"i6",t:"Talking about hobbies",goal:"Share what you enjoy and why.",lines:[
["Anjali","What do you usually do in your free time?","অবসর সময়ে আপনি সাধারণত কী করেন?","ख़ाली समय में आप आमतौर पर क्या करते हैं?"],
["Vikram","I enjoy reading and listening to music.","আমি পড়তে এবং গান শুনতে ভালোবাসি।","मुझे पढ़ना और संगीत सुनना पसंद है।"],
["Anjali","How long have you been reading books?","আপনি কতদিন ধরে বই পড়ছেন?","आप कितने समय से किताबें पढ़ रहे हैं?"],
["Vikram","I have been reading since my school days.","আমি স্কুলের দিন থেকে বই পড়ছি।","मैं स्कूल के दिनों से पढ़ रहा हूँ।"],
["Anjali","It helps you relax after work, doesn't it?","এটা কাজের পরে আরাম দেয়, তাই না?","यह काम के बाद आराम देता है, है ना?"],
["Vikram","Yes, and it also improves my vocabulary.","হ্যাঁ, আর এতে আমার শব্দভাণ্ডারও বাড়ে।","हाँ, और इससे मेरी शब्दावली भी बेहतर होती है।"]]}
],
Advanced:[
{id:"a1",t:"Giving your opinion",goal:"Share a view with reasons.",lines:[
["Sara","What is your opinion on working from home?","বাড়ি থেকে কাজ করা নিয়ে আপনার মতামত কী?","घर से काम करने के बारे में आपकी क्या राय है?"],
["Karan","In my opinion, it saves time and improves focus.","আমার মতে, এতে সময় বাঁচে এবং মনোযোগ বাড়ে।","मेरी राय में, इससे समय बचता है और ध्यान बेहतर होता है।"],
["Sara","However, some people feel isolated at home.","তবে কেউ কেউ বাড়িতে একা বোধ করেন।","हालाँकि, कुछ लोग घर पर अकेलापन महसूस करते हैं।"],
["Karan","That is a fair point, and I understand it.","এটা যুক্তিসঙ্গত কথা, আমি বুঝি।","यह सही बात है, और मैं इसे समझता हूँ।"],
["Karan","A hybrid model may offer the best of both.","হাইব্রিড মডেলে হয়তো দুটোরই সুবিধা পাওয়া যাবে।","हाइब्रिड मॉडल से शायद दोनों के फ़ायदे मिल सकते हैं।"],
["Sara","I completely agree with you on that.","এ বিষয়ে আমি আপনার সাথে সম্পূর্ণ একমত।","इस पर मैं आपसे पूरी तरह सहमत हूँ।"]]},
{id:"a2",t:"Disagreeing politely",goal:"Say no without sounding rude.",lines:[
["Manager","I think we should launch the offer next week.","আমার মনে হয় আগামী সপ্তাহে অফারটি চালু করা উচিত।","मुझे लगता है हमें अगले हफ़्ते ऑफ़र शुरू करना चाहिए।"],
["Analyst","I see your point, but the stock may not be ready.","আপনার কথা বুঝতে পারছি, কিন্তু মাল হয়তো তৈরি থাকবে না।","मैं आपकी बात समझता हूँ, लेकिन स्टॉक शायद तैयार नहीं होगा।"],
["Manager","What makes you say that?","আপনি এটা কেন বলছেন?","आप ऐसा क्यों कह रहे हैं?"],
["Analyst","With respect, the latest data shows a shortage.","সম্মানের সাথে বলছি, সর্বশেষ তথ্য ঘাটতি দেখাচ্ছে।","सम्मान के साथ, ताज़ा आँकड़े कमी दिखा रहे हैं।"],
["Analyst","Could we consider moving it by one week?","আমরা কি এক সপ্তাহ পিছিয়ে দেওয়ার কথা ভাবতে পারি?","क्या हम इसे एक हफ़्ते आगे बढ़ाने पर विचार कर सकते हैं?"],
["Manager","That seems reasonable. Let us review it tomorrow.","এটা যুক্তিসঙ্গত মনে হচ্ছে। কাল আবার দেখে নেব।","यह ठीक लगता है। कल इसकी समीक्षा करते हैं।"]]},
{id:"a3",t:"Solving a problem together",goal:"Describe a cause and suggest a fix.",lines:[
["Lead","Why did the numbers change after the update?","আপডেটের পরে সংখ্যাগুলো কেন বদলে গেল?","अपडेट के बाद आँकड़े क्यों बदल गए?"],
["Analyst","It appears that some records were counted twice.","মনে হচ্ছে কিছু রেকর্ড দুবার গোনা হয়েছে।","लगता है कुछ रिकॉर्ड दो बार गिने गए।"],
["Lead","How can we prevent this from happening again?","আবার যাতে এমন না হয়, তার জন্য কী করতে পারি?","इसे दोबारा होने से कैसे रोक सकते हैं?"],
["Analyst","We could add an automatic check before each upload.","প্রতিবার আপলোডের আগে আমরা একটি স্বয়ংক্রিয় যাচাই যোগ করতে পারি।","हम हर अपलोड से पहले एक स्वचालित जाँच जोड़ सकते हैं।"],
["Lead","Good idea. How long would that take?","ভালো ভাবনা। এতে কত সময় লাগবে?","अच्छा विचार है। इसमें कितना समय लगेगा?"],
["Analyst","I expect to finish it by the end of this week.","আমি এই সপ্তাহের শেষের মধ্যে শেষ করার আশা করছি।","मुझे उम्मीद है कि मैं इस हफ़्ते के अंत तक पूरा कर लूँगा।"]]},
{id:"a4",t:"Presenting an idea",goal:"Open, explain and close a short talk.",lines:[
["Speaker","Thank you all for joining me today.","আজ আমার সাথে যোগ দেওয়ার জন্য সবাইকে ধন্যবাদ।","आज मेरे साथ जुड़ने के लिए आप सभी का धन्यवाद।"],
["Speaker","I would like to share an idea to reduce returns.","আমি রিটার্ন কমানোর একটি ভাবনা জানাতে চাই।","मैं रिटर्न कम करने का एक विचार साझा करना चाहता हूँ।"],
["Speaker","As you can see, most returns happen in the first week.","যেমন দেখছেন, বেশিরভাগ রিটার্ন প্রথম সপ্তাহেই হয়।","जैसा कि आप देख सकते हैं, ज़्यादातर रिटर्न पहले हफ़्ते में होते हैं।"],
["Speaker","Therefore, we should call customers soon after delivery.","তাই ডেলিভারির পরেই গ্রাহকদের ফোন করা উচিত।","इसलिए हमें डिलीवरी के तुरंत बाद ग्राहकों को फ़ोन करना चाहिए।"],
["Speaker","To sum up, a small step can save a lot of money.","সংক্ষেপে, একটি ছোট পদক্ষেপ অনেক টাকা বাঁচাতে পারে।","संक्षेप में, एक छोटा क़दम बहुत पैसा बचा सकता है।"],
["Speaker","I would be happy to take any questions now.","এখন যেকোনো প্রশ্নের উত্তর দিতে পেরে আমি খুশি হব।","अब मुझे आपके सवालों के जवाब देने में ख़ुशी होगी।"]]},
{id:"a5",t:"Networking and small talk",goal:"Start a friendly professional chat.",lines:[
["Meera","Hi, I don't think we have met. I am Meera.","হাই, মনে হয় আমাদের আগে দেখা হয়নি। আমি মীরা।","नमस्ते, शायद हम पहले नहीं मिले। मैं मीरा हूँ।"],
["Arjun","Pleased to meet you. Which team do you work with?","আপনার সাথে পরিচিত হয়ে খুশি হলাম। আপনি কোন দলে কাজ করেন?","आपसे मिलकर ख़ुशी हुई। आप किस टीम में काम करती हैं?"],
["Meera","I work in marketing. How about you?","আমি মার্কেটিংয়ে কাজ করি। আপনি?","मैं मार्केटिंग में काम करती हूँ। और आप?"],
["Arjun","I handle reporting and data for the sales team.","আমি সেলস টিমের রিপোর্টিং ও ডেটা দেখি।","मैं सेल्स टीम की रिपोर्टिंग और डेटा देखता हूँ।"],
["Meera","That sounds interesting. We should talk more sometime.","শুনতে ভালো লাগছে। আমাদের কখনও আরও কথা বলা উচিত।","यह दिलचस्प लगता है। हमें कभी और बात करनी चाहिए।"],
["Arjun","Definitely. Let me give you my contact details.","অবশ্যই। আমি আপনাকে আমার যোগাযোগের তথ্য দিচ্ছি।","ज़रूर। मैं आपको अपना संपर्क विवरण देता हूँ।"]]},
{id:"a6",t:"Discussing your career",goal:"Talk about growth with your manager.",lines:[
["You","Do you have a few minutes to discuss my career?","আমার কেরিয়ার নিয়ে কথা বলার জন্য আপনার কি কয়েক মিনিট সময় হবে?","क्या आपके पास मेरे करियर पर बात करने के लिए कुछ मिनट हैं?"],
["Manager","Of course. What would you like to talk about?","অবশ্যই। আপনি কী নিয়ে কথা বলতে চান?","ज़रूर। आप किस बारे में बात करना चाहते हैं?"],
["You","I am keen to take on more responsibility.","আমি আরও দায়িত্ব নিতে আগ্রহী।","मैं और ज़िम्मेदारी लेने के लिए उत्सुक हूँ।"],
["You","Over the past year, I have automated several reports.","গত এক বছরে আমি কয়েকটি রিপোর্ট স্বয়ংক্রিয় করেছি।","पिछले एक साल में मैंने कई रिपोर्ट स्वचालित की हैं।"],
["Manager","That has been very useful for the team.","এটা দলের জন্য খুব কাজে লেগেছে।","यह टीम के लिए बहुत उपयोगी रहा है।"],
["You","What skills should I develop for the next role?","পরের পদের জন্য আমার কোন দক্ষতা বাড়ানো উচিত?","अगली भूमिका के लिए मुझे कौन से कौशल विकसित करने चाहिए?"]]}
]};

const KEY="pesc_v1";
let storageOK=true;
function readLS(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return null}}
function writeLS(k,v){try{localStorage.setItem(k,v);return true}catch(e){storageOK=false;return false}}
function defaults(){return{
  settings:{name:"Rajesh",target:15,level:"Beginner",accent:"en-IN",rate:1,autoRead:true,lang:""},
  history:{},lessons:{},learned:{},fav:{},grammar:{},interview:{},
  game:{level:1,best:0,attempts:0,daily:{date:"",words:[]}},
  tutor:{topic:null,idx:0,msgs:[],done:false},
  speakPos:{},migrated:false
}}
function load(){
  const d=defaults();let raw=readLS(KEY),st=null;
  if(raw){try{st=JSON.parse(raw)}catch(e){writeLS(KEY+"_broken",raw)}}
  if(!st||typeof st!=="object")st={};
  const out=Object.assign(d,st);
  out.settings=Object.assign(defaults().settings,st.settings);
  out.game=Object.assign(defaults().game,st.game);
  out.tutor=Object.assign(defaults().tutor,st.tutor);
  if(!out.migrated){
    /* bring over scores saved by the old English Vocabulary Game */
    const lv=Number(readLS("level")),be=Number(readLS("best")),at=Number(readLS("attempts"));
    if(lv>1)out.game.level=lv;
    if(be>0)out.game.best=be;
    if(at>0)out.game.attempts=at;
    out.migrated=true;
  }
  return out;
}

/* ===== DATES AND PROGRESS LOGGING ===== */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayKey(){return ymd(new Date())}
function daysAgo(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return ymd(d)}
function niceDate(k){const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-IN",{day:"numeric",month:"short",weekday:"short"})}
function day(k){
  k=k||todayKey();
  if(!S.history[k])S.history[k]={sec:0,act:{},scores:{}};
  return S.history[k];
}
function logAct(kind,n){const d=day();d.act[kind]=(d.act[kind]||0)+(n||1);save()}
function logScore(area,p){const d=day(),c=d.scores[area]||(d.scores[area]={n:0,sum:0});c.n++;c.sum+=p;save()}
function isActive(k){
  const d=S.history[k];if(!d)return false;
  return d.sec>=60||Object.values(d.act).some(v=>v>0);
}
function streak(){
  let i=isActive(daysAgo(0))?0:1,c=0;
  while(isActive(daysAgo(i))){c++;i++}
  return c;
}
function bestStreak(){
  const keys=Object.keys(S.history).filter(isActive).sort();
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    const p=k.split("-"),t=Date.UTC(+p[0],+p[1]-1,+p[2]);
    run=prev!==null&&t-prev===864e5?run+1:1;best=Math.max(best,run);prev=t;
  });
  return best;
}
function areaAverage(area){
  let n=0,sum=0;
  Object.values(S.history).forEach(d=>{const c=d.scores[area];if(c){n+=c.n;sum+=c.sum}});
  return n?{avg:Math.round(sum/n),n}:null;
}
function dayAverage(d){
  let n=0,sum=0;
  Object.values(d.scores).forEach(c=>{n+=c.n;sum+=c.sum});
  return n?Math.round(sum/n):null;
}
function learnedCount(){return Object.keys(S.learned).length}
function completedCount(){return ALL_LESSONS.filter(l=>S.lessons[l.id]).length}

async function copyText(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}
  }catch(e){}
  const ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();

/* ===== TEXT TO SPEECH ===== */
const ttsOK="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function pickVoice(){
  const vs=speechSynthesis.getVoices(),want=S.settings.accent.toLowerCase();
  return vs.find(v=>v.lang.replace("_","-").toLowerCase()===want)||vs.find(v=>/^en/i.test(v.lang))||null;
}
function chunkText(t){
  if(Array.isArray(t))return t;
  if(t.length<180)return [t];
  return t.match(/[^.!?\n]+[.!?]*/g).map(s=>s.trim()).filter(Boolean);
}
function say(text,rate){
  if(!ttsOK){toast("Your browser cannot read text aloud. Please try Chrome.");return}
  Mic.abort();
  const run=()=>{
    const v=pickVoice();
    chunkText(text).forEach(c=>{
      const u=new SpeechSynthesisUtterance(c);
      u.lang=S.settings.accent;if(v)u.voice=v;
      u.rate=rate||S.settings.rate;
      speechSynthesis.speak(u);
    });
    speechSynthesis.resume();
  };
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(run,60)}else run();
}
function stopSpeaking(){if(ttsOK)speechSynthesis.cancel()}

/* ===== SPEECH RECOGNITION ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let micPerm="unknown";
const Mic={
  rec:null,
  start(o){
    if(!SR){o.onError("unsupported");return}
    this.abort();stopSpeaking();
    const r=new SR();
    r.lang=S.settings.accent;
    r.continuous=!!o.long;r.interimResults=true;r.maxAlternatives=1;
    let text="",failed=false;
    r.onresult=e=>{
      /* Android Chrome repeats earlier words inside later results, so merge instead of joining */
      let t="";
      for(let i=0;i<e.results.length;i++){
        const s=e.results[i][0].transcript.trim();
        if(!s)continue;
        const lt=t.toLowerCase(),ls=s.toLowerCase();
        if(!t||ls.startsWith(lt))t=s;
        else if(!lt.endsWith(ls))t+=" "+s;
      }
      text=t;o.onText(t);
    };
    r.onerror=e=>{
      if(e.error==="aborted")return;
      failed=true;
      if(e.error==="not-allowed"||e.error==="service-not-allowed")setMicPerm("denied");
      o.onError(e.error);
    };
    r.onend=()=>{if(this.rec===r)this.rec=null;if(!failed)o.onEnd(text)};
    this.rec=r;
    try{r.start();if(micPerm==="prompt"||micPerm==="unknown")setMicPerm("asked")}
    catch(err){this.rec=null;failed=true;o.onError("start-failed")}
  },
  stop(){if(this.rec)this.rec.stop()},
  abort(){

/* ===== COMPARE SPOKEN SENTENCE WITH CORRECT SENTENCE ===== */
const CONTRACT={"i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would","you're":"you are","you've":"you have","you'll":"you will","we're":"we are","we've":"we have","we'll":"we will","they're":"they are","they've":"they have","they'll":"they will","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","let's":"let us","there's":"there is","here's":"here is","can't":"can not","cannot":"can not","won't":"will not","shan't":"shall not","he'll":"he will","she'll":"she will"};
const SOUND_SAME={their:"there","they're":"there",too:"to",two:"to",your:"you're",hear:"here",write:"right",no:"know",buy:"by",bye:"by",four:"for",ok:"okay",sea:"see",son:"sun",meat:"meet",weak:"week",one:"won",mister:"mr",whether:"weather",ate:"eight",some:"sum",wait:"weight"};
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){
  if(n<20)return [ONES[n]];
  if(n<100)return n%10?[TENS[Math.floor(n/10)],ONES[n%10]]:[TENS[n/10]];
  if(n<1000)return n%100?[ONES[Math.floor(n/100)],"hundred"].concat(numWords(n%100)):[ONES[n/100],"hundred"];
  return [String(n)];
}
function keysOf(word){
  const out=[];
  word.toLowerCase().replace(/[’‘`]/g,"'").split(/[-–—:\/]/).forEach(part=>{
    let k=part.replace(/^[^a-z0-9%]+|[^a-z0-9%]+$/g,"").replace(/\./g,"");
    if(!k)return;
    const pct=k.endsWith("%");if(pct)k=k.slice(0,-1);
    let list;
    if(/^\d+$/.test(k))list=numWords(Number(k));
    else if(CONTRACT[k])list=CONTRACT[k].split(" ");
    else if(/n't$/.test(k))list=[k.slice(0,-3),"not"];
    else list=[k];
    if(pct)list=list.concat("percent");
    list.forEach(w=>out.push(SOUND_SAME[w]||w));
  });
  return out;
}
function tokenize(s){
  const raw=String(s).trim().split(/\s+/).filter(Boolean),toks=[];
  raw.forEach((w,i)=>keysOf(w).forEach(k=>toks.push({k,i})));
  return{raw,toks};
}
function compareText(target,said){
  const A=tokenize(target),B=tokenize(said),a=A.toks,b=B.toks,n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i].k===b[j].k?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&a[i].k===b[j].k){ops.push({t:"ok"});i++;j++}
    else if(i<n&&(j>=m||dp[i+1][j]>=dp[i][j+1]))ops.push({t:"miss",i:i++});
    else ops.push({t:"extra",j:j++});
  }
  /* a missing word next to an extra word means one word was said wrongly */
  const tState=new Array(A.raw.length).fill("ok"),sState=new Array(B.raw.length).fill("ok"),mistakes=[];
  const rank={ok:0,extra:1,miss:2,bad:3};
  const mark=(arr,idx,st)=>{if(rank[st]>rank[arr[idx]])arr[idx]=st};
  let matched=0,p=0;
  while(p<ops.length){
    if(ops[p].t==="ok"){matched++;p++;continue}
    const miss=[],ext=[];
    while(p<ops.length&&ops[p].t!=="ok"){(ops[p].t==="miss"?miss:ext).push(ops[p]);p++}
    const pairs=Math.min(miss.length,ext.length);
    for(let q=0;q<pairs;q++){
      const tw=A.raw[a[miss[q].i].i],sw=B.raw[b[ext[q].j].i];
      mark(tState,a[miss[q].i].i,"bad");mark(sState,b[ext[q].j].i,"bad");
      mistakes.push('You said "'+sw+'". The correct word is "'+tw+'".');
    }
    miss.slice(pairs).forEach(o=>{const r=a[o.i].i;mark(tState,r,"miss");mistakes.push('Missing word: "'+A.raw[r]+'".')});
    ext.slice(pairs).forEach(o=>{const r=b[o.j].i;mark(sState,r,"extra");mistakes.push('Extra word: "'+B.raw[r]+'".')});
  }
  const score=n||m?Math.round(100*matched/Math.max(n,m)):0;
  return{score,mistakes:Array.from(new Set(mistakes)),tRaw:A.raw,sRaw:B.raw,tState,sState};
}
function wordsHTML(raw,state){
  const cls={ok:"w-ok",bad:"w-bad",miss:"w-miss",extra:"w-extra"};
  return raw.map((w,i)=>'<span class="'+cls[state[i]]+'">'+esc(w)+"</span>").join(" ");
}

    '<span data-micstate>'+micStateHTML()+"</span></div>"+
    '<div class="note warn mt sb-msg'+(SR?" hidden":"")+'" role="alert">'+(SR?"":esc(micErrorText("unsupported")))+"</div>"+

    '<div class="type-row"><input class="input sb-input" aria-label="Type the sentence" placeholder="Or type the sentence here" autocomplete="off" autocapitalize="sentences" data-enter="sb-check">'+
    '<button class="btn" data-act="sb-check">Check</button></div>'+
    '<div class="result sb-result hidden" aria-live="polite"></div>';

function sbOf(el){const h=el.closest(".speakbox");return{h,o:h._sb}}
function sbMessage(h,text){
  const m=$(".sb-msg",h);
  m.textContent=text||"";m.classList.toggle("hidden",!text);
}
function sbMic(btn){
  const{h,o}=sbOf(btn);
  if(btn.classList.contains("rec")){Mic.stop();return}
  sbMessage(h,"");$(".sb-result",h).classList.add("hidden");
  const heard=$(".sb-heard",h);
  heard.textContent="Listening... please speak now.";heard.classList.add("empty");
  setRec(btn);
  Mic.start({long:o.long,
    onText:t=>{heard.textContent=t;heard.classList.toggle("empty",!t)},
    onEnd:t=>{
      resetMicBtn(btn);
      if(t)sbGrade(h,t);
      else{heard.textContent="Your spoken words will appear here.";sbMessage(h,micErrorText("no-speech"))}
    },
    onError:code=>{
      resetMicBtn(btn);
      heard.textContent="Your spoken words will appear here.";
      sbMessage(h,micErrorText(code));
      if(code==="not-allowed"||code==="service-not-allowed"||code==="audio-capture")$(".sb-input",h).focus();
    }
  });
}
function sbGrade(h,text){
  const o=h._sb,r=compareText(o.target,text),res=$(".sb-result",h);
  o.attempts++;
  logAct("speak");logScore(o.area||"speaking",r.score);
  if(o.area==="office")logAct("office");
  if(o.area==="interview")logAct("interview");
  const badge=r.score===100?"good":r.score>=70?"":r.score>=40?"warn":"bad";
  const verdict=r.score===100?"Perfect match":r.score>=70?"Good, nearly there":r.score>=40?"Keep practising":"Try again, slowly";
  $(".sb-heard",h).textContent=text;$(".sb-heard",h).classList.remove("empty");
  res.innerHTML=
    '<div class="row between"><span class="score-pill">'+r.score+'% match</span><span class="badge '+badge+'">'+verdict+"</span></div>"+
    '<p class="small muted mt">Correct sentence</p><p class="notranslate">'+wordsHTML(r.tRaw,r.tState)+"</p>"+
    '<p class="small muted mt">What you said</p><p class="notranslate">'+wordsHTML(r.sRaw,r.sState)+"</p>"+
    (r.mistakes.length?'<ul class="mistakes notranslate">'+r.mistakes.slice(0,8).map(m=>"<li>"+esc(m)+"</li>").join("")+"</ul>":"")+
    (r.mistakes.length?'<div class="legend"><span class="w-bad">wrong word</span><span class="w-miss">missing</span><span class="w-extra">extra</span></div>':"")+
    '<p class="small muted mt">Attempt '+o.attempts+'. Words that sound the same, such as "there" and "their", count as correct.</p>'+
    '<div class="row mt"><button class="btn primary" data-act="sb-retry">Try again</button></div>';
  res.classList.remove("hidden");
  if(o.onDone)o.onDone(r.score);
}

/* Free dictation into a text box, for the Tutor and Interview answers */
function dictate(btn){
  const ta=$(btn.dataset.into);
  if(btn.classList.contains("rec")){Mic.stop();return}
  if(!SR){toast(micErrorText("unsupported"));ta.focus();return}
  const before=ta.value.trim();
  setRec(btn);
  Mic.start({long:true,
    onText:t=>{ta.value=(before?before+" ":"")+t;ta.dataset.mic="1";ta.dispatchEvent(new Event("input",{bubbles:true}))},
    onEnd:()=>resetMicBtn(btn),
    onError:code=>{resetMicBtn(btn);const m=$("#mic-msg");if(m){m.textContent=micErrorText(code);m.classList.remove("hidden")}else toast(micErrorText(code));ta.focus()}
  });
}

function mountQuiz(host,qs,onFinish){
  host.dataset.quiz="1";
  host._q={qs,i:0,score:0,onFinish};
  renderQuiz(host);
}
function renderQuiz(host){
  const z=host._q,q=z.qs[z.i],order=shuffle(q.opts.map((t,i)=>({t,i})));
  z.answered=false;
  host.innerHTML=
    '<div class="row between small muted"><span>Question '+(z.i+1)+" of "+z.qs.length+"</span><span>Score "+z.score+"</span></div>"+
    '<div class="mt">'+barHTML(z.i/z.qs.length*100)+"</div>"+
    '<h3 class="mt'+(q.nt?" notranslate":"")+'">'+esc(q.q)+"</h3>"+(q.b?'<div class="mt">'+mean(q.b,q.h,q.e)+"</div>":"")+
    '<div class="mt">'+order.map(o=>'<button class="opt notranslate" data-act="q-opt" data-i="'+o.i+'">'+esc(o.t)+"</button>").join("")+"</div>"+
    '<div class="q-why mt" aria-live="polite"></div>';
}
function quizAnswer(btn){
  const host=btn.closest("[data-quiz]"),z=host._q,q=z.qs[z.i];
  if(z.answered)return;
  z.answered=true;
  const pick=Number(btn.dataset.i),right=pick===q.ans;
  if(right)z.score++;
  $$(".opt",host).forEach(b=>{
    b.disabled=true;
    if(Number(b.dataset.i)===q.ans)b.classList.add("right");
    else if(b===btn)b.classList.add("wrong");
  });
  const last=z.i===z.qs.length-1;
  $(".q-why",host).innerHTML=
    '<div class="note '+(right?"good":"bad")+'"><b>'+(right?"Correct.":"Not quite.")+"</b> "+esc(q.why||("The right answer is: "+q.opts[q.ans]))+"</div>"+
    '<button class="btn primary block mt" data-act="q-next">'+(last?"See result":"Next question")+"</button>";
  $("[data-act=q-next]",host).focus();
}
function quizNext(btn){
  const host=btn.closest("[data-quiz]"),z=host._q;
  z.i++;
  if(z.i<z.qs.length)renderQuiz(host);
  else z.onFinish(z.score,z.qs.length);
}

/* ===== AI TUTOR MODE ===== */
const VERB_S={go:"goes",do:"does",have:"has",work:"works",like:"likes",live:"lives",want:"wants",study:"studies",eat:"eats",come:"comes",play:"plays",know:"knows",need:"needs",make:"makes",take:"takes",watch:"watches",teach:"teaches",read:"reads",write:"writes",speak:"speaks",send:"sends"};
const BASE={went:"go",ate:"eat",saw:"see",came:"come",gave:"give",took:"take",bought:"buy",did:"do",made:"make",sent:"send",wrote:"write",told:"tell",got:"get",said:"say",knew:"know"};
const PP={went:"gone",ate:"eaten",came:"come",did:"done",saw:"seen",gave:"given",took:"taken",wrote:"written",spoke:"spoken",go:"gone",do:"done",see:"seen",give:"given",take:"taken",eat:"eaten",write:"written",speak:"spoken",send:"sent"};
const NOT_THIRD=["did","does","do","will","would","can","could","should","must","may","might","shall","let","make","makes","made","help","helps","helped","see","saw","hear","heard","watch"];
function keepCase(from,to){return /^[A-Z]/.test(from)?to.charAt(0).toUpperCase()+to.slice(1):to}
/* Each rule: [pattern, replacement (text or function), plain explanation] */
const RULES=[
[/\bi am (work|live|study|go|want|need|know|like|come|play)\b/gi,(m,a)=>"I "+a.toLowerCase(),"Do not put am before a simple verb. Say I work, or I am working."],
[/\bi am (agree|disagree)\b/gi,(m,a)=>"I "+a.toLowerCase(),"Agree is already a verb, so do not add am."],
[/\bi am (understanding|knowing|wanting|liking)\b/gi,(m,a)=>"I "+({understanding:"understand",knowing:"know",wanting:"want",liking:"like"})[a.toLowerCase()],"These verbs do not normally use the -ing form."],
[/\bi am having (a |an |one |two |three |four |\d+ )?(car|bike|phone|laptop|brother|sister|brothers|sisters|son|daughter|house)\b/gi,(m,a,b)=>"I have "+(a||"")+b,"For things you own and family, use have."],
[/\bi am working\b(.{0,40}?)\bsince\b/gi,(m,a)=>"I have been working"+a+"since","With since, use have been + -ing."],
[/\bsince (\d+|one|two|three|four|five|six|seven|eight|nine|ten) (years?|months?|weeks?|days?|hours?)\b/gi,(m,a,b)=>"for "+a+" "+b,"Use for with a length of time."],
[/\bdiscuss about\b/gi,m=>keepCase(m,"discuss"),"Discuss does not take about."],
[/\bmarried with\b/gi,m=>keepCase(m,"married to"),"We say married to."],
[/\b(did not|didn't)\s+(went|ate|saw|came|gave|took|bought|did|made|sent|wrote|told|got|said|knew)\b/gi,(m,a,b)=>a+" "+BASE[b.toLowerCase()],"After did not, use the base verb."],
[/\b(have|has|had)\s+(went|ate|came|did|saw|gave|took|wrote|spoke|go|do|see|give|take|eat|write|speak|send)\b/gi,(m,a,b)=>a+" "+PP[b.toLowerCase()],"After have, has or had, use the past participle."],
[/\b(he|she|it)\s+(don't|do not)\b/gi,(m,a,b)=>a+(b.toLowerCase()==="don't"?" doesn't":" does not"),"With he, she and it, use does not."],
[/\b(we|they|you)\s+was\b/gi,(m,a)=>a+" were","With we, they and you, use were."],
[/\bmore (better|easier|faster|bigger|smaller|cheaper)\b/gi,(m,a)=>a,"Do not use more with a word ending in -er."],
[/\btoday morning\b/gi,m=>keepCase(m,"this morning"),"We say this morning."],
[/\btoday evening\b/gi,m=>keepCase(m,"this evening"),"We say this evening."],
[/\byesterday night\b/gi,m=>keepCase(m,"last night"),"We say last night."],
[/\bcousin (brother|sister)\b/gi,m=>keepCase(m,"cousin"),"In English, just say cousin."],
[/\brevert back\b/gi,m=>keepCase(m,"reply"),"Reply is clearer. Revert means go back to an earlier state."],
[/\breturn back\b/gi,m=>keepCase(m,"return"),"Return already means go back."],
[/\brepeat again\b/gi,m=>keepCase(m,"repeat"),"Repeat already means say again."],
[/\bcope up\b/gi,m=>keepCase(m,"cope"),"We say cope with."],
[/\bdo the needful\b/gi,m=>keepCase(m,"please take the necessary action"),"Do the needful sounds old-fashioned. Say exactly what you need."],
[/\bout of station\b/gi,()=>"out of town","We say out of town."],
[/\bpassed out from\b/gi,m=>keepCase(m,"graduated from"),"Passed out means fainted. Say graduated from."],
[/\bmy good name\b/gi,m=>keepCase(m,"my name"),"Just say my name."],
[/\byour good name\b/gi,m=>keepCase(m,"your name"),"Just say your name."],
[/\b[Mm]yself (?=[A-Z])/g,()=>"I am ","To introduce yourself, say I am or My name is."],
[/\bone of my (friend|colleague|brother|sister|manager)\b/gi,(m,a)=>"one of my "+a+"s","After one of my, use a plural noun."],
[/\b(informations|furnitures|equipments|softwares|advices|luggages|sceneries)\b/gi,(m,a)=>a.slice(0,-1).replace(/ie$/,"y"),"This noun has no plural form."],
[/\breach(ed|es)? (to|at) (office|home|the office)\b/gi,(m,a,b,c)=>"reach"+(a||"")+" "+(c.toLowerCase()==="home"?"home":"the office"),"Reach does not take to or at."],
[/\bgo to home\b/gi,m=>keepCase(m,"go home"),"We say go home, without to."],
[/\ba (hour|hours|honest|MIS)\b/g,(m,a)=>"an "+a,"Use an before a vowel sound."],
[/\ba ([aeiou][a-z]*)\b/gi,(m,a)=>/^(one|once|uni|use|usu|uti|eu|ur)/i.test(a)?m:keepCase(m,"an")+" "+a,"Use an before a vowel sound."],
[/\b(he|she|it) (go|do|have|work|like|live|want|study|eat|come|play|know|need|make|take|watch|teach|read|write|speak|send)\b/gi,(m,a,b,off,str)=>{
  const before=str.slice(0,off).trim().split(/\s+/).pop().toLowerCase();
  return NOT_THIRD.indexOf(before)>=0?m:a+" "+VERB_S[b.toLowerCase()];
},"With he, she and it, add -s to the verb."]
];
function ruleCheck(text,typed){
  const fixes=[];let better=text;
  RULES.forEach(r=>{
    better=better.replace(r[0],function(){
      const m=arguments[0],out=typeof r[1]==="function"?r[1].apply(null,arguments):r[1];
      if(out!==m)fixes.push({bad:m,good:out,why:r[2]});
      return out;
    });
  });
  if(typed){
    if(/\bi\b/.test(better)){better=better.replace(/\bi\b/g,"I");fixes.push({bad:"i",good:"I",why:"The word I is always a capital letter."})}
    if(/^[a-z]/.test(better)){const c=better.charAt(0).toUpperCase()+better.slice(1);fixes.push({bad:better.slice(0,12),good:c.slice(0,12),why:"Start a sentence with a capital letter."});better=c}
    if(!/[.!?]\s*$/.test(better)){better=better.trim()+".";fixes.push({bad:"(no full stop)",good:".",why:"End a sentence with a full stop."})}
  }
  return{fixes,better,short:text.trim().split(/\s+/).length<4};
}
function tutorHTML(m){
  if(m.r==="coach")return '<div class="msg coach"><div class="who"><span>Tutor</span></div>'+enLine(m.t)+'<div class="mt">'+sayBtn(m.t,"Listen to question")+"</div></div>";
  if(m.r==="user")return '<div class="msg user"><div class="who"><span>You'+(m.spoken?" (spoken)":" (typed)")+'</span></div><span class="notranslate">'+esc(m.t)+"</span></div>";
  const fx=m.fixes||[];
  return '<div class="msg check"><div class="who"><span class="badge warn">Rule check, not AI</span></div>'+
    (fx.length?fx.map(f=>'<div class="fix"><span class="notranslate"><del>'+esc(f.bad)+"</del> → <ins>"+esc(f.good)+'</ins></span><div class="small muted">'+esc(f.why)+"</div></div>").join("")+'<div class="fix"><b>Suggested:</b> <span class="notranslate">'+esc(m.better)+"</span></div>":
      '<div class="small">The fixed rules found no common mistakes. This does not prove the answer is perfect.</div>')+
    (m.short?'<div class="fix small">Try a longer answer next time: a full sentence with a reason or example.</div>':"")+"</div>";
}
function claudeText(){
  const T=S.tutor,parts=[];
  T.msgs.forEach(m=>{if(m.r==="coach")parts.push("Tutor: "+m.t);if(m.r==="user")parts.push("Me: "+m.t)});
  return "You are my English speaking coach. I speak Bengali and Hindi and I work in an office as an MIS executive. Below is my English practice conversation.\n\nPlease:\n1. Correct each of my answers.\n2. Explain each mistake in simple English, and add the Bengali meaning where it helps.\n3. Show a more natural way to say each answer.\n4. Tell me the one thing I should practise next.\n\nConversation:\n"+parts.join("\n");
}
function pageTutor(){
  const T=S.tutor;
  const honest='<div class="note warn honest">'+ic("info")+"<div><b>Good to know:</b> questions and corrections here come from fixed rules, not from AI. They catch common mistakes only. For real AI feedback, copy your conversation to Claude using the buttons below.</div></div>";
  if(!T.topic){
    setView(head("AI Tutor Mode","Answer one question at a time, by speaking or typing.")+honest+

    '<div class="mt">'+barHTML((T.done?total:T.idx)/total*100)+'</div><div class="chat mt" id="chat" aria-live="polite">'+T.msgs.map(tutorHTML).join("")+"</div>"+
    (T.done?'<div class="note good mt">Conversation finished. Copy it to Claude for AI feedback, or start again.</div>':
    '<div class="mt"><label class="field" for="tutor-ans">Your answer</label><textarea class="input mt" id="tutor-ans" placeholder="Speak or type your answer" data-inp="tutor-typed"></textarea>'+
    '<div class="note warn mt hidden" id="mic-msg" role="alert"></div>'+
    '<div class="mic-row"><button class="mic-btn" data-act="dictate" data-into="#tutor-ans" data-idle="Speak answer"'+(SR?"":" disabled")+">"+ic("mic")+'<span>Speak answer</span></button><button class="btn primary" data-act="tutor-send">Send answer'+ic("next")+"</button><span data-micstate>"+micStateHTML()+"</span></div></div>")+
    "</div>"+
    '<div class="card"><h2>Get AI feedback from Claude</h2><p class="small muted">Step 1: copy your conversation. Step 2: open Claude. Step 3: paste it into the chat box and send. You need a Claude account, and a free one works.</p>'+
    '<div class="row mt"><button class="btn primary" data-act="tutor-copy"'+(T.msgs.some(m=>m.r==="user")?"":" disabled")+">"+ic("copy")+'Copy conversation</button><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">'+ic("ext")+"Open Claude</a>"+
    (T.done?'<button class="btn" data-act="tutor-again">Start again</button>':"")+"</div>"+
    '<details class="mt"><summary class="small">See the text that will be copied</summary><textarea class="input mt" readonly rows="8" id="tutor-export">'+esc(claudeText())+"</textarea></details></div>");
  const c=$("#chat");if(c&&c.lastElementChild&&T.msgs.length>1)c.lastElementChild.scrollIntoView({block:"nearest"});
}
function tutorAsk(){
  const T=S.tutor,q=TUTOR_TOPICS[T.topic].qs[T.idx];
  T.msgs.push({r:"coach",t:q});save();
}
function tutorSend(){
  const ta=$("#tutor-ans"),text=ta.value.trim();
  if(!text){toast("Please speak or type your answer first.");ta.focus();return}
  Mic.abort();
  const spoken=ta.dataset.mic==="1",T=S.tutor,res=ruleCheck(text,!spoken);
  T.msgs.push({r:"user",t:text,spoken});
  T.msgs.push({r:"check",fixes:res.fixes,better:res.better,short:res.short});
  logAct("tutor");
  T.idx++;
  if(T.idx<TUTOR_TOPICS[T.topic].qs.length)tutorAsk();else{T.done=true;save()}
  pageTutor();
  const last=T.msgs[T.msgs.length-1];
  if(!T.done&&S.settings.autoRead&&last.r==="coach")say(last.t);
  const box=$("#tutor-ans");if(box)box.scrollIntoView({block:"center"});
}

const LANGS=[["ar","Arabic"],["as","Assamese"],["bn","Bengali"],["bho","Bhojpuri"],["my","Burmese"],["zh-CN","Chinese (Simplified)"],["zh-TW","Chinese (Traditional)"],["doi","Dogri"],["nl","Dutch"],["en","English"],["tl","Filipino"],["fr","French"],["de","German"],["el","Greek"],["gu","Gujarati"],["iw","Hebrew"],["hi","Hindi"],["id","Indonesian"],["it","Italian"],["ja","Japanese"],["kn","Kannada"],["km","Khmer"],["gom","Konkani"],["ko","Korean"],["mai","Maithili"],["ms","Malay"],["ml","Malayalam"],["mr","Marathi"],["ne","Nepali"],["or","Odia"],["fa","Persian"],["pl","Polish"],["pt","Portuguese"],["pa","Punjabi"],["ru","Russian"],["sa","Sanskrit"],["sd","Sindhi"],["si","Sinhala"],["es","Spanish"],["sw","Swahili"],["ta","Tamil"],["te","Telugu"],["th","Thai"],["tr","Turkish"],["uk","Ukrainian"],["ur","Urdu"],["vi","Vietnamese"]];
function langOptions(sel,skip){return LANGS.filter(l=>skip.indexOf(l[0])<0).map(l=>'<option value="'+l[0]+'"'+(l[0]===sel?" selected":"")+">"+l[1]+"</option>").join("")}

   After that a small walker swaps English text for the saved text, so screens change instantly. */

function loadDict(l){
  try{const o=JSON.parse(readLS("pesc_dict_"+l)||"null");return o&&o.v===DICT_V?o.d:null}catch(e){return null}
}
function trText(k){
  if(DICT[k])return DICT[k];
  if(!/\d/.test(k))return null;
  const e=DICT["#"+k.replace(/\d+/g,"#")],now=k.match(/\d+/g);
  if(!e||e[1].length!==now.length)return null;
  let out=e[0],ok=true;
  const mark=i=>String.fromCharCode(0xE000+i);
  e[1].forEach((n,i)=>{
    const rx=new RegExp("(^|\\D)"+n+"(?!\\d)");
    if(rx.test(out))out=out.replace(rx,(m,a)=>a+mark(i));else ok=false;
  });
  if(!ok)return null;
  now.forEach((n,i)=>{out=out.replace(mark(i),n)});
  return out;
}
function trSkip(el){return !el||!!el.closest(".notranslate,script,style,textarea,#harvest")}
function trNode(n){
  const k=n.nodeValue.trim();
  if(!k||!/[A-Za-z]/.test(k)||trSkip(n.parentElement))return;
  const v=trText(k);
  if(v&&v!==k)n.nodeValue=n.nodeValue.replace(k,()=>v);
}
function trTree(root){
  if(root.nodeType===3){trNode(root);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n;while((n=w.nextNode()))trNode(n);
  $$("[placeholder]",root).forEach(e=>{const v=DICT[e.getAttribute("placeholder")];if(v)e.setAttribute("placeholder",v)});
}
function startDict(){
  trTree(document.body);
  if(DICT[document.title])document.title=DICT[document.title];
  new MutationObserver(ms=>ms.forEach(m=>{
    if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trTree);
  })).observe(document.body,{childList:true,subtree:true,characterData:true});
}
/* Every English text the app can show that is not marked notranslate */
function collectStrings(){
  const set=new Set(),add=t=>{t=String(t||"").trim();if(t&&/[A-Za-z]/.test(t))set.add(t)};
  EXTRA_UI.forEach(add);
  ["not-allowed","service-not-allowed","no-speech","audio-capture","network","language-not-supported","unsupported","start-failed","other"].forEach(c=>add(micErrorText(c)));
  const scan=()=>{
    const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
    let n;while((n=w.nextNode()))if(!trSkip(n.parentElement))add(n.nodeValue);
    $$("[placeholder]").forEach(e=>add(e.getAttribute("placeholder")));
  };
  const routes=[["dashboard"],["speaking"],["lessons"],["tutor"],["vocabulary"],["game"],["translate"],["grammar"],["interview"],["progress"]];
  Object.keys(OFFICE).forEach(k=>routes.push(["office",k]));
  Object.keys(GRAMMAR).forEach(k=>routes.push(["grammar",k]));
  INTERVIEW.forEach(q=>routes.push(["interview",q.id]));
  routes.forEach(r=>{try{PAGES[r[0]](r[1]);scan()}catch(e){}});
  try{lessonDetail(ALL_LESSONS[0]);scan();lessonStep(1);scan();LessonRun=null}catch(e){}
  ALL_LESSONS.forEach(l=>{add(l.t);add(l.goal);l.lines.forEach(x=>add(x[1]))});
  Object.values(OFFICE).forEach(o=>{add(o.t);add(o.d);o.phrases.forEach(x=>add(x[0]))});
  EMAILS.forEach(m=>{add(m.t);add(m.s);add(m.b)});
  WORDS.forEach(w=>{add(w.e);add(w.x)});
  Object.values(GRAMMAR).forEach(g=>{add(g.t);add(g.d);g.sections.forEach(x=>{add(x.h);add(x.en);(x.ex||[]).forEach(add)});g.quiz.forEach(x=>add(x[3]))});
  INTERVIEW.forEach(q=>{add(q.q);add(q.a);add(q.tip)});
  Object.values(TUTOR_TOPICS).forEach(t=>{add(t.t);t.qs.forEach(add)});
  RULES.forEach(r=>add(r[2]));
  return Array.from(set);
}
function plainDigits(t){
  return t.replace(/[०-९]/g,c=>c.charCodeAt(0)-0x966).replace(/[০-৯]/g,c=>c.charCodeAt(0)-0x9E6)
    .replace(/[٠-٩]/g,c=>c.charCodeAt(0)-0x660).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-0x6F0);
}
function harvestPanel(html){$("#hv-box").innerHTML=html}
/* Google's translator stops after about 200 pieces per page load, so the text is prepared in
   batches over several quick reloads. Progress is saved after each batch. */
function runHarvest(l){
  const key="pesc_part_"+l;
  let part;
  try{part=JSON.parse(readLS(key)||"null")}catch(e){part=null}
  if(!part||part.v!==DICT_V)part={v:DICT_V,d:{},zero:0};
  const box=document.createElement("div");
  box.id="harvest";
  box.innerHTML='<div class="card notranslate" id="hv-box"></div>';
  document.body.appendChild(box);
  const all=collectStrings(),left=all.filter(t=>!(t in part.d)),total=all.length;
  const shown=n=>{
    harvestPanel('<h1>Preparing your language</h1><p class="mt">This happens only the first time, and takes one to two minutes. Please keep this page open on your screen.</p><div class="mt">'+barHTML(n/total*100)+'</div><p class="small muted mt">'+Math.round(n/total*100)+"%</p>");
  };
  const fail=()=>{
    setGtCookie("");
    harvestPanel('<h1>Could not prepare this language</h1><p class="mt">Please check your internet connection, keep this page on your screen, and try again. Your progress is saved.</p><div class="row mt"><button class="btn primary" data-act="hv-retry">Try again</button><button class="btn" data-act="hv-english">Back to English</button></div>');
  };
  const complete=()=>{
    const d={};
    Object.keys(part.d).forEach(en=>{
      const v=plainDigits(part.d[en]),nums=en.match(/\d+/g);
      if(nums&&new Set(nums).size===nums.length)d["#"+en.replace(/\d+/g,"#")]=[v,nums];
      d[en]=v;
    });
    Object.keys(localStorage).filter(k=>k.indexOf("pesc_dict_")===0).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
    const ok=writeLS("pesc_dict_"+l,JSON.stringify({v:DICT_V,d}));
    try{localStorage.removeItem(key)}catch(e){}
    if(!ok){fail();return}
    setGtCookie("");
    location.reload();
  };
  shown(total-left.length);
  if(!left.length){complete();return}
  const batch=left.slice(0,150);
  $("#view").innerHTML='<div id="hv-list"></div>';
  const list=$("#hv-list");
  batch.forEach(t=>{const p=document.createElement("p");p.textContent=t;list.appendChild(p)});
  setGtCookie(l);
  window.gtInit=()=>{new google.translate.TranslateElement({pageLanguage:"en",autoDisplay:false},"gt-box")};
  const js=document.createElement("script");
  js.src="https://translate.google.com/translate_a/element.js?cb=gtInit";
  document.head.appendChild(js);
  const ps=$$("p",list);
  let last=0,lastAt=Date.now();
  const tick=setInterval(()=>{
    const done=ps.filter(p=>p.querySelector("font")).length;
    if(done!==last){last=done;lastAt=Date.now()}
    shown(total-left.length+done);
    const idle=Date.now()-lastAt;
    if(done<batch.length&&idle<(done?2500:15000))return;
    clearInterval(tick);
    ps.forEach((p,i)=>{if(p.querySelector("font"))part.d[batch[i]]=p.innerText.trim()});
    part.zero=done?0:part.zero+1;
    /* Nothing new twice: stop, and keep what is ready if it is nearly everything */
    if(part.zero>=2){
      if(Object.keys(part.d).length>=total*.9)complete();else{part.zero=0;writeLS(key,JSON.stringify(part));fail()}
      return;
    }
    if(!writeLS(key,JSON.stringify(part))){fail();return}
    location.reload();
  },300);
}
/* Returns true when the normal page should not be drawn yet */
function startLanguage(){
  const l=S.settings.lang;
  setGtCookie("");
  if(!l)return false;
  document.body.classList.add(l==="bn"||l==="hi"?"lang-"+l:"lang-other");
  DICT=loadDict(l);
  if(DICT){startDict();return false}
  runHarvest(l);
  return true;
}

function gameStart(mode,words,lvl){
  G.mode=mode;G.words=words;G.lvl=lvl||0;G.i=0;G.score=0;G.stage="learn";renderGame();
}
function gameDaily(){
  const today=new Date().toDateString(),dl=S.game.daily;
  if(dl.date!==today||!dl.words.length){
    S.game.daily={date:today,words:shuffle(WORDS).slice(0,5).map(w=>w.e)};save();
  }
  gameStart("daily",S.game.daily.words.map(e=>WORDS.find(w=>w.e===e)).filter(Boolean));
}
function gameFinish(){
  S.game.attempts++;
  S.game.best=Math.max(S.game.best,G.score);
  const total=G.words.length*2;let title="Score "+G.score+" of "+total;
  if(G.mode==="level"){
    if(G.score>=8&&G.lvl===S.game.level){S.game.level++;title="Passed! Next level unlocked."}
    else if(G.score>=8)title="Passed!";
    else title="Not passed yet. You need 8 points.";
  }else title="Daily practice finished";
  logAct("game");logScore("vocabulary",Math.round(G.score/total*100));save();
  G.result={title};G.stage="result";renderGame();
}

/* ===== TRANSLATE =====
   Google Translate cannot run inside another page, so the text opens in Google Translate in a new tab. */
const TR={text:"",from:"en",to:"bn"};
function translateURL(){return gtURL(TR.from,TR.to,TR.text)}
function trMatches(){
  const t=TR.text.trim(),q=t.toLowerCase(),clean=s=>s.toLowerCase().replace(/[.,!?।]/g,"").trim();
  if(!q)return[];
  const out=[];
  WORDS.forEach(w=>{if(w.e===q||w.b===t||w.h===t||w.h.split(" / ").indexOf(t)>=0)out.push({e:w.e,b:w.b,h:w.h})});
  const sets=speakSets();
  Object.values(sets).forEach(list=>list.forEach(x=>{
    if((clean(x.e)===clean(t)||clean(x.b)===clean(t)||clean(x.h)===clean(t))&&!out.some(o=>o.e===x.e))out.push(x);
  }));
  return out.slice(0,4);
}
function trRefresh(){
  const a=$("#tr-go"),box=$("#tr-local");if(!a||!box)return;
  a.href=translateURL();
  const m=trMatches();
  box.innerHTML=m.length?'<h3>Found in this app</h3>'+m.map(x=>'<div class="phrase"><div class="grow"><div class="en notranslate">'+esc(x.e)+"</div>"+mean(x.b,x.h,x.e)+"</div>"+sayBtn(x.e,"Listen")+"</div>").join(""):"";
  box.classList.toggle("hidden",!m.length);
}

function grammarQuiz(k){
  const g=GRAMMAR[k],host=$("#grammar-quiz");
  mountQuiz(host,shuffle(g.quiz).map(x=>({q:x[0],opts:x[1],ans:x[2],why:x[3],nt:true})),(score,total)=>{
    const p=Math.round(score/total*100),r=S.grammar[k]||{best:0,attempts:0};
    r.best=Math.max(r.best,p);r.last=p;r.attempts++;S.grammar[k]=r;
    logAct("grammar");logScore("grammar",p);

}

const FILLERS=/\b(um+|uh+|actually|basically|you know)\b/gi;
function ivCount(){
  const ta=$("#iv-ans"),el=$("#iv-count");if(!ta||!el)return;
  const t=ta.value.trim(),n=t?t.split(/\s+/).length:0,f=(t.match(FILLERS)||[]).length;
  el.textContent=n?n+" words, about "+Math.max(1,Math.round(n/130*60))+" seconds to speak. Filler words: "+f+".":"";
}

  },

    G.mcqRight=right;if(right)G.score++;
    $$("#game .opt").forEach(o=>{o.disabled=true;if(o.dataset.v===G.answer)o.classList.add("right");else if(o===b)o.classList.add("wrong")});
