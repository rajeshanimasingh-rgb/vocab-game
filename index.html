LESSONS.Office=[
{id:"o1",t:"Daily stand-up meeting",goal:"Say what you did yesterday, what you will do today, and what is blocking you.",lines:[
["Team lead","Good morning. Let's go round the team. What did you finish yesterday?","সুপ্রভাত। একে একে সবাই বলুন। গতকাল কী শেষ করেছেন?","सुप्रभात। सब बारी-बारी से बताइए। कल आपने क्या पूरा किया?"],
["You","I have finished the footfall report and shared it with the regional managers.","আমি ফুটফল রিপোর্ট শেষ করে রিজিওনাল ম্যানেজারদের পাঠিয়েছি।","मैंने फुटफॉल रिपोर्ट पूरी करके रीजनल मैनेजरों को भेज दी है।"],
["Team lead","Good. What is your plan for today?","ভালো। আজ আপনার পরিকল্পনা কী?","अच्छा। आज आपकी क्या योजना है?"],
["You","Today I will update the incentive file and check the data for duplicates.","আজ আমি ইনসেন্টিভ ফাইল আপডেট করব এবং ডুপ্লিকেট ডেটা দেখব।","आज मैं इंसेंटिव फ़ाइल अपडेट करूँगा और डुप्लिकेट डेटा जाँचूँगा।"],
["Team lead","Is anything blocking you?","কিছু কি আটকে রেখেছে?","क्या कोई रुकावट है?"],
["You","Yes, the Pune data is still pending. I will follow up with them before lunch.","হ্যাঁ, পুনের ডেটা এখনও বাকি। দুপুরের আগে আমি তাদের সাথে যোগাযোগ করব।","हाँ, पुणे का डेटा अभी बाकी है। मैं दोपहर से पहले उनसे फ़ॉलो-अप करूँगा।"]],
vocab:[["stand-up","a short daily team meeting, often done standing","দাঁড়িয়ে ছোট দৈনিক মিটিং","रोज़ की छोटी खड़ी मीटिंग"],["blocking","stopping your work from moving forward","কাজ আটকে রাখা","काम रोकना"],["pending","not yet done or received","বাকি","बाकी / लंबित"],["follow up","contact someone again about something","আবার খোঁজ নেওয়া","फिर से संपर्क करना"],["share","send something so others can see it","পাঠানো / ভাগ করা","भेजना / साझा करना"]],
grammar:{h:"Present perfect for finished work, will for today's plan",en:"Use have or has + past participle for work you finished recently: I have finished the report. Use will + verb for what you plan to do today: I will update the file.",bn:"সম্প্রতি শেষ করা কাজের জন্য have/has + past participle: I have finished the report। আজকের পরিকল্পনার জন্য will + verb: I will update the file।",hi:"हाल ही में पूरे किए काम के लिए have/has + past participle: I have finished the report। आज की योजना के लिए will + verb: I will update the file।",ex:["I have sent the dashboard to everyone.","She has checked the totals.","I will call the warehouse after the meeting."]},
quiz:[["Choose the correct update: \"I ___ the report already.\"",["have shared","shared have","am share","will shared"],0,"Use have + past participle for finished work: I have shared the report."],["Which sentence is a plan for today?",["I will check the data after lunch.","I checked the data.","I have check the data.","I checking the data."],0,"Use will + base verb for a plan."]]},

{id:"o2",t:"Sales review meeting",goal:"Compare results with the target and explain the gap.",lines:[
["Regional manager","How did the East region do last week?","গত সপ্তাহে ইস্ট রিজিওন কেমন করেছে?","पिछले हफ़्ते ईस्ट रीजन का प्रदर्शन कैसा रहा?"],
["You","Sales were 8 percent higher than the week before, but still lower than the target.","বিক্রি আগের সপ্তাহের চেয়ে ৮ শতাংশ বেশি, কিন্তু এখনও টার্গেটের চেয়ে কম।","बिक्री पिछले हफ़्ते से 8 प्रतिशत ज़्यादा रही, लेकिन टारगेट से अभी भी कम है।"],
["Regional manager","Which studio has the biggest shortfall?","কোন স্টুডিওর ঘাটতি সবচেয়ে বেশি?","किस स्टूडियो की कमी सबसे ज़्यादा है?"],
["You","Salt Lake has the biggest shortfall. Its conversion is the lowest in the region.","সল্টলেকের ঘাটতি সবচেয়ে বেশি। এর কনভার্শন রিজিওনে সবচেয়ে কম।","साल्ट लेक की कमी सबसे ज़्यादा है। इसका कन्वर्ज़न रीजन में सबसे कम है।"],
["Regional manager","What is the required run rate now?","এখন প্রয়োজনীয় রান রেট কত?","अब ज़रूरी रन रेट कितना है?"],
["You","We need 6 lakh a day for the rest of the month, which is higher than our current 5 lakh.","বাকি মাসে দিনে ৬ লাখ দরকার, যা এখনকার ৫ লাখের চেয়ে বেশি।","बाकी महीने में रोज़ 6 लाख चाहिए, जो अभी के 5 लाख से ज़्यादा है।"]],
vocab:[["shortfall","the amount by which you are below the target","ঘাটতি","कमी"],["run rate","average sales per day","দৈনিক গড় বিক্রি","रोज़ की औसत बिक्री"],["conversion","the share of visitors who buy","রূপান্তর হার","रूपांतरण दर"],["region","a group of cities or studios","অঞ্চল","क्षेत्र"],["gap","the difference between target and actual","ফারাক","अंतर"]],
grammar:{h:"Comparing numbers: higher than, lower than, the highest",en:"To compare two things, use an adjective + er + than (higher than, lower than) or more + adjective + than (more expensive than). To compare one thing with all the others, use the + est (the highest, the lowest).",bn:"দুটি জিনিস তুলনায় adjective + er + than (higher than) বা more + adjective + than। সবার মধ্যে সর্বোচ্চ বোঝাতে the + est (the highest)।",hi:"दो चीज़ों की तुलना में adjective + er + than (higher than) या more + adjective + than। सबमें सबसे ज़्यादा बताने के लिए the + est (the highest)।",ex:["Sales were higher than last week.","Kolkata has the highest footfall in the East.","This month is more difficult than last month."]},
quiz:[["Choose the correct sentence.",["Sales are lower than the target.","Sales are more lower than the target.","Sales are lowest than the target.","Sales are low than the target."],0,"Use lower than. Do not add more before a word ending in -er."],["Pune has ___ conversion in the region.",["the best","better","the better","best than"],0,"Use the + superlative to compare with all the others: the best."]]},

{id:"o3",t:"Customer complaint handling",goal:"Apologise, find the facts, and promise a clear next step.",lines:[
["Customer","My dining table arrived with a broken leg. This is not acceptable!","আমার ডাইনিং টেবিলের একটা পা ভাঙা অবস্থায় এসেছে। এটা মেনে নেওয়া যায় না!","मेरी डाइनिंग टेबल का एक पैर टूटा हुआ आया है। यह मंज़ूर नहीं है!"],
["You","I am really sorry about this. I understand how disappointing it is.","এর জন্য আমি সত্যিই দুঃখিত। বুঝতে পারছি এটা কতটা হতাশাজনক।","इसके लिए मुझे सच में खेद है। मैं समझता हूँ कि यह कितना निराशाजनक है।"],
["You","Could you please share your order number and a photo of the damage?","দয়া করে আপনার অর্ডার নম্বর আর ক্ষতির একটা ছবি দেবেন?","कृपया अपना ऑर्डर नंबर और नुकसान की एक फ़ोटो भेजेंगे?"],
["Customer","Yes, I have sent them on WhatsApp just now.","হ্যাঁ, এইমাত্র হোয়াটসঅ্যাপে পাঠিয়েছি।","हाँ, मैंने अभी व्हाट्सऐप पर भेज दिए हैं।"],
["You","Thank you. I will arrange a replacement, and our team will pick up the damaged table.","ধন্যবাদ। আমি বদলে দেওয়ার ব্যবস্থা করব, আর আমাদের টিম ভাঙা টেবিলটা নিয়ে যাবে।","धन्यवाद। मैं बदलने की व्यवस्था करूँगा, और हमारी टीम टूटी टेबल ले जाएगी।"],
["You","I will call you tomorrow by 11 a.m. to confirm the delivery date.","ডেলিভারির তারিখ নিশ্চিত করতে আমি কাল সকাল ১১টার মধ্যে আপনাকে ফোন করব।","डिलीवरी की तारीख पक्की करने के लिए मैं कल सुबह 11 बजे तक आपको फ़ोन करूँगा।"]],
vocab:[["replacement","a new item given instead of a damaged one","বদলে দেওয়া জিনিস","बदले में दी गई चीज़"],["damage","harm that breaks or spoils something","ক্ষতি","नुकसान"],["arrange","plan and organise something","ব্যবস্থা করা","व्यवस्था करना"],["acceptable","good enough to agree to","গ্রহণযোগ্য","स्वीकार्य"],["confirm","say that something is definite","নিশ্চিত করা","पक्का करना"]],
grammar:{h:"Polite apologies and promises",en:"Apologise with I am sorry about + noun, or I am sorry for + verb-ing. Ask politely with Could you please + verb. Promise action with I will + verb, and add a time.",bn:"ক্ষমা চাইতে I am sorry about + noun বা I am sorry for + verb-ing। ভদ্রভাবে অনুরোধ: Could you please + verb। কাজের প্রতিশ্রুতি: I will + verb, সাথে সময়।",hi:"माफ़ी के लिए I am sorry about + noun या I am sorry for + verb-ing। विनम्र अनुरोध: Could you please + verb। वादा: I will + verb, साथ में समय।",ex:["I am sorry for the delay.","Could you please share the invoice number?","I will update you by this evening."]},
quiz:[["Choose the most polite request.",["Could you please send a photo?","Send photo.","You must send photo now.","Give me photo."],0,"Could you please + verb is polite."],["Choose the correct apology.",["I am sorry for keeping you waiting.","I am sorry for keep you waiting.","I sorry for waiting.","I am sorry to kept you waiting."],0,"After sorry for, use the -ing form: keeping."]]},

{id:"o4",t:"Salary discussion",goal:"Ask for a salary review politely, with facts.",lines:[
["You","Thank you for your time. I would like to discuss my salary review.","সময় দেওয়ার জন্য ধন্যবাদ। আমি আমার বেতন পর্যালোচনা নিয়ে কথা বলতে চাই।","समय देने के लिए धन्यवाद। मैं अपने वेतन की समीक्षा पर बात करना चाहता हूँ।"],
["Manager","Of course. What would you like to share?","অবশ্যই। কী বলতে চান?","ज़रूर। आप क्या बताना चाहेंगे?"],
["You","This year I automated four reports, and the team now saves about ten hours a week.","এই বছর আমি চারটি রিপোর্ট অটোমেট করেছি, এখন টিমের সপ্তাহে প্রায় দশ ঘণ্টা বাঁচে।","इस साल मैंने चार रिपोर्ट ऑटोमेट कीं, अब टीम के हफ़्ते में लगभग दस घंटे बचते हैं।"],
["You","I have also taken extra responsibility for the incentive calculations.","আমি ইনসেন্টিভ হিসাবের অতিরিক্ত দায়িত্বও নিয়েছি।","मैंने इंसेंटिव गणना की अतिरिक्त ज़िम्मेदारी भी ली है।"],
["Manager","That is useful work. What are you expecting?","কাজটা খুবই কাজের। আপনি কী আশা করছেন?","यह उपयोगी काम है। आप क्या उम्मीद कर रहे हैं?"],
["You","I would request an increase of 15 percent, but I am open to discussing it.","আমি ১৫ শতাংশ বৃদ্ধির অনুরোধ করব, তবে আলোচনা করতে আমি প্রস্তুত।","मैं 15 प्रतिशत बढ़ोतरी का अनुरोध करूँगा, लेकिन मैं इस पर बात करने को तैयार हूँ।"]],
vocab:[["review","a formal check, here of your salary","পর্যালোচনা","समीक्षा"],["responsibility","a duty that you are in charge of","দায়িত্ব","ज़िम्मेदारी"],["increase","a rise in amount","বৃদ্ধি","बढ़ोतरी"],["expect","think something will happen or hope to get it","আশা করা","उम्मीद करना"],["open to","willing to consider","আলোচনায় রাজি","विचार करने को तैयार"]],
grammar:{h:"Polite forms: would like to, would, could",en:"Would like to + verb is more polite than want to. Use I would request or I would suggest to make a request softer. Could I + verb asks for permission politely.",bn:"want to-এর চেয়ে would like to + verb বেশি ভদ্র। অনুরোধ নরম করতে I would request বা I would suggest। অনুমতি চাইতে Could I + verb।",hi:"want to से ज़्यादा विनम्र है would like to + verb। अनुरोध नरम करने के लिए I would request या I would suggest। अनुमति के लिए Could I + verb।",ex:["I would like to talk about my role.","Could I have ten minutes with you today?","I would suggest a review in three months."]},
quiz:[["Which is the most polite?",["I would like to discuss my salary.","I want salary talk.","Give me more salary.","Salary increase now."],0,"Would like to is polite and professional."],["Choose the correct sentence.",["Could I speak to you for a minute?","Could I speaking to you for a minute?","Could I to speak to you?","I could speak you a minute?"],0,"Could I + base verb: Could I speak."]]},

{id:"o5",t:"Talking to senior management",goal:"Give a short, clear update to a senior leader.",lines:[
["Director","I have five minutes. What do I need to know?","আমার হাতে পাঁচ মিনিট আছে। আমার কী জানা দরকার?","मेरे पास पाँच मिनट हैं। मुझे क्या जानना चाहिए?"],
["You","Three points. First, month-to-date sales are at 64 percent of target.","তিনটি বিষয়। প্রথমত, মাসের এখন পর্যন্ত বিক্রি টার্গেটের ৬৪ শতাংশ।","तीन बातें। पहली, महीने की अब तक की बिक्री टारगेट का 64 प्रतिशत है।"],
["You","Second, the new display was installed in all studios last week.","দ্বিতীয়ত, গত সপ্তাহে সব স্টুডিওতে নতুন ডিসপ্লে বসানো হয়েছে।","दूसरी, पिछले हफ़्ते सभी स्टूडियो में नया डिस्प्ले लगाया गया।"],
["You","Third, we need your approval to extend the festive offer by one week.","তৃতীয়ত, উৎসবের অফার এক সপ্তাহ বাড়াতে আপনার অনুমোদন দরকার।","तीसरी, त्योहार का ऑफ़र एक हफ़्ता बढ़ाने के लिए आपकी मंज़ूरी चाहिए।"],
["Director","What will it cost us?","এতে আমাদের কত খরচ হবে?","इसमें हमारा कितना खर्च होगा?"],
["You","About 3 lakh in discounts, and we expect 20 lakh in extra sales.","ছাড়ে প্রায় ৩ লাখ, আর আমরা ২০ লাখ অতিরিক্ত বিক্রি আশা করছি।","छूट में लगभग 3 लाख, और हमें 20 लाख की अतिरिक्त बिक्री की उम्मीद है।"]],
vocab:[["month-to-date","from the first day of the month until today","মাসের শুরু থেকে আজ পর্যন্ত","महीने की शुरुआत से आज तक"],["approval","official permission","অনুমোদন","मंज़ूरी"],["extend","make something last longer","বাড়ানো","बढ़ाना"],["install","put equipment in place, ready to use","স্থাপন করা","लगाना"],["festive","related to festivals","উৎসবের","त्योहारी"]],
grammar:{h:"Passive voice for results and actions",en:"Use the passive when the action matters more than the person: subject + was or were + past participle. The display was installed. The reports were shared. It sounds formal and is common in reports to senior managers.",bn:"কে করেছে তার চেয়ে কাজটি গুরুত্বপূর্ণ হলে passive: subject + was/were + past participle। The display was installed। সিনিয়রদের রিপোর্টে এটি বেশি ব্যবহার হয়।",hi:"जब काम करने वाले से ज़्यादा काम महत्वपूर्ण हो तो passive: subject + was/were + past participle। The display was installed। वरिष्ठों को रिपोर्ट में यह आम है।",ex:["The report was sent at 10 a.m.","All studios were visited last month.","The offer was approved by the business head."]},
quiz:[["Choose the correct passive sentence.",["The data was checked yesterday.","The data checked was yesterday.","The data were check yesterday.","The data is checked yesterday."],0,"was + past participle: was checked."],["Choose the best opening for a senior leader.",["Three points. First, sales are at 64 percent of target.","So, actually, basically, I wanted to say many things.","Sir, everything is fine, no issues.","I will tell you later."],0,"Be short and structured: give the number of points, then the facts."]]},

{id:"o6",t:"Explaining business performance",goal:"Explain why results changed, using reasons and results.",lines:[
["Manager","Why did Home Decor grow so fast this month?","এই মাসে হোম ডেকর এত দ্রুত বাড়ল কেন?","इस महीने होम डेकोर इतनी तेज़ी से क्यों बढ़ा?"],
["You","It grew because we placed decor items near the billing counter.","বিলিং কাউন্টারের কাছে ডেকরের জিনিস রাখায় এটা বেড়েছে।","बिलिंग काउंटर के पास डेकोर का सामान रखने की वजह से यह बढ़ा।"],
["You","As a result, the average basket size went up by 11 percent.","এর ফলে গড় বাস্কেট সাইজ ১১ শতাংশ বেড়েছে।","इसके परिणामस्वरूप औसत बास्केट साइज़ 11 प्रतिशत बढ़ा।"],
["Manager","And why did furniture sales fall?","আর ফার্নিচারের বিক্রি কমল কেন?","और फ़र्नीचर की बिक्री क्यों घटी?"],
["You","Furniture fell due to delivery delays in the North.","উত্তরে ডেলিভারি দেরির কারণে ফার্নিচার কমেছে।","उत्तर में डिलीवरी में देरी के कारण फ़र्नीचर घटा।"],
["You","However, the delays are now solved, so we expect a recovery next month.","তবে দেরির সমস্যা এখন মিটে গেছে, তাই আগামী মাসে পুনরুদ্ধার আশা করছি।","हालाँकि देरी अब ठीक हो गई है, इसलिए अगले महीने सुधार की उम्मीद है।"]],
vocab:[["average","the usual amount, found by dividing the total","গড়","औसत"],["recovery","a return to a normal level","পুনরুদ্ধার","सुधार / वापसी"],["counter","the place where customers pay","কাউন্টার","काउंटर"],["fall","go down","কমা","घटना"],["grow","go up or get bigger","বাড়া","बढ़ना"]],
grammar:{h:"Giving reasons and results: because, due to, as a result, so",en:"Because is followed by a full sentence: because delivery was late. Due to is followed by a noun: due to delivery delays. Use as a result or so to show what happened next.",bn:"because-এর পরে পুরো বাক্য: because delivery was late। due to-এর পরে noun: due to delivery delays। ফলাফল বোঝাতে as a result বা so।",hi:"because के बाद पूरा वाक्य: because delivery was late। due to के बाद noun: due to delivery delays। परिणाम बताने के लिए as a result या so।",ex:["Sales rose because footfall increased.","Sales fell due to the heavy rain.","Footfall rose, so conversion became more important."]},
quiz:[["Choose the correct sentence.",["Sales fell due to the delivery delays.","Sales fell due to delivery was late.","Sales fell because of delivery was late.","Sales fell due delivery delays."],0,"Due to + noun: due to the delivery delays."],["Footfall increased. ___, sales went up.",["As a result","Because","Due to","Although"],0,"As a result shows what happened next."]]},

{id:"o7",t:"Giving a daily MIS update",goal:"Give today's key numbers clearly and say what you are working on.",lines:[
["Manager","Can you give me today's update?","আজকের আপডেট দিতে পারবেন?","आज का अपडेट दे सकते हैं?"],
["You","Sure. Yesterday's GMV was 42 lakh, and NSV was 35 lakh.","অবশ্যই। গতকালের GMV ছিল ৪২ লাখ, আর NSV ছিল ৩৫ লাখ।","ज़रूर। कल का GMV 42 लाख था, और NSV 35 लाख था।"],

{id:"o8",t:"Asking for pending data",goal:"Follow up politely and give a clear deadline.",lines:[
["You","Hi Ravi, I hope you are doing well.","হাই রবি, আশা করি ভালো আছেন।","हाय रवि, आशा है आप ठीक हैं।"],
["You","I am following up on the stock data for the Pune studio. It is still pending.","পুনে স্টুডিওর স্টক ডেটা নিয়ে আবার খোঁজ নিচ্ছি। এটা এখনও বাকি।","पुणे स्टूडियो के स्टॉक डेटा के बारे में फ़ॉलो-अप कर रहा हूँ। यह अभी बाकी है।"],
["Ravi","Sorry, I was busy with the audit. When do you need it?","দুঃখিত, অডিট নিয়ে ব্যস্ত ছিলাম। কখন লাগবে?","माफ़ कीजिए, मैं ऑडिट में व्यस्त था। आपको कब चाहिए?"],
["You","Could you please send it by 2 p.m. today? The report goes to management at 4.","দয়া করে আজ দুপুর ২টার মধ্যে পাঠাতে পারবেন? রিপোর্ট ৪টায় ম্যানেজমেন্টের কাছে যাবে।","क्या आप कृपया आज दोपहर 2 बजे तक भेज सकते हैं? रिपोर्ट 4 बजे मैनेजमेंट को जाती है।"],
["Ravi","Yes, I will send it by 1:30.","হ্যাঁ, দেড়টার মধ্যে পাঠিয়ে দেব।","हाँ, मैं डेढ़ बजे तक भेज दूँगा।"],
["You","Thank you so much. Please let me know if anything is unclear.","অনেক ধন্যবাদ। কিছু অস্পষ্ট হলে আমাকে জানাবেন।","बहुत धन्यवाद। कुछ स्पष्ट न हो तो मुझे बताइए।"]],

grammar:{h:"Polite follow-ups and deadlines with by",en:"Start softly: I am following up on + noun. Ask with Could you please + verb. Give a deadline with by + time: by 2 p.m. means no later than 2 p.m. Avoid kindly revert and do the needful; say exactly what you need.",bn:"নরমভাবে শুরু: I am following up on + noun। অনুরোধ: Could you please + verb। সময়সীমা: by + time, by 2 p.m. মানে ২টার পরে নয়। kindly revert বা do the needful না বলে ঠিক কী দরকার বলুন।",hi:"नरमी से शुरू करें: I am following up on + noun। अनुरोध: Could you please + verb। समय-सीमा: by + time, by 2 p.m. यानी 2 बजे के बाद नहीं। kindly revert या do the needful के बजाय साफ़ बताइए क्या चाहिए।",ex:["I am following up on yesterday's sales file.","Could you please share it by Friday?","Please send the corrected numbers by noon."]},

/* ===== STORAGE ===== */
const KEY="pesc_v1";
let storageOK=true;
function readLS(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;return null}}
function writeLS(k,v){try{localStorage.setItem(k,v);return true}catch(e){storageOK=false;return false}}
function defaults(){return{
  settings:{name:"Rajesh",target:15,level:"Beginner",accent:"en-IN",rate:1,autoRead:true,lang:""},
  history:{},lessons:{},learned:{},fav:{},grammar:{},interview:{},
  game:{level:1,best:0,attempts:0,daily:{date:"",words:[]}},
  tutor:{topic:null,idx:0,msgs:[],done:false},
  speakPos:{},migrated:false
}}
/* Fills in any missing parts, so older saved progress always opens */
function normalize(st){
  if(!st||typeof st!=="object")st={};
  const out=Object.assign(defaults(),st);
  out.settings=Object.assign(defaults().settings,st.settings);
  out.game=Object.assign(defaults().game,st.game);
  out.tutor=Object.assign(defaults().tutor,st.tutor);
  return out;
}
function load(){
  let raw=readLS(KEY),st=null;
  if(raw){try{st=JSON.parse(raw)}catch(e){writeLS(KEY+"_broken",raw)}}
  const out=normalize(st);
  if(!out.migrated){
    /* bring over scores saved by the old English Vocabulary Game */
    const lv=Number(readLS("level")),be=Number(readLS("best")),at=Number(readLS("attempts"));
    if(lv>1)out.game.level=lv;
    if(be>0)out.game.best=be;
    if(at>0)out.game.attempts=at;
    out.migrated=true;
  }
  return out;
}
let S=load();
function save(){writeLS(KEY,JSON.stringify(S))}
/* When the app is open in two tabs (or as the installed app and a browser tab), take the other tab's
   newer progress instead of overwriting it. This tab saves after every action, so nothing is lost. */
window.addEventListener("storage",e=>{
  if(e.key!==KEY||!e.newValue)return;
  try{
    const o=normalize(JSON.parse(e.newValue)),k=todayKey(),mine=S.history[k];
    if(mine&&o.history[k]&&mine.sec>o.history[k].sec)o.history[k].sec=mine.sec;
    o.settings.lang=S.settings.lang;
    S=o;
  }catch(err){}
});

/* ===== DATES AND PROGRESS LOGGING ===== */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayKey(){return ymd(new Date())}
function daysAgo(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return ymd(d)}
function niceDate(k){const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-IN",{day:"numeric",month:"short",weekday:"short"})}
function day(k){
  k=k||todayKey();
  if(!S.history[k])S.history[k]={sec:0,act:{},scores:{}};
  return S.history[k];
}
function logAct(kind,n){const d=day();d.act[kind]=(d.act[kind]||0)+(n||1);save()}
function logScore(area,p){const d=day(),c=d.scores[area]||(d.scores[area]={n:0,sum:0});c.n++;c.sum+=p;save()}
function isActive(k){
  const d=S.history[k];if(!d)return false;
  return d.sec>=60||Object.values(d.act).some(v=>v>0);
}
function streak(){
  let i=isActive(daysAgo(0))?0:1,c=0;
  while(isActive(daysAgo(i))){c++;i++}
  return c;
}
function bestStreak(){
  const keys=Object.keys(S.history).filter(isActive).sort();
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    const p=k.split("-"),t=Date.UTC(+p[0],+p[1]-1,+p[2]);
    run=prev!==null&&t-prev===864e5?run+1:1;best=Math.max(best,run);prev=t;
  });
  return best;
}
function areaAverage(area){
  let n=0,sum=0;
  Object.values(S.history).forEach(d=>{const c=d.scores[area];if(c){n+=c.n;sum+=c.sum}});
  return n?{avg:Math.round(sum/n),n}:null;
}
function dayAverage(d){
  let n=0,sum=0;

}

const ttsOK="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
/* Natural sounding voices first: Edge "Natural" voices and Chrome "Google" voices sound most human */
function voiceScore(v){
  const l=v.lang.replace("_","-").toLowerCase(),want=S.settings.accent.toLowerCase();
  if(!/^en/.test(l))return -1;
  let s=l===want?4:1;
  if(/natural|neural/i.test(v.name))s+=6;
  if(/online/i.test(v.name))s+=2;
  if(/google/i.test(v.name))s+=3;
  return s;
}
function englishVoices(){return speechSynthesis.getVoices().filter(v=>voiceScore(v)>=0).sort((a,b)=>voiceScore(b)-voiceScore(a))}
function pickVoice(){
  if(S.settings.voice){const v=speechSynthesis.getVoices().find(x=>x.name===S.settings.voice);if(v)return v}
  return englishVoices()[0]||null;
}
function chunkText(t){
  if(Array.isArray(t))return t;
  if(t.length<180)return [t];
  return t.match(/[^.!?\n]+[.!?]*/g).map(s=>s.trim()).filter(Boolean);
}
let sayToken=0,lastUtter=null;
function say(text,rate){
  if(!ttsOK){toast("Your browser cannot read text aloud. Please try Chrome.");return}
  Mic.abort();sayToken++;
  const run=()=>{
    const v=pickVoice();
    chunkText(text).forEach(c=>{
      const u=new SpeechSynthesisUtterance(c);
      u.lang=v?v.lang:S.settings.accent;if(v)u.voice=v;
      u.rate=rate||S.settings.rate;
      speechSynthesis.speak(u);
    });
    speechSynthesis.resume();
  };
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(run,60)}else run();
}
function stopSpeaking(){sayToken++;if(ttsOK)speechSynthesis.cancel()}
/* Says the same text a number of times, with a short pause between, for spelling practice */
function sayTimes(text,times,rate){
  if(!ttsOK){toast("Your browser cannot read text aloud. Please try Chrome.");return}
  Mic.abort();
  const my=++sayToken;let n=0;
  const one=()=>{
    if(my!==sayToken)return;
    const u=new SpeechSynthesisUtterance(text),v=pickVoice();
    u.lang=v?v.lang:S.settings.accent;if(v)u.voice=v;u.rate=rate;
    u.onend=()=>{n++;if(n<times&&my===sayToken)setTimeout(one,900)};
    lastUtter=u;speechSynthesis.speak(u);speechSynthesis.resume();
  };
  speechSynthesis.cancel();setTimeout(one,80);
}

/* ===== COMPARE SPOKEN SENTENCE WITH CORRECT SENTENCE ===== */
const CONTRACT={"i'm":"i am","i've":"i have","i'll":"i will","i'd":"i would","you're":"you are","you've":"you have","you'll":"you will","we're":"we are","we've":"we have","we'll":"we will","they're":"they are","they've":"they have","they'll":"they will","he's":"he is","she's":"she is","it's":"it is","that's":"that is","what's":"what is","let's":"let us","there's":"there is","here's":"here is","can't":"can not","cannot":"can not","won't":"will not","shan't":"shall not","he'll":"he will","she'll":"she will"};
const SOUND_SAME={their:"there","they're":"there",too:"to",two:"to",your:"you're",hear:"here",write:"right",no:"know",buy:"by",bye:"by",four:"for",ok:"okay",sea:"see",son:"sun",meat:"meet",weak:"week",one:"won",mister:"mr",whether:"weather",ate:"eight",some:"sum",wait:"weight"};
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){
  if(n<20)return [ONES[n]];
  if(n<100)return n%10?[TENS[Math.floor(n/10)],ONES[n%10]]:[TENS[n/10]];
  if(n<1000)return n%100?[ONES[Math.floor(n/100)],"hundred"].concat(numWords(n%100)):[ONES[n/100],"hundred"];
  return [String(n)];
}
function keysOf(word){
  const out=[];
  word.toLowerCase().replace(/[’‘`]/g,"'").split(/[-–—:\/]/).forEach(part=>{
    let k=part.replace(/^[^a-z0-9%]+|[^a-z0-9%]+$/g,"").replace(/\./g,"");
    if(!k)return;
    const pct=k.endsWith("%");if(pct)k=k.slice(0,-1);
    let list;
    if(/^\d+$/.test(k))list=numWords(Number(k));
    else if(CONTRACT[k])list=CONTRACT[k].split(" ");
    else if(/n't$/.test(k))list=[k.slice(0,-3),"not"];
    else list=[k];
    if(pct)list=list.concat("percent");
    list.forEach(w=>out.push(SOUND_SAME[w]||w));
  });
  return out;
}
function tokenize(s){
  const raw=String(s).trim().split(/\s+/).filter(Boolean),toks=[];
  raw.forEach((w,i)=>keysOf(w).forEach(k=>toks.push({k,i})));
  return{raw,toks};
}
function compareText(target,said){
  const A=tokenize(target),B=tokenize(said),a=A.toks,b=B.toks,n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i].k===b[j].k?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&a[i].k===b[j].k){ops.push({t:"ok"});i++;j++}
    else if(i<n&&(j>=m||dp[i+1][j]>=dp[i][j+1]))ops.push({t:"miss",i:i++});
    else ops.push({t:"extra",j:j++});
  }
  /* a missing word next to an extra word means one word was said wrongly */
  const tState=new Array(A.raw.length).fill("ok"),sState=new Array(B.raw.length).fill("ok"),mistakes=[];
  const rank={ok:0,extra:1,miss:2,bad:3},wrongs=[],extras=[];
  const mark=(arr,idx,st)=>{if(rank[st]>rank[arr[idx]])arr[idx]=st};
  let matched=0,p=0;
  while(p<ops.length){
    if(ops[p].t==="ok"){matched++;p++;continue}
    const miss=[],ext=[];
    while(p<ops.length&&ops[p].t!=="ok"){(ops[p].t==="miss"?miss:ext).push(ops[p]);p++}
    const pairs=Math.min(miss.length,ext.length);
    for(let q=0;q<pairs;q++){
      const tw=A.raw[a[miss[q].i].i],sw=B.raw[b[ext[q].j].i];
      mark(tState,a[miss[q].i].i,"bad");mark(sState,b[ext[q].j].i,"bad");
      mistakes.push('You said "'+sw+'". The correct word is "'+tw+'".');
      wrongs.push({said:sw,word:tw});
    }
    miss.slice(pairs).forEach(o=>{const r=a[o.i].i;mark(tState,r,"miss");mistakes.push('Missing word: "'+A.raw[r]+'".');wrongs.push({said:"",word:A.raw[r]})});
    ext.slice(pairs).forEach(o=>{const r=b[o.j].i;mark(sState,r,"extra");mistakes.push('Extra word: "'+B.raw[r]+'".');extras.push(B.raw[r])});
  }
  const score=n||m?Math.round(100*matched/Math.max(n,m)):0;
  return{score,mistakes:Array.from(new Set(mistakes)),wrongs,extras,tRaw:A.raw,sRaw:B.raw,tState,sState};
}
function wordsHTML(raw,state){
  const cls={ok:"w-ok",bad:"w-bad",miss:"w-miss",extra:"w-extra"};
  return raw.map((w,i)=>'<span class="'+cls[state[i]]+'">'+esc(w)+"</span>").join(" ");
}

  if(o.area==="interview")logAct("interview");
  const badge=r.score===100?"good":r.score>=70?"":r.score>=40?"warn":"bad";
  const verdict=r.score===100?"Perfect match":r.score>=70?"Good, nearly there":r.score>=40?"Keep practising":"Try again, slowly";
  $(".sb-heard",h).textContent=text;$(".sb-heard",h).classList.remove("empty");
  res.innerHTML=
    '<div class="row between"><span class="score-pill">'+r.score+'% match</span><span class="badge '+badge+'">'+verdict+"</span></div>"+
    '<p class="small muted mt">Correct sentence</p><p class="notranslate">'+wordsHTML(r.tRaw,r.tState)+"</p>"+
    '<p class="small muted mt">What you said</p><p class="notranslate">'+wordsHTML(r.sRaw,r.sState)+"</p>"+
    (r.mistakes.length?'<ul class="mistakes notranslate">'+r.mistakes.slice(0,8).map(m=>"<li>"+esc(m)+"</li>").join("")+"</ul>":"")+
    (r.mistakes.length?'<div class="legend"><span class="w-bad">wrong word</span><span class="w-miss">missing</span><span class="w-extra">extra</span></div>':"")+
    '<p class="small muted mt">Attempt '+o.attempts+'. Words that sound the same, such as "there" and "their", count as correct.</p>'+
    '<div class="row mt"><button class="btn primary" data-act="sb-retry">Try again</button></div>';
  res.classList.remove("hidden");
  if(o.onDone)o.onDone(r.score);
}

/* Free dictation into a text box, for the Tutor and Interview answers */
function dictate(btn){
  const ta=$(btn.dataset.into);
  if(btn.classList.contains("rec")){btn._want=false;Mic.stop();return}
  if(!SR){toast(micErrorText("unsupported"));ta.focus();return}
  btn._want=true;
  const t0=Date.now();
  const run=()=>{
    const before=ta.value.trim();
    setRec(btn);
    Mic.start({long:true,
      onText:t=>{ta.value=(before?before+" ":"")+t;ta.dataset.mic="1";ta.dispatchEvent(new Event("input",{bubbles:true}))},
      /* Android Chrome stops listening by itself after a short pause. Keep listening until the learner presses Stop. */
      onEnd:()=>{if(btn._want&&document.contains(btn)&&Date.now()-t0<180000){run();return}btn._want=false;resetMicBtn(btn)},
      onError:code=>{
        const had=ta.value.trim();btn._want=false;resetMicBtn(btn);
        if(code==="no-speech"&&had)return;
        const m=$("#mic-msg");if(m){m.textContent=micErrorText(code);m.classList.remove("hidden")}else toast(micErrorText(code));ta.focus();
      }
    });
  };
  run();
}

/* ===== QUIZ ENGINE (used by Lessons and Grammar) =====
   questions: {q, b?, h?, opts, ans, why?} */
function mountQuiz(host,qs,onFinish){
  host.dataset.quiz="1";
  host._q={qs,i:0,score:0,onFinish};
  renderQuiz(host);
}
function renderQuiz(host){
  const z=host._q,q=z.qs[z.i],order=shuffle(q.opts.map((t,i)=>({t,i})));
  z.answered=false;
  host.innerHTML=
    '<div class="row between small muted"><span>Question '+(z.i+1)+" of "+z.qs.length+"</span><span>Score "+z.score+"</span></div>"+
    '<div class="mt">'+barHTML(z.i/z.qs.length*100)+"</div>"+
    '<h3 class="mt'+(q.nt?" notranslate":"")+'">'+esc(q.q)+"</h3>"+(q.b?'<div class="mt">'+mean(q.b,q.h,q.e)+"</div>":"")+
    '<div class="mt">'+order.map(o=>'<button class="opt notranslate" data-act="q-opt" data-i="'+o.i+'">'+esc(o.t)+"</button>").join("")+"</div>"+
    '<div class="q-why mt" aria-live="polite"></div>';
}
function quizAnswer(btn){
  const host=btn.closest("[data-quiz]"),z=host._q,q=z.qs[z.i];
  if(z.answered)return;
  z.answered=true;
  const pick=Number(btn.dataset.i),right=pick===q.ans;
  if(right)z.score++;
  $$(".opt",host).forEach(b=>{
    b.disabled=true;
    if(Number(b.dataset.i)===q.ans)b.classList.add("right");
    else if(b===btn)b.classList.add("wrong");
  });
  const last=z.i===z.qs.length-1;
  $(".q-why",host).innerHTML=
    '<div class="note '+(right?"good":"bad")+'"><b>'+(right?"Correct.":"Not quite.")+"</b> "+esc(q.why||("The right answer is: "+q.opts[q.ans]))+"</div>"+
    '<button class="btn primary block mt" data-act="q-next">'+(last?"See result":"Next question")+"</button>";
  $("[data-act=q-next]",host).focus();
}
function quizNext(btn){
  const host=btn.closest("[data-quiz]"),z=host._q;
  z.i++;
  if(z.i<z.qs.length)renderQuiz(host);
  else z.onFinish(z.score,z.qs.length);
}

/* Visitor counter (GoatCounter): counts each page people open, with no cookies or personal data.
   It skips localhost, so test runs are not counted. */
let gcPending=null;
function countVisit(r){
  const path=location.pathname+"#/"+r.page+(r.sub?"/"+r.sub:"");
  const title=(NAV.find(n=>n[0]===r.page)||NAV[0])[1];
  if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path,title});
  else gcPending={path,title};

const NOT_THIRD=["did","does","do","will","would","can","could","should","must","may","might","shall","let","make","makes","made","help","helps","helped","see","saw","hear","heard","watch"];
const IRREG={buyed:"bought",goed:"went",teached:"taught",catched:"caught",thinked:"thought",bringed:"brought",speaked:"spoke",writed:"wrote",eated:"ate",comed:"came",drinked:"drank",drived:"drove",runned:"ran",sended:"sent",spended:"spent",leaved:"left",feeled:"felt",keeped:"kept",meeted:"met",payed:"paid",telled:"told",sayed:"said",gived:"gave",taked:"took",maked:"made",getted:"got",knowed:"knew",finded:"found",losed:"lost",sitted:"sat",standed:"stood",understanded:"understood"};
const PAST={go:"went",come:"came",buy:"bought",eat:"ate",see:"saw",take:"took",give:"gave",make:"made",get:"got",do:"did",have:"had",meet:"met",send:"sent",write:"wrote",tell:"told",say:"said",visit:"visited",call:"called",watch:"watched",work:"worked",play:"played",talk:"talked",finish:"finished",complete:"completed",start:"started"};
function keepCase(from,to){return /^[A-Z]/.test(from)?to.charAt(0).toUpperCase()+to.slice(1):to}
/* Each rule: [pattern, replacement (text or function), plain explanation] */
const RULES=[
[/\bi am (work|live|study|go|want|need|know|like|come|play)\b/gi,(m,a)=>"I "+a.toLowerCase(),"Do not put am before a simple verb. Say I work, or I am working."],
[/\bi am (agree|disagree)\b/gi,(m,a)=>"I "+a.toLowerCase(),"Agree is already a verb, so do not add am."],
[/\bi am (understanding|knowing|wanting|liking)\b/gi,(m,a)=>"I "+({understanding:"understand",knowing:"know",wanting:"want",liking:"like"})[a.toLowerCase()],"These verbs do not normally use the -ing form."],
[/\bi am having (a |an |one |two |three |four |\d+ )?(car|bike|phone|laptop|brother|sister|brothers|sisters|son|daughter|house)\b/gi,(m,a,b)=>"I have "+(a||"")+b,"For things you own and family, use have."],
[/\bi am working\b(.{0,40}?)\bsince\b/gi,(m,a)=>"I have been working"+a+"since","With since, use have been + -ing."],
[/\bsince (\d+|one|two|three|four|five|six|seven|eight|nine|ten) (years?|months?|weeks?|days?|hours?)\b/gi,(m,a,b)=>"for "+a+" "+b,"Use for with a length of time."],
[/\bdiscuss about\b/gi,m=>keepCase(m,"discuss"),"Discuss does not take about."],
[/\bmarried with\b/gi,m=>keepCase(m,"married to"),"We say married to."],
[/\b(did not|didn't)\s+(went|ate|saw|came|gave|took|bought|did|made|sent|wrote|told|got|said|knew)\b/gi,(m,a,b)=>a+" "+BASE[b.toLowerCase()],"After did not, use the base verb."],
[/\b(have|has|had)\s+(went|ate|came|did|saw|gave|took|wrote|spoke|go|do|see|give|take|eat|write|speak|send)\b/gi,(m,a,b)=>a+" "+PP[b.toLowerCase()],"After have, has or had, use the past participle."],
[/\b(he|she|it)\s+(don't|do not)\b/gi,(m,a,b)=>a+(b.toLowerCase()==="don't"?" doesn't":" does not"),"With he, she and it, use does not."],
[/\b(we|they|you)\s+was\b/gi,(m,a)=>a+" were","With we, they and you, use were."],
[/\bmore (better|easier|faster|bigger|smaller|cheaper)\b/gi,(m,a)=>a,"Do not use more with a word ending in -er."],
[/\btoday morning\b/gi,m=>keepCase(m,"this morning"),"We say this morning."],
[/\btoday evening\b/gi,m=>keepCase(m,"this evening"),"We say this evening."],
[/\byesterday night\b/gi,m=>keepCase(m,"last night"),"We say last night."],
[/\bcousin (brother|sister)\b/gi,m=>keepCase(m,"cousin"),"In English, just say cousin."],
[/\brevert back\b/gi,m=>keepCase(m,"reply"),"Reply is clearer. Revert means go back to an earlier state."],
[/\breturn back\b/gi,m=>keepCase(m,"return"),"Return already means go back."],
[/\brepeat again\b/gi,m=>keepCase(m,"repeat"),"Repeat already means say again."],
[/\bcope up\b/gi,m=>keepCase(m,"cope"),"We say cope with."],
[/\bdo the needful\b/gi,m=>keepCase(m,"please take the necessary action"),"Do the needful sounds old-fashioned. Say exactly what you need."],
[/\bout of station\b/gi,()=>"out of town","We say out of town."],
[/\bpassed out from\b/gi,m=>keepCase(m,"graduated from"),"Passed out means fainted. Say graduated from."],
[/\bmy good name\b/gi,m=>keepCase(m,"my name"),"Just say my name."],
[/\byour good name\b/gi,m=>keepCase(m,"your name"),"Just say your name."],
[/\b[Mm]yself (?=[A-Z])/g,()=>"I am ","To introduce yourself, say I am or My name is."],
[/\bone of my (friend|colleague|brother|sister|manager)\b/gi,(m,a)=>"one of my "+a+"s","After one of my, use a plural noun."],
[/\b(informations|furnitures|equipments|softwares|advices|luggages|sceneries)\b/gi,(m,a)=>a.slice(0,-1).replace(/ie$/,"y"),"This noun has no plural form."],
[/\breach(ed|es)? (to|at) (office|home|the office)\b/gi,(m,a,b,c)=>"reach"+(a||"")+" "+(c.toLowerCase()==="home"?"home":"the office"),"Reach does not take to or at."],
[/\bgo to home\b/gi,m=>keepCase(m,"go home"),"We say go home, without to."],
[/\ba (hour|hours|honest|MIS)\b/g,(m,a)=>"an "+a,"Use an before a vowel sound."],
[/\ba ([aeiou][a-z]*)\b/gi,(m,a)=>/^(one|once|uni|use|usu|uti|eu|ur)/i.test(a)?m:keepCase(m,"an")+" "+a,"Use an before a vowel sound."],
[/\b(buyed|goed|teached|catched|thinked|bringed|speaked|writed|eated|comed|drinked|drived|runned|sended|spended|leaved|feeled|keeped|meeted|payed|telled|sayed|gived|taked|maked|getted|knowed|finded|losed|sitted|standed|understanded)\b/gi,(m,a)=>keepCase(m,IRREG[a.toLowerCase()]),"This verb has an irregular past form."],
[/\b(i|we|they|you|he|she) (go|come|buy|eat|see|take|give|make|get|do|have|meet|send|write|tell|say|visit|call|watch|work|play|talk|finish|complete|start)\b(?=[^.?!]{0,40}\b(?:yesterday|last (?:night|week|month|year|time)|ago)\b)/gi,(m,a,b,off,str)=>{
  const before=str.slice(0,off).trim().split(/\s+/).pop().toLowerCase();
  return /^(did|didn't|will|would|to|can|could|should|must|may|might|not|do|does)$/.test(before)?m:a+" "+(PAST[b.toLowerCase()]||b+"ed");
},"Use the past tense for yesterday, last week, or ago."],
[/\b(he|she|it) (go|do|have|work|like|live|want|study|eat|come|play|know|need|make|take|watch|teach|read|write|speak|send)\b/gi,(m,a,b,off,str)=>{
  const before=str.slice(0,off).trim().split(/\s+/).pop().toLowerCase();
  return NOT_THIRD.indexOf(before)>=0?m:a+" "+VERB_S[b.toLowerCase()];
},"With he, she and it, add -s to the verb."]
];
function ruleCheck(text,typed){
  const fixes=[];let better=text;
  RULES.forEach(r=>{
    better=better.replace(r[0],function(){
      const m=arguments[0],out=typeof r[1]==="function"?r[1].apply(null,arguments):r[1];
      if(out!==m)fixes.push({bad:m,good:out,why:r[2]});
      return out;
    });
  });
  if(typed){
    if(/\bi\b/.test(better)){better=better.replace(/\bi\b/g,"I");fixes.push({bad:"i",good:"I",why:"The word I is always a capital letter."})}
    if(/^[a-z]/.test(better)){const c=better.charAt(0).toUpperCase()+better.slice(1),w=better.split(/\s+/)[0];fixes.push({bad:w,good:c.split(/\s+/)[0],why:"Start a sentence with a capital letter."});better=c}
    if(!/[.!?]\s*$/.test(better)){better=better.trim()+".";fixes.push({bad:"(no full stop)",good:".",why:"End a sentence with a full stop."})}
  }
  return{fixes,better,short:text.trim().split(/\s+/).length<4};
}
function tutorHTML(m){
  if(m.r==="coach")return '<div class="msg coach"><div class="who"><span>Tutor</span></div>'+enLine(m.t)+'<div class="mt">'+sayBtn(m.t,"Listen to question")+"</div></div>";
  if(m.r==="user")return '<div class="msg user"><div class="who"><span>You'+(m.spoken?" (spoken)":" (typed)")+'</span></div><span class="notranslate">'+esc(m.t)+"</span></div>";
  const fx=m.fixes||[];
  return '<div class="msg check"><div class="who"><span class="badge warn">Rule check, not AI</span></div>'+
    (fx.length?fx.map(f=>'<div class="fix"><span class="notranslate"><del>'+esc(f.bad)+"</del> → <ins>"+esc(f.good)+'</ins></span><div class="small muted">'+esc(f.why)+"</div></div>").join("")+'<div class="fix"><b>Suggested:</b> <span class="notranslate">'+esc(m.better)+"</span></div>":
      '<div class="small">The fixed rules found no common mistakes. This does not prove the answer is perfect.</div>')+
    (m.short?'<div class="fix small">Try a longer answer next time: a full sentence with a reason or example.</div>':"")+"</div>";
}
function claudeText(){
  const T=S.tutor,parts=[];
  T.msgs.forEach(m=>{if(m.r==="coach")parts.push("Tutor: "+m.t);if(m.r==="user")parts.push("Me: "+m.t)});
  return "You are my English speaking coach. I speak Bengali and Hindi and I work in an office as an MIS executive. Below is my English practice conversation.\n\nPlease:\n1. Correct each of my answers.\n2. Explain each mistake in simple English, and add the Bengali meaning where it helps.\n3. Show a more natural way to say each answer.\n4. Tell me the one thing I should practise next.\n\nConversation:\n"+parts.join("\n");
}
function pageTutor(){
  const T=S.tutor;
  const honest='<div class="note warn honest">'+ic("info")+"<div><b>Good to know:</b> questions and corrections here come from fixed rules, not from AI. They catch common mistakes only. For real AI feedback, copy your conversation to Claude using the buttons below.</div></div>";

    (T.done?'<div class="note good mt">Conversation finished. Copy it to Claude for AI feedback, or start again.</div>':
    '<div class="mt"><label class="field" for="tutor-ans">Your answer</label><textarea class="input mt" id="tutor-ans" placeholder="Speak or type your answer" data-inp="tutor-typed"></textarea>'+
    '<div class="note warn mt hidden" id="mic-msg" role="alert"></div>'+
    '<div class="mic-row"><button class="mic-btn" data-act="dictate" data-into="#tutor-ans" data-idle="Speak answer"'+(SR?"":" disabled")+">"+ic("mic")+'<span>Speak answer</span></button><button class="btn primary" data-act="tutor-send">Send answer'+ic("next")+"</button><span data-micstate>"+micStateHTML()+"</span></div></div>")+
    "</div>"+
    '<div class="card"><h2>Get AI feedback from Claude</h2><p class="small muted">Step 1: copy your conversation. Step 2: open Claude. Step 3: paste it into the chat box and send. You need a Claude account, and a free one works.</p>'+
    '<div class="row mt"><button class="btn primary" data-act="tutor-copy"'+(T.msgs.some(m=>m.r==="user")?"":" disabled")+">"+ic("copy")+'Copy conversation</button><a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">'+ic("ext")+"Open Claude</a>"+
    (T.done?'<button class="btn" data-act="tutor-again">Start again</button>':"")+"</div>"+
    '<details class="mt"><summary class="small">See the text that will be copied</summary><textarea class="input mt" readonly rows="8" id="tutor-export">'+esc(claudeText())+"</textarea></details></div>");
  const c=$("#chat");if(c&&c.lastElementChild&&T.msgs.length>1)c.lastElementChild.scrollIntoView({block:"nearest"});
}
function tutorAsk(){
  const T=S.tutor,q=TUTOR_TOPICS[T.topic].qs[T.idx];
  T.msgs.push({r:"coach",t:q});save();
}
function tutorSend(){
  const ta=$("#tutor-ans"),text=ta.value.trim();
  if(!text){toast("Please speak or type your answer first.");ta.focus();return}
  Mic.abort();
  const spoken=ta.dataset.mic==="1",T=S.tutor,res=ruleCheck(text,!spoken);
  T.msgs.push({r:"user",t:text,spoken});
  T.msgs.push({r:"check",fixes:res.fixes,better:res.better,short:res.short});
  recordFixes(res.fixes);
  logAct("tutor");
  T.idx++;
  if(T.idx<TUTOR_TOPICS[T.topic].qs.length)tutorAsk();else{T.done=true;save()}
  pageTutor();
  const last=T.msgs[T.msgs.length-1];
  if(!T.done&&S.settings.autoRead&&last.r==="coach")say(last.t);
  const box=$("#tutor-ans");if(box)box.scrollIntoView({block:"center"});
}

function loadDict(l){
  try{const o=JSON.parse(readLS("pesc_dict_"+l)||"null");return o&&o.v===DICT_V?o.d:null}catch(e){return null}
}
function trText(k){
  if(DICT[k])return DICT[k];
  if(!/\d/.test(k))return null;
  const e=DICT["#"+k.replace(/\d+/g,"#")],now=k.match(/\d+/g);
  if(!e||e[1].length!==now.length)return null;
  let out=e[0],ok=true;
  const mark=i=>String.fromCharCode(0xE000+i);
  e[1].forEach((n,i)=>{
    const rx=new RegExp("(^|\\D)"+n+"(?!\\d)");
    if(rx.test(out))out=out.replace(rx,(m,a)=>a+mark(i));else ok=false;
  });
  if(!ok)return null;
  now.forEach((n,i)=>{out=out.replace(mark(i),n)});
  return out;
}
function trSkip(el){return !el||!!el.closest(".notranslate,script,style,textarea,#harvest")}
function trNode(n){
  const k=n.nodeValue.trim();
  if(!k||!/[A-Za-z]/.test(k)||trSkip(n.parentElement))return;
  const v=trText(k);
  if(v&&v!==k)n.nodeValue=n.nodeValue.replace(k,()=>v);
}
function trTree(root){
  if(root.nodeType===3){trNode(root);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n;while((n=w.nextNode()))trNode(n);
  $$("[placeholder]",root).forEach(e=>{const v=DICT[e.getAttribute("placeholder")];if(v)e.setAttribute("placeholder",v)});
  /* English practice text stays English, so screen readers read it with an English voice */
  if(root.matches&&root.matches(".notranslate:not([lang])"))root.setAttribute("lang","en");
  $$(".notranslate:not([lang])",root).forEach(e=>e.setAttribute("lang","en"));
}
function startDict(){
  trTree(document.body);
  if(DICT[document.title])document.title=DICT[document.title];
  new MutationObserver(ms=>ms.forEach(m=>{
    if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trTree);
  })).observe(document.body,{childList:true,subtree:true,characterData:true});
}

function collectStrings(){
  const set=new Set(),add=t=>{t=String(t||"").trim();if(t&&/[A-Za-z]/.test(t))set.add(t)};
  EXTRA_UI.forEach(add);
  ["not-allowed","service-not-allowed","no-speech","audio-capture","network","language-not-supported","unsupported","start-failed","other"].forEach(c=>add(micErrorText(c)));
  const scan=()=>{

  Object.values(OFFICE).forEach(o=>{add(o.t);add(o.d);o.phrases.forEach(x=>add(x[0]))});
  EMAILS.forEach(m=>{add(m.t);add(m.s);add(m.b)});
  WORDS.forEach(w=>{add(w.e);add(w.x);add(w.u)});
  Object.values(GRAMMAR).forEach(g=>{add(g.t);add(g.d);g.sections.forEach(x=>{add(x.h);add(x.en);(x.ex||[]).forEach(add)});g.quiz.forEach(x=>add(x[3]))});
  INTERVIEW.forEach(q=>{add(q.q);add(q.a);add(q.tip)});
  Object.values(TUTOR_TOPICS).forEach(t=>{add(t.t);t.qs.forEach(add)});
  RULES.forEach(r=>add(r[2]));
  EXTRA_UI2.forEach(add);
  Object.values(FRIEND_MODES).forEach(m=>{add(m.t);add(m.d)});
  OFFICE_SCENES.forEach(c=>{add(c.t);add(c.d)});
  BADGES.forEach(b=>{add(b[1]);add(b[2])});
  return Array.from(set);
}
function plainDigits(t){
  return t.replace(/[०-९]/g,c=>c.charCodeAt(0)-0x966).replace(/[০-৯]/g,c=>c.charCodeAt(0)-0x9E6)
    .replace(/[٠-٩]/g,c=>c.charCodeAt(0)-0x660).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-0x6F0);
}
function harvestPanel(html){$("#hv-box").innerHTML=html}
/* Google's translator stops after about 200 pieces per page load, so the text is prepared in
   batches over several quick reloads. Progress is saved after each batch. */
function runHarvest(l){
  const key="pesc_part_"+l;
  let part;
  try{part=JSON.parse(readLS(key)||"null")}catch(e){part=null}
  if(!part||part.v!==DICT_V)part={v:DICT_V,d:{},zero:0};
  const box=document.createElement("div");
  box.id="harvest";
  box.innerHTML='<div class="card notranslate" id="hv-box"></div>';
  document.body.appendChild(box);
  const all=collectStrings(),left=all.filter(t=>!(t in part.d)),total=all.length;
  const shown=n=>{
    harvestPanel('<h1>Preparing your language</h1><p class="mt">This happens only the first time, and takes one to two minutes. Please keep this page open on your screen.</p><div class="mt">'+barHTML(n/total*100)+'</div><p class="small muted mt">'+Math.round(n/total*100)+"%</p>");
  };
  const fail=()=>{
    setGtCookie("");
    harvestPanel('<h1>Could not prepare this language</h1><p class="mt">Please check your internet connection, keep this page on your screen, and try again. Your progress is saved.</p><div class="row mt"><button class="btn primary" data-act="hv-retry">Try again</button><button class="btn" data-act="hv-english">Back to English</button></div>');
  };
  const complete=()=>{
    const d={};
    Object.keys(part.d).forEach(en=>{
      const v=plainDigits(part.d[en]),nums=en.match(/\d+/g);
      if(nums&&new Set(nums).size===nums.length)d["#"+en.replace(/\d+/g,"#")]=[v,nums];
      d[en]=v;
    });
    Object.keys(localStorage).filter(k=>k.indexOf("pesc_dict_")===0).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
    const ok=writeLS("pesc_dict_"+l,JSON.stringify({v:DICT_V,d}));
    try{localStorage.removeItem(key)}catch(e){}
    if(!ok){fail();return}
    setGtCookie("");
    location.reload();
  };
  shown(total-left.length);
  if(!left.length){complete();return}
  const batch=left.slice(0,150);
  $("#view").innerHTML='<div id="hv-list"></div>';
  const list=$("#hv-list");
  batch.forEach(t=>{const p=document.createElement("p");p.textContent=t;list.appendChild(p)});
  setGtCookie(l);
  window.gtInit=()=>{new google.translate.TranslateElement({pageLanguage:"en",autoDisplay:false},"gt-box")};
  const js=document.createElement("script");
  js.src="https://translate.google.com/translate_a/element.js?cb=gtInit";
  document.head.appendChild(js);
  const ps=$$("p",list);
  let last=0,lastAt=Date.now();
  const tick=setInterval(()=>{
    const done=ps.filter(p=>p.querySelector("font")).length;
    if(done!==last){last=done;lastAt=Date.now()}
    shown(total-left.length+done);
    const idle=Date.now()-lastAt;
    if(done<batch.length&&idle<(done?2500:15000))return;
    clearInterval(tick);
    ps.forEach((p,i)=>{if(p.querySelector("font"))part.d[batch[i]]=p.innerText.trim()});
    part.zero=done?0:part.zero+1;
    /* Nothing new twice: stop, and keep what is ready if it is nearly everything */
    if(part.zero>=2){
      if(Object.keys(part.d).length>=total*.9)complete();else{part.zero=0;writeLS(key,JSON.stringify(part));fail()}
      return;
    }
    if(!writeLS(key,JSON.stringify(part))){fail();return}
    location.reload();
  },300);
}

const TR={text:"",from:"en",to:"bn"};
function translateURL(){return gtURL(TR.from,TR.to,TR.text)}
function trMatches(){
  const t=TR.text.trim(),q=t.toLowerCase(),clean=s=>s.toLowerCase().replace(/[.,!?।]/g,"").trim();
  if(!q)return[];
  const out=[];
  WORDS.forEach(w=>{if(w.e===q||w.b===t||w.h===t||w.h.split(" / ").indexOf(t)>=0)out.push({e:w.e,b:w.b,h:w.h})});
  const sets=speakSets();
  Object.values(sets).forEach(list=>list.forEach(x=>{
    if((clean(x.e)===clean(t)||clean(x.b)===clean(t)||clean(x.h)===clean(t))&&!out.some(o=>o.e===x.e))out.push(x);
  }));
  return out.slice(0,4);
}

function speakP(text,rate){

    if(!ttsOK){res();return}
    const u=new SpeechSynthesisUtterance(text),v=pickVoice();
    u.lang=v?v.lang:S.settings.accent;if(v)u.voice=v;u.rate=rate||0.95;
    let done=false,started=false;const fin=()=>{if(!done){done=true;res()}};
    u.onend=fin;u.onerror=fin;
    /* Safety limit only. It starts when the voice really begins, because online voices can start late. */
    u.onstart=()=>{if(started)return;started=true;setTimeout(fin,5000+text.length*200/(rate||1))};
    setTimeout(()=>{if(!started)fin()},8000);
    lastUtter=u;speechSynthesis.speak(u);speechSynthesis.resume();
  });
}

async function coachRun(){
  const my=++CO.run,alive=()=>my===CO.run&&!!$("#coach-chat");
  coachButtons("running");
  if(CO.i===0&&CO.tries===0&&!$("#coach-chat .msg"))await coachLine("Hi "+S.settings.name+"! I am your speaking coach. I will say a sentence, and then you repeat it. Let's start.",alive);
  while(alive()&&CO.i<CO.list.length){
    const it=CO.list[CO.i];
    coachTarget(it);
    await coachLine(CO.tries?"Now say the whole sentence again. Listen.":"Sentence "+(CO.i+1)+". Please repeat after me.",alive);
    if(!alive())return;
    coachStatus("Coach is speaking...",true);
    await speakP(it.e,CO.tries?0.75:0.9);
    if(!alive())return;
    coachStatus("Listening... speak now",true);
    const r=await listenP(t=>{if(alive())coachStatus("I heard: "+t,true)});
    if(!alive())return;
    if(r.err||!r.text){
      if((r.err==="no-speech"||!r.text)&&CO.quiet<2){CO.quiet++;await coachLine("I could not hear you. Please speak a little louder.",alive);continue}
      CO.quiet=0;
      coachAdd('<div class="note warn">'+esc(micErrorText(r.err||"no-speech"))+"</div>");
      coachStatus("Paused");coachButtons("paused");return;
    }
    CO.quiet=0;
    const res=compareText(it.e,r.text);
    logAct("speak");logScore("speaking",res.score);
    coachAdd('<div class="msg user"><div class="who"><span>You said</span><span>'+res.score+'%</span></div><span class="notranslate">'+wordsHTML(res.sRaw,res.sState)+"</span></div>");
    if(res.score===100){
      CO.perfect++;
      await coachLine(PRAISE[Math.floor(Math.random()*PRAISE.length)],alive);
      CO.i++;CO.tries=0;continue;
    }
    CO.tries++;
    const ws=res.wrongs.slice(0,2);
    let say=ws.map(w=>w.said?'I heard "'+clean(w.said)+'", but the word is "'+clean(w.word)+'".':'You missed the word "'+clean(w.word)+'".').join(" ");
    if(!ws.length&&res.extras.length)say='You added an extra word, "'+clean(res.extras[0])+'".';
    await coachLine("Almost! "+say,alive);
    for(const w of ws){
      if(!alive())return;
      await coachLine("Listen: "+clean(w.word)+".",alive);
      if(!alive())return;
      await speakP(clean(w.word),0.6);
    }
    if(CO.tries>=3){await coachLine("Good effort. Let's move on to the next sentence.",alive);CO.i++;CO.tries=0}
  }
  if(alive()&&CO.i>=CO.list.length){
    await coachLine("Great work today! You said "+CO.perfect+" of "+CO.list.length+" sentences perfectly.",alive);
    coachStatus("Session finished");
    const b=$("#coach-btns");if(b)b.innerHTML='<button class="btn primary" data-act="co-start">Start a new session</button>';
  }
}

/* ===== TALK WITH A FRIEND =====
   A spoken conversation in one of 7 modes. Uses the AI built into Chrome when the browser has it (free, on the device, no key).
   Without it, a practice friend asks fixed questions for the chosen mode and gives rule-based tips, and says so.
   After each chat the learner gets a report built only from what they actually said. */
const FR={run:0,session:null,mode:"",avail:"",topic:"free",q:0,ended:false,log:[],trimmed:false};
const LMOPTS={expectedInputs:[{type:"text",languages:["en"]}],expectedOutputs:[{type:"text",languages:["en"]}]};
const FRIEND_PROMPT="You are my friendly English speaking partner. My name is "+"{name}"+". I live in India, I speak Bengali and Hindi, and I want to speak English with more confidence. Talk with me in simple English. Keep your replies short, ask me one question at a time, and when I make a grammar or word mistake, gently tell me the correct way to say it, then continue the conversation.";
function friendMode(){return FRIEND_MODES[FR.topic]||FRIEND_MODES.free}
function friendSystem(){
  const n=S.settings.name,m=friendMode();
  return "You are Alex, a warm and friendly English speaking partner. You are chatting by voice with "+n+", who lives in India, speaks Bengali and Hindi, works in an office, and wants to speak English with more confidence. "+
    "Conversation type: "+m.t+". "+m.ai+" "+
    "Keep every reply short: one to three simple sentences, then ask exactly one question that follows on from what "+n+" just said. "+
    "Remember what "+n+" told you earlier in this chat and refer back to it. Never repeat a question you already asked, and vary how you start your replies. Use everyday words. "+
    "If "+n+"'s last message has a grammar mistake or a wrong word, start your reply with one line that begins with 'Tip:' and gives the corrected sentence, then continue on a new line. "+
    "Do not use lists, emojis, or symbols like * or #.";
}
async function friendAvail(){
  if(typeof LanguageModel==="undefined")return "none";
  try{return String(await LanguageModel.availability(LMOPTS))}catch(e){return "none"}
}
/* recent: the last few messages, so a new session still knows what was said */
function friendSession(progress,recent){
  const hist=(recent||[]).map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}));
  return LanguageModel.create(Object.assign({initialPrompts:[{role:"system",content:friendSystem()}].concat(hist),
    monitor(m){m.addEventListener("downloadprogress",e=>{if(progress)progress(e.loaded)})}},LMOPTS));
}
/* The built-in AI has a small memory. Before it fills up, start a new session that keeps the last messages. */
function sessionNearlyFull(s){
  const used=s.contextUsage!=null?s.contextUsage:s.inputUsage,max=s.contextWindow!=null?s.contextWindow:s.inputQuota;
  return used!=null&&max?used/max>0.75:false;
}
async function friendRenew(){
  try{if(FR.session&&FR.session.destroy)FR.session.destroy()}catch(x){}
  FR.session=await friendSession(null,FR.log.slice(-8));
  if(!FR.trimmed){FR.trimmed=true;frAdd('<div class="note">This chat is long, so Alex now keeps the last few messages in mind.</div>')}
}
/* Listens until the learner stops talking for two seconds, or presses "I am done speaking".
   Android Chrome stops listening by itself after a short pause, so listening restarts until then. */
let listenWant=false;
function listenLong(onText){
  return new Promise(res=>{
    if(!SR){res({err:"unsupported"});return}
    let base="",text="",last=Date.now(),timer=0;const start=Date.now();
    listenWant=true;
    const finish=v=>{clearInterval(timer);listenWant=false;res(v)};
    const run=()=>Mic.start({long:true,
      onText:t=>{text=(base?base+" ":"")+t;last=Date.now();if(onText)onText(text)},
      onEnd:()=>{
        const now=Date.now();
        if(listenWant&&now-start<120000&&(text?now-last<2000:now-start<10000)){base=text;run();return}
        finish({text});
      },
      onError:c=>{if(c==="no-speech"&&text){finish({text});return}finish({err:c,text})}});
    run();
    timer=setInterval(()=>{
      if(!listenWant||!Mic.rec){clearInterval(timer);return}
      const now=Date.now();
      if((text&&now-last>2000)||(!text&&now-start>10000)){listenWant=false;Mic.stop()}
    },250);
  });
}
function frStatus(t,busy){const s=$("#fr-status");if(s){s.textContent=t;s.classList.toggle("on",!!busy)}}
function frAdd(html){const c=$("#fr-chat");if(!c)return;c.insertAdjacentHTML("beforeend",html);c.lastElementChild.scrollIntoView({block:"nearest"})}
function frButtons(state){
  const b=$("#fr-btns");if(!b)return;
  b.innerHTML=state==="listening"?'<button class="btn primary" data-act="fr-done">I am done speaking</button><button class="btn" data-act="fr-stop">Pause</button>':
    state==="busy"?'<button class="btn" data-act="fr-speak">'+ic("mic")+'Interrupt and speak</button><button class="btn" data-act="fr-stop">Pause</button>':
    state==="ended"?'<button class="btn primary" data-act="fr-start">Start a new chat</button>':
    '<button class="btn primary" data-act="fr-speak">'+ic("mic")+'Speak</button><button class="btn" data-act="fr-end">End chat and see report</button>';
}
/* Shows Alex's reply, with any Tip line in its own box, and says it aloud */
async function friendSays(reply,alive){
  const lines=String(reply).replace(/[*#_`]/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const tips=lines.filter(l=>/^tip\s*:/i.test(l)).map(l=>l.replace(/^tip\s*:\s*/i,""));
  const rest=lines.filter(l=>!/^tip\s*:/i.test(l)).join(" ");
  tips.forEach(t=>frAdd('<div class="msg check"><div class="who"><span class="badge warn">Tip</span></div><span class="notranslate">'+esc(t)+"</span></div>"));
  if(rest){frAdd('<div class="msg coach"><div class="who"><span>Alex</span></div>'+enLine(rest)+"</div>");FR.log.push({r:"alex",t:rest})}
  frStatus("Alex is speaking...",true);frButtons("busy");
  const spoken=(tips.length?"Small tip: "+tips.join(" ")+" ":"")+rest;
  if(alive())await speakP(spoken,0.95);
}
async function frListen(){
  const my=FR.run,alive=()=>my===FR.run&&!!$("#fr-chat");
  if(FR.ended)return;
  frStatus("Listening... speak now",true);frButtons("listening");
  const r=await listenLong(t=>{if(alive())frStatus("I heard: "+t,true)});
  if(!alive())return;
  if(!r.text){frStatus(r.err&&r.err!=="no-speech"?micErrorText(r.err):"I did not hear anything. Press Speak, or type below.");frButtons("idle");return}
  friendUser(r.text,true);
}
async function friendUser(text,spoken){
  const my=FR.run,alive=()=>my===FR.run&&!!$("#fr-chat");
  frAdd('<div class="msg user"><div class="who"><span>You'+(spoken?" (spoken)":" (typed)")+'</span></div><span class="notranslate">'+esc(text)+"</span></div>");
  FR.log.push({r:"user",t:text,spoken});
  logAct("chat");
  frStatus("Alex is thinking...",true);frButtons("busy");
  let reply;
  if(FR.mode==="ai"){
    try{
      if(sessionNearlyFull(FR.session))await friendRenew();
      reply=await FR.session.prompt(text);
    }catch(e){
      try{await friendRenew();reply=await FR.session.prompt(text)}
      catch(e2){if(alive()){frStatus("Your friend could not reply. Please try again.");frButtons("idle")}return}
    }
  }else reply=fixedReply(text,spoken);
  if(!alive())return;
  await friendSays(reply,alive);
  if(alive()&&!FR.ended)frListen();
  else if(alive())friendFinish();
}
/* Practice friend without AI: fixed questions for the chosen mode, and rule-based tips */
function fixedReply(text,spoken){
  const qs=friendMode().qs,res=ruleCheck(text,!spoken);
  const tip=res.fixes.length?"Tip: "+res.better+"\n":"";
  const react=["That sounds interesting!","Nice, thank you for sharing.","Oh, I see.","Great answer!","I understand.","Good point."][Math.floor(Math.random()*6)];
  FR.q++;
  if(FR.q>=qs.length){FR.ended=true;return tip+react+" Thank you for chatting with me. That was great practice!"}
  return tip+react+" "+qs[FR.q];
}
async function friendStart(){
  const my=++FR.run,alive=()=>my===FR.run&&!!$("#fr-chat");
  FR.ended=false;FR.q=0;FR.log=[];FR.trimmed=false;
  $("#fr-session").classList.remove("hidden");$("#fr-chat").innerHTML="";$("#fr-report").innerHTML="";$("#fr-report").classList.add("hidden");
  $("#fr-session").scrollIntoView({block:"start"});
  let opener;
  if(FR.avail==="available"||FR.avail==="downloadable"||FR.avail==="downloading"){
    frStatus("Getting your friend ready...",true);frButtons("busy");
    try{
      if(FR.session&&FR.session.destroy)FR.session.destroy();
      FR.session=await friendSession(p=>{if(alive())frStatus("Downloading the free AI: "+Math.round(p*100)+"%",true)});
      FR.mode="ai";
      opener=await FR.session.prompt("Start our conversation. Greet me in one short sentence and ask me one question that fits this conversation type.");
    }catch(e){
      FR.mode="fixed";
      frAdd('<div class="note warn">The built-in AI could not start, so your practice friend will ask fixed questions instead.</div>');
    }
  }else FR.mode="fixed";
  if(!alive())return;
  if(FR.mode==="fixed")opener="Hi "+S.settings.name+"! I am Alex, your practice friend. "+friendMode().qs[0];

}
async function friendCheck(){
  const box=$("#fr-ai");if(!box)return;
  FR.avail=await friendAvail();

    '<div class="note warn">This browser has no built-in AI, so your practice friend asks fixed questions for the conversation type you choose and gives simple grammar tips. It is not AI. For a real AI friend, use Chrome on a computer, or a free AI app below.</div>';

function friendFinish(){
  FR.run++;Mic.abort();stopSpeaking();FR.ended=true;

/* ===== CONVERSATION REPORT =====
   Built only from the learner's own messages. Grammar is checked by fixed rules, so it finds common mistakes only. */
function friendReport(){
  const box=$("#fr-report");if(!box)return;
  const mine=FR.log.filter(m=>m.r==="user");
  box.classList.remove("hidden");
  if(!mine.length){box.innerHTML='<h2>Conversation report</h2><p class="muted mt">You did not send any messages, so there is nothing to report yet.</p>';return}
  const rows=mine.map(m=>({t:m.t,spoken:m.spoken,res:ruleCheck(m.t,!m.spoken)}));
  const bad=rows.filter(r=>r.res.fixes.length),all=[].concat.apply([],rows.map(r=>r.res.fixes));
  const words=mine.reduce((a,m)=>a+m.t.split(/\s+/).filter(Boolean).length,0),avg=Math.round(words/mine.length*10)/10;
  const score=Math.round(100*(rows.length-bad.length)/rows.length);
  const vocab=betterWords(mine.map(m=>m.t).join(" "));
  recordFixes(all);logScore("conversation",score);
  S.chats=(S.chats||[]).concat({d:todayKey(),mode:FR.topic,n:rows.length,score,mistakes:all.length,words}).slice(-30);save();
  const tips=[];
  if(avg<6)tips.push("Give longer answers. Add a reason or an example, for example: \"I like my job because I learn new things every day.\"");
  planFromFixes(all).slice(0,2).forEach(p=>tips.push(p.t+": "+p.d));
  if(!bad.length)tips.push("No common mistakes were found. Next time, try the "+(FR.topic==="free"?"Office":"Free")+" conversation type to practise new words.");
  if(mine.some(m=>m.spoken))tips.push("Look at your spoken messages above. Words the browser wrote down wrongly can show where your pronunciation was unclear.");
  box.innerHTML='<h2>Conversation report</h2>'+
    '<div class="grid g3 mt"><div class="card stat"><b>'+rows.length+'</b><span>Messages</span></div><div class="card stat"><b>'+avg+'</b><span>Words per message</span></div><div class="card stat"><b>'+score+'%</b><span>Messages with no common mistakes</span></div></div>'+
    '<p class="small muted mt">The score counts how many of your messages passed the fixed grammar rules. It is not an AI score.</p>'+
    '<h3 class="section">Grammar mistakes and correct sentences</h3>'+
    (bad.length?bad.map(r=>'<div class="fix notranslate"><div><del>'+esc(r.t)+'</del></div><div><ins>'+esc(r.res.better)+"</ins></div>"+r.res.fixes.map(f=>'<div class="small muted">'+esc(f.why)+whyLocal(f.why)+"</div>").join("")+"</div>").join(""):'<p class="mt">No common mistakes found.</p>')+
    '<h3 class="section">Better vocabulary</h3>'+
    (vocab.length?'<ul class="mistakes">'+vocab.map(v=>'<li><span class="notranslate">"'+esc(v[0])+'" → <b>'+esc(v[1])+"</b></span></li>").join("")+"</ul>":'<p class="mt small muted">No simple words to upgrade this time.</p>')+
    '<h3 class="section">Pronunciation</h3><p class="mt small">Not measured. Your browser turns speech into text, but it cannot score the sounds inside words. Real pronunciation scoring needs a speech assessment service.</p>'+
    '<h3 class="section">What to improve next</h3><ul class="mistakes">'+tips.map(t=>"<li>"+esc(t)+"</li>").join("")+"</ul>"+
    '<div class="row mt">'+(FR.mode==="ai"?'<button class="btn primary" data-act="fr-ai-review">Ask the built-in AI for a review</button>':"")+
    '<button class="btn" data-act="fr-copy-chat">'+ic("copy")+'Copy chat for a full AI review</button></div><div id="fr-ai-review" class="mt"></div>';
  box.scrollIntoView({block:"start"});
}

}
/* Sends to the Google Sheet and waits for its "ok", so the app never says "sent" when it was not saved */
async function postFeedback(data){
  const r=await fetch(FEEDBACK_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
  const t=(await r.text()).trim();
  if(!r.ok||!/^ok\b/i.test(t))throw new Error(t.slice(0,80)||"HTTP "+r.status);
}
/* Feedback that could not be sent is kept on this device and sent the next time the app opens */
async function sendQueuedFeedback(){
  const q=S.fbQueue||[];if(!q.length||!navigator.onLine||!FEEDBACK_URL)return;
  const left=[];
  for(const d of q){try{await postFeedback(d)}catch(e){left.push(d)}}
  S.fbQueue=left;save();
}
const FB_PER_DAY=3;
async function feedbackSend(btn){
  const comment=$("#fb-comment").value.trim(),email=$("#fb-email").value.trim();
  if(!FB.rating){toast("Please choose a star rating first.");return}
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Please check the email address.");$("#fb-email").focus();return}
  const thanks=()=>setView(head("Thank you!","Your feedback was sent.")+'<div class="card"><p>Thank you for helping to improve English Coach.</p><a class="btn primary mt" href="#/dashboard">Back to Dashboard</a></div>');
  /* A hidden field that only robots fill in */
  if($("#fb-site").value){thanks();return}
  const c=S.fbCount&&S.fbCount.d===todayKey()?S.fbCount:{d:todayKey(),n:0};
  if(c.n>=FB_PER_DAY){toast("Thank you! You have already sent "+FB_PER_DAY+" messages today. Please send more tomorrow.");return}
  btn.disabled=true;btn.textContent="Sending...";
  const data={rating:FB.rating,liked:FB.liked,comment,name:$("#fb-name").value.trim(),email,lang:S.settings.lang||"English",
    device:(/android/i.test(navigator.userAgent)?"Android":isIOS()?"iPhone":/windows/i.test(navigator.userAgent)?"Windows":"Other")+(isInstalled()?" (installed app)":" (browser)")};
  try{
    await postFeedback(data);
    c.n++;S.fbCount=c;S.feedbackSent=todayKey();save();
    thanks();
  }catch(e){
    btn.disabled=false;btn.textContent="Send feedback";
    if(!navigator.onLine){
      c.n++;S.fbCount=c;S.fbQueue=(S.fbQueue||[]).concat(data).slice(-5);save();
      setView(head("Saved on this device","Your feedback will be sent when you are back online.")+'<div class="card"><p>You are offline, so your feedback is saved on this device. It will be sent automatically the next time you open the app with internet.</p><a class="btn primary mt" href="#/dashboard">Back to Dashboard</a></div>');
    }else toast("Could not send right now. Please check your internet and try again in a few minutes.");
  }
}

/* ===== SPELLING PRACTICE =====
   Words: the app says a word slowly a few times and the learner types it.
   Sentences: the app reads a short story one sentence at a time. */
const SP={mode:"words",stage:"home",list:[],i:0,right:0,wrong:[],checked:false,story:null};
function spellSet(){return Object.assign({times:3,rate:0.7,list:"all"},S.spellSet||{})}
function spellWords(kind){
  const miss=S.spell&&S.spell.wrong?Object.keys(S.spell.wrong):[];
  if(kind==="mistakes")return shuffle(WORDS.filter(w=>miss.indexOf(w.e)>=0)).slice(0,10);
  return shuffle(WORDS.filter(w=>kind==="all"||w.c===kind)).slice(0,10);
}
/* Letter by letter comparison, so the learner sees exactly which letters were wrong */
function charDiff(target,typed){
  const a=target.split(""),b=typed.split(""),n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i].toLowerCase()===b[j].toLowerCase()?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,t="",y="";
  while(i<n||j<m){
    if(i<n&&j<m&&a[i].toLowerCase()===b[j].toLowerCase()){t+=esc(a[i]);y+=esc(b[j]);i++;j++}
    else if(i<n&&(j>=m||dp[i+1][j]>=dp[i][j+1])){t+='<span class="w-miss">'+esc(a[i])+"</span>";i++}
    else{y+='<span class="w-extra">'+esc(b[j])+"</span>";j++}
  }
  return{t,y};
}
/* Word by word comparison for sentences: case and punctuation do not count, spelling does */
function sentenceDiff(target,typed){
  const key=w=>w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9']/g,"");
  const A=target.split(/\s+/).filter(Boolean),B=typed.split(/\s+/).filter(w=>key(w));
  const a=A.map(key),b=B.map(key),n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const tS=new Array(n).fill("ok"),yS=new Array(m).fill("ok"),fixes=[];
  let i=0,j=0,ok=0,mi=[],ex=[];
  const flush=()=>{
    const k=Math.min(mi.length,ex.length);
    for(let q=0;q<k;q++){tS[mi[q]]="bad";yS[ex[q]]="bad";fixes.push([B[ex[q]],A[mi[q]].replace(/[.,!?]+$/,"")])}
    mi.slice(k).forEach(x=>tS[x]="miss");ex.slice(k).forEach(x=>yS[x]="extra");mi=[];ex=[];
  };
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){flush();ok++;i++;j++}
    else if(i<n&&(j>=m||dp[i+1][j]>=dp[i][j+1]))mi.push(i++);
    else ex.push(j++);
  }
  flush();
  return{score:n?Math.round(100*ok/Math.max(n,m)):0,t:wordsHTML(A,tS),y:wordsHTML(B,yS),fixes};
}
function noteMistake(word,right){
  S.spell=S.spell||{wrong:{}};
  const w=S.spell.wrong;
  if(!right)w[word]=(w[word]||0)+1;
  else if(w[word]){w[word]--;if(!w[word])delete w[word]}
  srsResult(word,right);
}
function spellHear(){
  const o=spellSet();
  if(SP.mode==="words")sayTimes(SP.list[SP.i].e,o.times,o.rate);
  else sayTimes(SP.story.s[SP.i],Math.min(o.times,2),o.rate);
}
function pageSpelling(sub){
  SP.mode=sub==="sentences"?"sentences":"words";SP.stage="home";
  const tabs='<div class="tabs" role="tablist"><a class="tab" style="text-decoration:none" role="tab" aria-selected="'+(SP.mode==="words")+'" href="#/spelling">Step 1: Words</a><a class="tab" style="text-decoration:none" role="tab" aria-selected="'+(SP.mode==="sentences")+'" href="#/spelling/sentences">Step 2: Sentences</a></div>';
  setView(head("Spelling Practice","Listen, type what you hear, and see which letters were wrong.")+tabs+'<div class="card" id="spell-box"></div>');

}
function renderSpelling(){
  const box=$("#spell-box");if(!box)return;
  const o=spellSet(),miss=S.spell&&S.spell.wrong?Object.keys(S.spell.wrong).length:0;
  const settings='<div class="grid g3"><label class="field">Repeat each<select class="input" data-chg="sp-times">'+[1,2,3].map(n=>'<option value="'+n+'"'+(n===o.times?" selected":"")+">"+n+(n===1?" time":" times")+"</option>").join("")+"</select></label>"+
    '<label class="field">Speed<select class="input" data-chg="sp-rate">'+[[0.85,"Normal"],[0.7,"Slow"],[0.55,"Very slow"]].map(r=>'<option value="'+r[0]+'"'+(r[0]===o.rate?" selected":"")+">"+r[1]+"</option>").join("")+"</select></label>"+
    (SP.mode==="words"?'<label class="field">Words<select class="input" data-chg="sp-list">'+[["all","All words"],["General","Everyday words"],["Office","Office words"],["mistakes","My mistakes ("+miss+")"]].map(r=>'<option value="'+r[0]+'"'+(r[0]===o.list?" selected":"")+">"+r[1]+"</option>").join("")+"</select></label>":"")+"</div>";
  const back='<button class="btn block mt" data-act="sp-home">'+ic("prev")+"Back</button>";
  if(SP.stage==="home"&&SP.mode==="words"){
    box.innerHTML=settings+'<p class="muted mt">You will hear 10 words. Type each word, then press Check. Press Hear again as many times as you need.</p>'+
      (miss?'<p class="small mt"><b>Words to practise:</b> <span class="notranslate">'+esc(Object.keys(S.spell.wrong).join(", "))+"</span></p>":"")+
      '<button class="btn primary block mt" data-act="sp-start">'+ic("speaker")+"Start</button>";
    return;
  }
  if(SP.stage==="home"){
    box.innerHTML=settings+'<p class="muted mt">Choose a short story. You will hear one sentence at a time. Type it, then press Check.</p><div class="grid g2 mt">'+
      STORIES.map((st,i)=>'<button class="card quick" style="text-align:left;cursor:pointer;font:inherit" data-act="sp-story" data-v="'+i+'"><span class="stat-ic">'+ic("book")+'</span><span class="grow"><b>'+esc(st.t)+"</b><p>"+st.s.length+" sentences</p></span></button>").join("")+"</div>";
    return;
  }
  const total=SP.mode==="words"?SP.list.length:SP.story.s.length;
  if(SP.stage==="done"){
    const p=Math.round(SP.right/total*100);
    box.innerHTML='<h2>'+(SP.mode==="words"?"Round finished":"Story finished")+'</h2><p class="score-pill mt">'+SP.right+" of "+total+" correct ("+p+'%)</p><div class="mt">'+barHTML(p,"good")+"</div>"+
      (SP.wrong.length?'<p class="mt"><b>Practise these again:</b></p><ul class="mistakes notranslate">'+SP.wrong.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":'<div class="note good mt">No mistakes. Well done!</div>')+
      '<div class="row mt"><button class="btn primary" data-act="'+(SP.mode==="words"?"sp-start":"sp-again")+'">Practise again</button><button class="btn" data-act="sp-home">'+(SP.mode==="words"?"Change settings":"Choose another story")+"</button></div>";
    return;
  }
  SP.checked=false;
  box.innerHTML='<p class="small muted">'+(SP.mode==="words"?"Word ":"Sentence ")+(SP.i+1)+" of "+total+" | Correct "+SP.right+(SP.mode==="sentences"?" | "+esc(SP.story.t):"")+'</p><div class="mt">'+barHTML(SP.i/total*100)+"</div>"+
    '<div class="row mt"><button class="btn primary" data-act="sp-hear">'+ic("speaker")+'Hear again</button><button class="btn" data-act="sp-slow">'+ic("slow")+"Very slow</button>"+
    (SP.mode==="words"?'<button class="btn" data-act="sp-hint">Hint</button>':"")+'</div><p class="small muted mt" id="sp-hint" aria-live="polite"></p>'+
    '<label class="field mt">Type what you hear'+(SP.mode==="words"?'<input class="input" id="sp-input"':'<textarea class="input" id="sp-input" rows="2"')+' autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" style="font-size:1.2rem" data-enter="sp-check">'+(SP.mode==="words"?"":"</textarea>")+"</label>"+
    '<div id="sp-result" class="mt" aria-live="polite"></div><button class="btn primary block mt" id="sp-btn" data-act="sp-check">Check</button>'+back;
  $("#sp-input").focus();
  spellHear();
}
function spellCheck(){
  const inp=$("#sp-input"),btn=$("#sp-btn"),total=SP.mode==="words"?SP.list.length:SP.story.s.length;
  if(SP.checked){
    SP.i++;
    if(SP.i>=total){
      SP.stage="done";
      logScore("spelling",Math.round(SP.right/total*100));save();
    }
    renderSpelling();return;
  }
  const typed=inp.value.trim();
  if(!typed){toast("Type what you hear first.");inp.focus();return}
  SP.checked=true;inp.readOnly=true;
  let html;
  if(SP.mode==="words"){
    const W=SP.list[SP.i],right=typed.toLowerCase()===W.e.toLowerCase();
    if(right)SP.right++;else SP.wrong.push(W.e);
    noteMistake(W.e,right);
    const d=charDiff(W.e,typed);
    html=(right?'<div class="note good"><b>Correct.</b></div>':'<div class="note bad"><b>Not quite.</b> Look at the letters below.</div>')+
      '<div class="result notranslate"><p class="small muted">Correct spelling</p><p class="game-word" style="text-align:left;margin:4px 0">'+d.t+'</p>'+
      (right?"":'<p class="small muted">You typed</p><p style="font-size:1.4rem">'+d.y+'</p><div class="legend"><span class="w-miss">letter you missed</span><span class="w-extra">letter that is not needed</span></div>')+"</div>"+
      '<div class="mt">'+mean(W.b,W.h,W.e)+'</div><div class="ex row between mt"><span class="grow">'+enLine(W.x)+"</span>"+sayBtn(W.x,"Listen to example")+"</div>";
  }else{
    const t=SP.story.s[SP.i],r=sentenceDiff(t,typed);
    if(r.score===100)SP.right++;
    r.fixes.forEach(f=>SP.wrong.push(f[0]+" → "+f[1]));
    html='<div class="note '+(r.score===100?"good":"bad")+'"><b>'+(r.score===100?"Correct.":r.score+"% of words correct.")+"</b></div>"+
      '<div class="result notranslate"><p class="small muted">Correct sentence</p><p>'+r.t+"</p>"+(r.score===100?"":'<p class="small muted mt">You typed</p><p>'+r.y+"</p>")+
      (r.fixes.length?'<ul class="mistakes">'+r.fixes.map(f=>"<li>"+esc(f[0])+" → <b>"+esc(f[1])+"</b></li>").join("")+"</ul>":"")+
      (r.score===100?"":'<div class="legend"><span class="w-bad">wrong spelling</span><span class="w-miss">missing word</span><span class="w-extra">extra word</span></div>')+"</div>";
  }
  logAct("spell");save();
  $("#sp-result").innerHTML=html;
  btn.textContent=SP.i<total-1?"Next":"See result";btn.focus();
}

      }).join("")+"</div>");
